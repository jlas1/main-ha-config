  mode: single
- id: '1776724759904'
  alias: backup 2
  description: ''
  triggers: []
  conditions: []
  actions: []
  mode: single
- id: '1776737700339'
  alias: DACIA- Limit Power to 6000W
  description: ''
  triggers:
  - entity_id:
    - sensor.power_monitor_1_power_a
    above: 6000
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: sensor.ev_charger_2_status
    state: charging
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.ve2_is_throttled
      state: 'off'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ve2_saved_current
      data:
        value: '{{ states(''input_number.ev2_suggested_current'') | float }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ve2_is_throttled
  - variables:
      new_current: '{% set import_w = states(''sensor.power_monitor_1_power_a'') |
        float(6000) %} {% set current_a = states(''input_number.ev2_suggested_current'')
        | float(16) %} {% set excess_a = (import_w - 6000) / 220 %} {% set target_a
        = current_a - excess_a %} {% if target_a >= 13 %} 13 {% elif target_a >= 10
        %} 10 {% elif target_a >= 8 %} 8 {% else %} 6 {% endif %}'
  - action: input_number.set_value
    target:
      entity_id: input_number.ev2_suggested_current
    data:
      value: '{{ new_current }}'
  - action: notify.send_message
    target:
      entity_id: notify.ev_fleet_log
    data:
      message: DACIA throttled to {{ new_current }}A due to high house import.
  mode: single
- id: '1776738345940'
  alias: DACIA - Restore the 6000W capacity
  description: ''
  triggers:
  - value_template: '{% set import_w = states(''sensor.power_monitor_1_power_a'')
      | float(6000) %} {% set saved_a = states(''input_number.ve2_saved_current'')
      | float(16) %} {% set current_a = states(''input_number.ev2_suggested_current'')
      | float(6) %} {% set projected_w = import_w + ((saved_a - current_a) * 220)
      %} {{ projected_w < 5400 and is_state(''input_boolean.ve2_is_throttled'', ''on'')
      }}'
    trigger: template
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.automatic_ve2_switch
      state: 'on'
    - condition: state
      entity_id: input_boolean.manual_override_ve2_switch
      state: 'on'
  actions:
  - variables:
      saved_current: '{{ states(''input_number.ve2_saved_current'') | int(16) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.ev2_suggested_current
    data:
      value: '{{ saved_current }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.ve2_is_throttled
  - action: notify.send_message
    target:
      entity_id: notify.ev_fleet_log
    data:
      message: DACIA throttling restored to {{ saved_current }}A.
  mode: single
- id: '1776803914159'
  alias: SolaX - EV Discharge Limiter
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.ev_charger_status
    - sensor.ev_charger_2_status
  - trigger: time
    at: input_datetime.automation_ev_charge_start
  - trigger: time
    at: input_datetime.automation_ev_charge_stop
  conditions: []
  actions:
  - variables:
      is_charging: '{{ is_state(''sensor.ev_charger_status'', ''charging'') or is_state(''sensor.ev_charger_2_status'',
        ''charging'') }}'
  - if:
    - condition: template
      value_template: '{{ is_charging }}'
    then:
    - if:
      - condition: template
        value_template: '{{ states(''number.solax_battery_discharge_max_current'')
          | float(0) != 8 }}'
      then:
      - action: number.set_value
        target:
          entity_id: number.solax_battery_discharge_max_current
        data:
          value: '8'
      - action: input_number.set_value
        metadata: {}
        target:
          entity_id: input_number.victron_max_battery_power
        data:
          value: 600
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: SolaX battery discharge limited to 8A Victron to 600W  (EV actively
            charging during long window).
    else:
    - if:
      - condition: template
        value_template: '{{ states(''number.solax_battery_discharge_max_current'')
          | float(0) != 25 }}'
      then:
      - action: number.set_value
        target:
          entity_id: number.solax_battery_discharge_max_current
        data:
          value: 25
      - action: input_number.set_value
        metadata: {}
        target:
          entity_id: input_number.victron_max_battery_power
        data:
          value: 1000
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: SolaX battery discharge restored to 25A Victron to 1000W (No EV
            charging, or outside long window).
  mode: queued
- id: '1777328629505'
  alias: 'System: Low Battery Alert'
  description: Checks all batteries daily at 10:00 AM and creates a persistent notification
    if any are below 20%.
  triggers:
  - at: '10:00:00'
    trigger: time
  conditions: []
  actions:
  - variables:
      threshold: 20
      exclude_list:
      - sensor.solax_cloud_battery
      - sensor.solax_battery_capacity
      - sensor.battery_soc_simulation
      low_batteries: "{% set ns = namespace(low=[]) %}\n{# 1. Check percentage-based
        battery sensors #} {% for state in states.sensor | selectattr('attributes.device_class',
        'defined') | selectattr('attributes.device_class', '==', 'battery') %}\n  {%
        if state.state | is_number and state.state | float < threshold and state.entity_id
        not in exclude_list %}\n    {% set ns.low = ns.low + ['• ' ~ state.name ~
        ': ' ~ state.state ~ '%'] %}\n  {% endif %}\n{% endfor %}\n{# 2. Check binary
        battery sensors (State 'on' means low battery) #} {% for state in states.binary_sensor
        | selectattr('attributes.device_class', 'defined') | selectattr('attributes.device_class',
        '==', 'battery') | selectattr('state', '==', 'on') %}\n  {% if state.entity_id
        not in exclude_list %}\n    {% set ns.low = ns.low + ['• ' ~ state.name ~
        ': Low Battery'] %}\n  {% endif %}\n{% endfor %}\n{{ ns.low | join('\\n')
        }}\n"
  - condition: template
    value_template: '{{ low_batteries | length > 0 }}'
  - action: persistent_notification.create
    data:
      title: "\U0001F50B Low Battery Warning"
      message: 'The following devices need charging or new batteries:


        {{ low_batteries }}'
      notification_id: system_low_battery_alert
  mode: single
- id: '1777328953609'
  alias: 'System: Offline Z2M Device Alert'
  description: Checks Z2M 'last_seen' sensors daily at 10:00 AM. Creates a persistent
    notification if any haven't been seen in 24 hours.
  triggers:
  - at: '10:00:00'
    trigger: time
  conditions: []
  actions:
  - variables:
      hours: 24
      exclude_list:
      - sensor.example_device_last_seen
      offline_devices: "{% set ns = namespace(offline=[]) %} {% set seconds_threshold
        = hours * 3600 %}\n{% for state in states.sensor | selectattr('attributes.device_class',
        'defined') | selectattr('attributes.device_class', '==', 'timestamp') %}\n
        \ {% if 'last_seen' in state.entity_id and state.entity_id not in exclude_list
        %}\n    {% set s = state.state %}\n    \n    {# 1. Check if the device is
        hard-offline (unavailable/unknown) #}\n    {% if s in ['unavailable', 'unknown']
        %}\n      {% set clean_name = state.name | regex_replace('(?i)[ _]last[ _]seen',
        '') %}\n      {% set ns.offline = ns.offline + ['• ' ~ clean_name ~ ': Offline
        / Unavailable'] %}\n    \n    {# 2. Check if the device hasn't checked in
        within the time limit #}\n    {% else %}\n      {% set dt = as_datetime(s)
        %}\n      {% if dt != None and (now() - dt).total_seconds() > seconds_threshold
        %}\n        {% set clean_name = state.name | regex_replace('(?i)[ _]last[
        _]seen', '') %}\n        {% set ns.offline = ns.offline + ['• ' ~ clean_name
        ~ ' (Last seen: ' ~ relative_time(dt) ~ ' ago)'] %}\n      {% endif %}\n    {%
        endif %}\n  {% endif %}\n{% endfor %}\n{{ ns.offline | join('\\n') }}\n"
  - condition: template
    value_template: '{{ offline_devices | length > 0 }}'
  - action: persistent_notification.create
    data:
      title: ⚠️ Offline Device Warning
      message: 'The following Z2M devices have dropped offline:


        {{ offline_devices }}'
      notification_id: system_offline_z2m_alert
  mode: single
- id: '1777496169203'
  alias: EV Master Load Controller
  description: Dynamically adjusts EV chargers based on total capacity and suggested
    inputs, featuring an execution gatekeeper to prevent feedback loops.
  triggers:
  - alias: Trigger on EV suggested or charging current changes
    trigger: state
    entity_id:
    - input_number.ev1_suggested_current
    - input_number.ev2_suggested_current
    - number.ev_charger_charging_current
    - number.ev_charger_2_charging_current
  conditions:
  - alias: 'Gatekeeper: Halt execution if hardware already matches calculated targets'
    condition: template
    value_template: '{{ states(''number.ev_charger_charging_current'') != states(''input_number.ev1_suggested_current'')
      or states(''number.ev_charger_2_charging_current'') != states(''input_number.ev2_suggested_current'')
      }}'
  actions:
  - variables:
      max_total: 26
      ev2_master: '{{ is_state(''input_boolean.ev2_master_switch'', ''on'') }}'
      ev1_master: '{{ is_state(''input_boolean.ev1_master_switch'', ''on'') }}'
      ev2_sug: '{{ states(''input_number.ev2_suggested_current'') | float(0) }}'
      ev1_sug: '{{ states(''input_number.ev1_suggested_current'') | float(0) }}'
      ev2_cur: '{{ states(''number.ev_charger_2_charging_current'') | float(0) }}'
      ev1_cur: '{{ states(''number.ev_charger_charging_current'') | float(0) }}'
      ev2_target: '{% if ev2_sug >= 16 %} 16  {% elif ev2_sug >= 13 %} 13  {% elif
        ev2_sug >= 10 %} 10  {% elif ev2_sug >= 8 %} 8  {% elif ev2_sug >= 6 %} 6  {%
        else %} 0 {% endif %}

        '
      rem_capacity: '{{ max_total - ev2_target }}'
      ev1_raw: '{{ [ev1_sug, rem_capacity] | min }}'
      ev1_target: '{% if ev1_raw >= 16 %} 16  {% elif ev1_raw >= 13 %} 13  {% elif
        ev1_raw >= 10 %} 10  {% elif ev1_raw >= 8 %} 8  {% elif ev1_raw >= 6 %} 6  {%
        else %} 0 {% endif %}

        '
  - alias: Execute EV2 Changes
    choose:
    - conditions:
      - alias: Target is > 0 but current does not match
        condition: template
        value_template: '{{ ev2_target > 0 and ev2_cur != ev2_target }}'
      sequence:
      - alias: Log EV2 Adjustment to Fleet Log
        action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: Adjusting EV2 to {{ ev2_target }}A.
      - alias: Turn Off EV2 Master Switch to allow current change
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev2_master_switch
      - alias: Wait for charger to pause
        delay:
          seconds: 5
      - alias: Set EV2 Current
        action: number.set_value
        data:
          value: '{{ ev2_target }}'
        target:
          entity_id: number.ev_charger_2_charging_current
      - alias: Allow current settings to propagate
        delay:
          seconds: 2
      - alias: Turn On EV2 Master Switch
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev2_master_switch
  - alias: Execute EV1 Changes
    choose:
    - conditions:
      - alias: Target is > 0 but current does not match
        condition: template
        value_template: '{{ ev1_target > 0 and ev1_cur != ev1_target }}'
      sequence:
      - alias: Log EV1 Adjustment to Fleet Log
        action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'Adjusting EV1 to {{ ev1_target }}A. (Remaining pool: {{ rem_capacity
            }}A)'
      - alias: Turn Off EV1 Master Switch to allow current change
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev1_master_switch
      - alias: Wait for charger to pause
        delay:
          seconds: 5
      - alias: Set EV1 Current
        action: number.set_value
        target:
          entity_id: number.ev_charger_charging_current
        data:
          value: '{{ ev1_target }}'
      - alias: Allow current settings to propagate
        delay:
          seconds: 2
      - alias: Turn On EV1 Master Switch
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev1_master_switch
  mode: queued
  max: 10
- id: '1777934747829'
  alias: VE1 Automatic Mode
  description: ''
  triggers:
  - entity_id:
    - input_boolean.manual_override_ve_switch
    - input_boolean.automatic_ve_switch
    - input_boolean.grid_injection_avoidance_ve_switch
    - input_boolean.ev1_master_switch
    id: VE Switch changed state
    trigger: state
  - trigger: template
    value_template: '{{ states(''sensor.ev_charger_status'') == ''waiting'' }}'
    id: EV charger waiting
  - trigger: state
    entity_id: sensor.ev_charger_status
    to: charged
    for:
      minutes: 10
    id: EV charger charged
  - trigger: state
    entity_id:
    - switch.ev_charger
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: ev_switch_turned_on
  - trigger: state
    entity_id:
    - switch.ev_charger
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: ev_switch_turned_off
  conditions:
  - condition: template
    alias: If trigger is the EV switch turning ON, ensure it was done by HA
    value_template: '{{ trigger.id != ''ev_switch_turned_off'' or trigger.to_state.context.parent_id
      is not none or trigger.to_state.context.user_id is not none }}'
    enabled: false
  actions:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.manual_override_ve_switch
        state: 'on'
      - condition: state
        entity_id: input_boolean.automatic_ve_switch
        state: 'on'
      - condition: state
        entity_id: input_boolean.grid_injection_avoidance_ve_switch
        state: 'on'
    - condition: state
      entity_id: input_boolean.ev1_master_switch
      state: 'on'
    then:
    - if:
      - condition: state
        entity_id: switch.ev_charger
        state: 'off'
      - alias: Do not force ON if no car is connected
        condition: template
        value_template: '{{ states(''sensor.ev_charger_status'') != ''available''
          }}'
      then:
      - alias: Try to turn ON the EV switch up to 3 times
        repeat:
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.ev_charger
          - if:
            - condition: state
              entity_id: switch.ev_charger
              state: 'off'
            then:
            - delay:
                seconds: 5
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.ev_charger
              state: 'on'
            - condition: template
              value_template: '{{ repeat.index >= 3 }}'
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: EV switch turned ON.
      else:
      - if:
        - condition: or
          conditions:
          - condition: trigger
            id: EV charger charged
          - condition: trigger
            id: EV charger waiting
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.box_ve1
          enabled: true
        - delay:
            seconds: 5
          enabled: true
        - action: switch.turn_on
          target:
            entity_id: switch.box_ve1
          enabled: true
        - if:
          - condition: trigger
            id: EV charger charged
          then:
          - action: notify.send_message
            target:
              entity_id: notify.ev_fleet_log
            data:
              message: BOX VE cycled due to 10m charged status.
            enabled: true
          else:
          - action: notify.send_message
            target:
              entity_id: notify.ev_fleet_log
            data:
              message: BOX VE cycled due to waiting status.
            enabled: true
    else:
    - alias: Only turn OFF if it is currently ON
      if:
      - condition: state
        entity_id: switch.ev_charger
        state: 'on'
      then:
      - alias: Try to turn OFF the EV switch up to 3 times
        repeat:
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.ev_charger
          - if:
            - condition: state
              entity_id: switch.ev_charger
              state: 'on'
            then:
            - delay:
                seconds: 5
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.ev_charger
              state: 'off'
            - condition: template
              value_template: '{{ repeat.index >= 3 }}'
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: EV switch turned OFF.
  mode: queued
  max: 10
- id: '1778462483709'
  alias: Dinner time battery charge
  description: ''
  triggers:
  - trigger: time
    at: '15:55:00'
    enabled: false
  - trigger: template
    value_template: '{% set current_soc = states(''sensor.solax_battery_capacity'')
      | float(100) %} {% set p50 = states(''sensor.solcast_pv_forecast_forecast_remaining_today'')
      | float(0) %} {% set remaining_pv = state_attr(''sensor.solcast_pv_forecast_forecast_remaining_today'',
      ''estimate10'') | float(p50) %} {% set battery_capacity = 11.6 %} {% set projected_soc
      = current_soc + (remaining_pv / battery_capacity * 100) %} {{ projected_soc
      < 40 }}

      '
  conditions:
  - condition: time
    after: '15:54:00'
    before: '17:55:00'
  - condition: numeric_state
    entity_id: input_number.new_day_battery_target
    below: 40
  actions:
  - variables:
      current_soc: '{{ states(''sensor.solax_battery_capacity'') | float(100) }}'
      p50: '{{ states(''sensor.solcast_pv_forecast_forecast_remaining_today'') | float(0)
        }}'
      remaining_pv: '{{ state_attr(''sensor.solcast_pv_forecast_forecast_remaining_today'',
        ''estimate10'') | float(p50) }}'
      projected_soc: '{{ current_soc + (remaining_pv / 11.6 * 100) }}'
  - action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Warning: P10 worst-case evening SOC projected at {{ projected_soc
        | round(1) }}%. Intercepting schedule to force a safety charge until 18:00.'
  - alias: Force Start Time
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_start
    data:
      timestamp: '{{ (now() + timedelta(minutes=2)).timestamp() | int }} '
  - alias: Force Stop Time
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_stop
    data:
      timestamp: '{{ today_at(''18:00:00'').timestamp() | int }}'
  - alias: Set safety charge target
    action: input_number.set_value
    target:
      entity_id: input_number.new_day_battery_target
    data:
      value: 40
  mode: single
- id: '1778542344737'
  alias: 'System: SolaX Inverter Reboot Detected'
  description: Detects when the SolaX inverter completes a fresh boot sequence and
    forces it to unlock.
  triggers:
  - trigger: state
    entity_id: sensor.solax_run_mode
    from:
    - unavailable
    - unknown
    to: Waiting
    id: hard_reboot
  - trigger: state
    entity_id: sensor.solax_run_mode
    to: Checking
    id: safety_check
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.system_log
    data:
      message: ⚠️ SolaX Inverter reboot detected! It is currently running startup
        checks.
  - alias: Wait for inverter to resume normal operation
    wait_for_trigger:
    - trigger: state
      entity_id:
      - sensor.solax_run_mode
      to:
      - Normal Mode
    timeout: 00:05:00
    continue_on_timeout: false
  - delay:
      seconds: 5
  - alias: Force Unlock Inverter
    action: select.select_option
    target:
      entity_id: select.solax_lock_state
    data:
      option: Unlocked - Advanced
  - action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: ✅ SolaX Inverter has finished booting and was successfully forced to
        'Unlocked - Advanced'.
  mode: single
- id: '1779058473449'
  alias: 'Irrigation: Front Garden Master Controller'
  description: Handles settings, limits, cycle refills, and anomaly detection for
    the Front Garden.
  triggers:
  - trigger: state
    alias: Trigger when irrigation settings change
    entity_id:
    - input_number.front_garden_irrigation_seconds
    - input_number.front_garden_irrigation_frequency
    id: settings_changed
  - trigger: numeric_state
    alias: Trigger when cycle count drops below 80
    entity_id: number.watervalve_frontgarden_cycle_irrigation_num_times
    below: 80
    id: refill_cycles
  - trigger: state
    alias: Trigger when recalibrate button is pressed
    entity_id: input_button.front_garden_irrigation_recalibrate_baseline
    id: button_pressed
  - trigger: state
    alias: Trigger when watering cycle finishes
    entity_id: switch.watervalve_frontgarden_state
    from: 'on'
    to: 'off'
    id: watering_finished
  - trigger: state
    alias: Trigger if cycle count has NOT changed for 24 hours
    entity_id: number.watervalve_frontgarden_cycle_irrigation_num_times
    for:
      hours: 24
    id: inactive_24h
  actions:
  - variables:
      global_max_seconds: 600
  - choose:
    - conditions:
      - condition: trigger
        id: settings_changed
      sequence:
      - alias: Process Settings Update
        variables:
          total_sec: '{{ states(''input_number.front_garden_irrigation_seconds'')
            | int(0) }}'
          capped_sec: '{{ [total_sec, global_max_seconds] | min }}'
          freq: '{{ states(''input_number.front_garden_irrigation_frequency'') | int(1)
            }}'
      - if:
        - alias: Check if target duration exceeds safety limit
          condition: template
          value_template: '{{ total_sec > global_max_seconds }}'
        then:
        - alias: Enforce global maximum duration limit
          action: input_number.set_value
          target:
            entity_id: input_number.front_garden_irrigation_seconds
          data:
            value: '{{ global_max_seconds }}'
      - alias: Apply duration limit to valve
        action: number.set_value
        target:
          entity_id: number.watervalve_frontgarden_irrigation_target
        data:
          value: '{{ capped_sec }}'
      - alias: Apply frequency interval to valve
        action: number.set_value
        target:
          entity_id: number.watervalve_frontgarden_cycle_irrigation_interval
        data:
          value: '{{ (86400 / freq) | int }}'
      - alias: Reset baseline water usage
        action: input_number.set_value
        target:
          entity_id: input_number.front_garden_irrigation_baseline_water
        data:
          value: 0
      - alias: Log settings update
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Front Garden] Settings updated. Duration: {{ capped_sec }}s,
            Frequency: {{ freq }}x/day. Baseline cleared.'
    - conditions:
      - condition: trigger
        id: refill_cycles
      sequence:
      - alias: Refill valve cycle count
        action: number.set_value
        target:
          entity_id: number.watervalve_frontgarden_cycle_irrigation_num_times
        data:
          value: 100
      - alias: Log cycle refill
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Front Garden] Cycle count auto-refilled to 100.'
    - conditions:
      - condition: trigger
        id: button_pressed
      sequence:
      - alias: Reset baseline water usage manually
        action: input_number.set_value
        target:
          entity_id: input_number.front_garden_irrigation_baseline_water
        data:
          value: 0
      - alias: Log manual recalibration
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Front Garden] Baseline manually cleared by user via dashboard.'
    - conditions:
      - condition: trigger
        id: watering_finished
      sequence:
      - alias: Wait for water flow sensor to update
        delay:
          seconds: 10
      - alias: Capture consumed and baseline values
        variables:
          consumed: '{{ states(''sensor.watervalve_frontgarden_water_consumed'') |
            float(0) }}'
          baseline: '{{ states(''input_number.front_garden_irrigation_baseline_water'')
            | float(0) }}'
      - if:
        - alias: Check if baseline needs establishing
          condition: template
          value_template: '{{ baseline == 0 }}'
        then:
        - alias: Save new baseline water usage
          action: input_number.set_value
          target:
            entity_id: input_number.front_garden_irrigation_baseline_water
          data:
            value: '{{ consumed }}'
        - alias: Log new baseline
          action: notify.send_message
          target:
            entity_id: notify.irrigation
          data:
            message: '[Front Garden] New baseline established at {{ consumed }} liters.'
        else:
        - if:
          - alias: Verify if usage is out of bounds
            condition: template
            value_template: '{{ consumed > (baseline * 1.2) or consumed < (baseline
              * 0.8) }}'
          then:
          - alias: Send critical anomaly alert
            action: notify.persistent_notification
            data:
              title: "\U0001F6A8 Front Garden Flow Alert!"
              message: 'Irrigation cycle finished with abnormal water usage. Expected:
                ~{{ baseline }} L. Actually Used: {{ consumed }} L. Please check for
                blocked emitters or broken pipes!'
          - alias: Log anomaly
            action: notify.send_message
            target:
              entity_id: notify.irrigation
            data:
              message: '[Front Garden] ANOMALY! Used {{ consumed }}L (Baseline: {{
                baseline }}L).'
          else:
          - alias: Log normal completion
            action: notify.send_message
            target:
              entity_id: notify.irrigation
            data:
              message: '[Front Garden] Cycle completed normally. Used {{ consumed
                }}L.'
    - conditions:
      - condition: trigger
        id: inactive_24h
      sequence:
      - alias: Send a persistent warning to the UI
        action: notify.persistent_notification
        data:
          title: ⚠️ Front Garden Irrigation Warning
          message: No irrigation cycles have been executed in the last 24 hours. The
            controller may be offline or the valve is stuck.
      - alias: Log inactivity warning
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Front Garden] WARNING: No irrigation cycles detected in the last
            24 hours!'
  mode: single
- id: '1779226254661'
  alias: 'Irrigation: Side Garden Master Controller'
  description: Handles settings, limits, cycle refills, and anomaly detection for
    the Side Garden.
  triggers:
  - trigger: state
    alias: Trigger when irrigation settings change
    entity_id:
    - input_number.side_garden_irrigation_seconds
    - input_number.side_garden_irrigation_frequency
    id: settings_changed
  - trigger: numeric_state
    alias: Trigger when cycle count drops below 80
    entity_id: number.watervalve_sidegarden_cycle_irrigation_num_times
    below: 80
    id: refill_cycles
  - trigger: state
    alias: Trigger when recalibrate button is pressed
    entity_id: input_button.side_garden_irrigation_recalibrate_baseline
    id: button_pressed
  - trigger: state
    alias: Trigger when watering cycle finishes
    entity_id: switch.watervalve_sidegarden_state
    from: 'on'
    to: 'off'
    id: watering_finished
  - trigger: state
    alias: Trigger if cycle count has NOT changed for 24 hours
    entity_id: number.watervalve_sidegarden_cycle_irrigation_num_times
    for:
      hours: 24
    id: inactive_24h
  actions:
  - variables:
      global_max_seconds: 600
  - choose:
    - conditions:
      - condition: trigger
        id: settings_changed
      sequence:
      - alias: Process Settings Update
        variables:
          total_sec: '{{ states(''input_number.side_garden_irrigation_seconds'') |
            int(0) }}'
          capped_sec: '{{ [total_sec, global_max_seconds] | min }}'
          freq: '{{ states(''input_number.side_garden_irrigation_frequency'') | int(1)
            }}'
      - if:
        - condition: template
          value_template: '{{ total_sec > global_max_seconds }}'
        then:
        - alias: Enforce global maximum duration limit
          action: input_number.set_value
          target:
            entity_id: input_number.side_garden_irrigation_seconds
          data:
            value: '{{ global_max_seconds }}'
      - alias: Apply duration limit to valve
        action: number.set_value
        target:
          entity_id: number.watervalve_sidegarden_irrigation_target
        data:
          value: '{{ capped_sec }}'
      - alias: Apply frequency interval to valve
        action: number.set_value
        target:
          entity_id: number.watervalve_sidegarden_cycle_irrigation_interval
        data:
          value: '{{ (86400 / freq) | int }}'
      - alias: Reset baseline water usage
        action: input_number.set_value
        target:
          entity_id: input_number.side_garden_irrigation_baseline_water
        data:
          value: 0
      - alias: Log settings update
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Side Garden] Settings updated. Duration: {{ capped_sec }}s, Frequency:
            {{ freq }}x/day. Baseline cleared.'
    - conditions:
      - condition: trigger
        id: refill_cycles
      sequence:
      - alias: Refill valve cycle count
        action: number.set_value
        target:
          entity_id: number.watervalve_sidegarden_cycle_irrigation_num_times
        data:
          value: 100
      - alias: Log cycle refill
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Side Garden] Cycle count auto-refilled to 100.'
    - conditions:
      - condition: trigger
        id: button_pressed
      sequence:
      - alias: Reset baseline water usage manually
        action: input_number.set_value
        target:
          entity_id: input_number.side_garden_irrigation_baseline_water
        data:
          value: 0
      - alias: Log manual recalibration
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Side Garden] Baseline manually cleared by user via dashboard.'
    - conditions:
      - condition: trigger
        id: watering_finished
      sequence:
      - alias: Wait for water flow sensor to update
        delay:
          seconds: 10
      - alias: Capture consumed and baseline values
        variables:
          consumed: '{{ states(''sensor.watervalve_sidegarden_water_consumed'') |
            float(0) }}'
          baseline: '{{ states(''input_number.side_garden_irrigation_baseline_water'')
            | float(0) }}'
      - if:
        - alias: Check if baseline needs establishing
          condition: template
          value_template: '{{ baseline == 0 }}'
        then:
        - alias: Save new baseline water usage
          action: input_number.set_value
          target:
            entity_id: input_number.side_garden_irrigation_baseline_water
          data:
            value: '{{ consumed }}'
        - alias: Log new baseline
          action: notify.send_message
          target:
            entity_id: notify.irrigation
          data:
            message: '[Side Garden] New baseline established at {{ consumed }} liters.'
        else:
        - if:
          - alias: Verify if usage is out of bounds
            condition: template
            value_template: '{{ consumed > (baseline * 1.2) or consumed < (baseline
              * 0.8) }}'
          then:
          - alias: Send critical anomaly alert
            action: notify.persistent_notification
            data:
              title: "\U0001F6A8 Side Garden Flow Alert!"
              message: 'Irrigation cycle finished with abnormal water usage. Expected:
                ~{{ baseline }} L. Actually Used: {{ consumed }} L. Please check for
                blocked emitters or broken pipes!'
          - alias: Log anomaly
            action: notify.send_message
            target:
              entity_id: notify.irrigation
            data:
              message: '[Side Garden] ANOMALY! Used {{ consumed }}L (Baseline: {{
                baseline }}L).'
          else:
          - alias: Log normal completion
            action: notify.send_message
            target:
              entity_id: notify.irrigation
            data:
              message: '[Side Garden] Cycle completed normally. Used {{ consumed }}L.'
    - conditions:
      - condition: trigger
        id: inactive_24h
      sequence:
      - alias: Send a persistent warning to the UI
        action: notify.persistent_notification
        data:
          title: ⚠️ Side Garden Irrigation Warning
          message: No irrigation cycles have been executed in the last 24 hours. The
            controller may be offline or the valve is stuck.
      - alias: Log inactivity warning
        action: notify.send_message
        target:
          entity_id: notify.irrigation
        data:
          message: '[Side Garden] WARNING: No irrigation cycles detected in the last
            24 hours!'
  mode: single
- id: '1779648576510'
  alias: 'Phase 2: Inverter Window Update Scheduling'
  description: Pushes the calculated charging windows and defaults the upper SOC to
    15% while the inverter is awake.
  triggers:
  - trigger: state
    entity_id:
    - input_datetime.solax_night_charge_start
    - input_datetime.solax_night_charge_stop
    - input_datetime.solax_day_charge_start
    - input_datetime.solax_day_charge_stop
    id: phase1_complete
  - trigger: time
    at:
      entity_id: input_datetime.solax_night_charge_stop
      offset: '60'
    id: safety_fallback
  conditions:
  - condition: time
    after: 08:00:00
    before: '19:00:00'
    enabled: false
  actions:
  - alias: Unlock Inverter Settings
    action: select.select_option
    target:
      entity_id: select.solax_lock_state
    data:
      option: Unlocked - Advanced
  - delay:
      seconds: 2
  - alias: Default Night Charge Upper SOC to 15%
    action: number.set_value
    target:
      entity_id: number.solax_selfuse_nightcharge_upper_soc
    data:
      value: 15
  - delay:
      seconds: 2
  - alias: Set Period 1 Start Time
    action: time.set_value
    target:
      entity_id:
      - time.garage_solax_inverter_charge_start_1
    data:
      time: '{{ state_attr(''input_datetime.solax_night_charge_start'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 1
  - alias: Set Period 1 End Time
    action: time.set_value
    target:
      entity_id:
      - time.garage_solax_inverter_charge_end_1
    data:
      time: '{{ state_attr(''input_datetime.solax_night_charge_stop'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 1
  - alias: Enable Period 1
    action: switch.turn_on
    target:
      entity_id: switch.garage_solax_inverter_selfuse_night_charge
  - delay:
      seconds: 2
  - alias: Set Period 2 Start Time
    action: time.set_value
    target:
      entity_id:
      - time.garage_solax_inverter_charge_start_2
    data:
      time: '{{ state_attr(''input_datetime.solax_day_charge_start'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 1
  - alias: Set Period 2 End Time
    action: time.set_value
    target:
      entity_id:
      - time.garage_solax_inverter_charge_end_2
    data:
      time: '{{ state_attr(''input_datetime.solax_day_charge_stop'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 1
  - alias: Enable Period 2
    action: switch.turn_on
    target:
      entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
  - alias: Log Path Action
    action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Phase 2 Complete: Inverter hardware schedules successfully updated
        and Upper SOC defaulted to 15%.'
  mode: single
- id: '1779657880319'
  alias: 'Phase 4 & 5: Battery Execution & EV Throttle via Modbus'
  description: Executes targets, intercepts excess charge, and limits battery drain
    when EVs are active.
  triggers:
  - trigger: time
    at: input_datetime.solax_night_charge_start
    id: start_night
  - trigger: time
    at: input_datetime.solax_night_charge_stop
    id: stop_night
  - trigger: time
    at: input_datetime.solax_day_charge_start
    id: start_day
  - trigger: time
    at: input_datetime.solax_day_charge_stop
    id: stop_day
  - trigger: template
    value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100) <=
      (states(''input_number.new_battery_target'') | float(0) + 1) }}'
    id: drain_night_reached
  - trigger: template
    value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100) <=
      (states(''input_number.new_day_battery_target'') | float(0) + 1) }}'
    id: drain_day_reached
  - trigger: template
    value_template: '{{ states(''sensor.garage_gx_device_dc_battery_charge'') | float(100)
      <= (states(''input_number.new_battery_target'') | float(0) + 11) }}'
    id: drain_night_reached_victron
  - trigger: template
    value_template: '{{ states(''sensor.garage_gx_device_dc_battery_charge'') | float(100)
      <= (states(''input_number.new_day_battery_target'') | float(0) + 11) }}'
    id: drain_day_reached_victron
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start_night
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100)
            <= states(''input_number.new_battery_target'') | float(0) }} '
        then:
        - alias: Enable Charge from Grid
          action: switch.turn_on
          target:
            entity_id: switch.garage_solax_inverter_selfuse_night_charge
        - delay:
            seconds: 1
        - alias: Set Upper SOC to Real Target
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_nightcharge_upper_soc
          data:
            value: '{{ states(''input_number.new_battery_target'') | int(60) - 5 }}'
        - alias: Log Path A Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Night: Charging needed. Grid enabled, Upper SOC set
              to {{ states(''input_number.new_battery_target'') }}%.'
        else:
        - alias: Collapse Night Window (Start = End)
          action: time.set_value
          target:
            entity_id: time.garage_solax_inverter_charge_start_1
          data:
            time: '{{ state_attr(''input_datetime.solax_night_charge_stop'', ''timestamp'')
              | timestamp_custom(''%H:%M:%S'', true) }}'
        - delay:
            seconds: 2
        - alias: Set Discharge Floor to Target SOC
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_discharge_min_soc
          data:
            value: '{{ states(''input_number.new_battery_target'') | int(60) }}'
        - alias: Log Path B Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Night: Excess energy ({{ states(''sensor.solax_battery_capacity'')
              }}%). Window collapsed, draining to {{ states(''input_number.new_battery_target'')
              }}%.'
      - if:
        - condition: template
          value_template: '{{ states(''sensor.garage_gx_device_dc_battery_charge'')
            | float(100) <= states(''input_number.new_battery_target'') | float(0)
            + 10 }}'
        then:
        - alias: Enable Charge from Grid
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.force_battery_charge
        - action: input_number.set_value
          alias: Copy battery value to victron control loop
          data:
            value: '{{ states(''input_number.new_battery_target'') | float + 10 }}'
          target:
            entity_id: input_number.victron_battery_charge_level
        - alias: Log Path A Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Night: Force Charging enabled and battery charge set
              Victron SOC {{ states(''sensor.garage_gx_device_dc_battery_charge'')
              }} less than  {{ states(''input_number.new_battery_target'') | float
              + 10 }}%.'
        else:
        - action: input_boolean.turn_off
          target:
            entity_id:
            - input_boolean.force_battery_charge
          alias: Disable Charge from Grid
          data: {}
    - conditions:
      - condition: trigger
        id: start_day
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100)
            <= states(''input_number.new_day_battery_target'') | float(0) }}'
        then:
        - alias: Set Upper SOC to Real Day Target
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_nightcharge_upper_soc
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | int(60) -
              5  }}'
        - action: switch.turn_on
          metadata: {}
          target:
            entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
          data: {}
          alias: Turn of charging period2
        - alias: Log Path A Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day: Charging needed. Upper SOC set to {{ states(''input_number.new_day_battery_target'')}}%,
              Charge period2 enabled .'
        else:
        - alias: Disable Day Period
          action: switch.turn_off
          target:
            entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        - delay:
            seconds: 2
        - alias: Set Discharge Floor to Day Target SOC
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_discharge_min_soc
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | int(60) }}'
        - alias: Log Path B Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day: Excess energy ({{ states(''sensor.solax_battery_capacity'')
              }}%). Period 2 disabled, draining to {{ states(''input_number.new_day_battery_target'')
              }}%.'
      - if:
        - condition: template
          value_template: '{{ states(''sensor.garage_gx_device_dc_battery_charge'')
            | float(100) <= states(''input_number.new_day_battery_target'') | float(0)
            + 10 }}'
        then:
        - alias: Enable Charge from Grid
          action: input_boolean.turn_on
          data: {}
          target:
            entity_id: input_boolean.force_battery_charge
        - action: input_number.set_value
          alias: Copy battery value to victron control loop
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | float + 10
              }}'
          target:
            entity_id: input_number.victron_battery_charge_level
        - alias: Log Path A Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day: Force Charging enable and battery charge set Victron
              SOC {{ states(''sensor.garage_gx_device_dc_battery_charge'') }} less
              than  {{ states(''input_number.new_day_battery_target'') | float + 10
              }}%.'
        else:
        - action: input_boolean.turn_off
          target:
            entity_id:
            - input_boolean.force_battery_charge
          alias: Disable Charge from Grid
          data: {}
    - conditions:
      - condition: trigger
        id: drain_night_reached
      - condition: template
        value_template: "{% set start = state_attr('input_datetime.solax_night_charge_start',
          'timestamp') | float(0) %}\n{% set stop = state_attr('input_datetime.solax_night_charge_stop',
          'timestamp') | float(0) %} \n{{ start <= now().timestamp() < stop }}"
      - condition: template
        value_template: '{{ states(''time.solax_inverter_charger_start_time_1'') ==
          states(''time.solax_inverter_charger_end_time_1'') }}'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Floor
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - delay:
          seconds: 2
      - alias: Set Target SOC to lock battery
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_nightcharge_upper_soc
        data:
          value: '{{ states(''input_number.new_battery_target'') | int(60) - 5 }}'
      - delay:
          seconds: 2
      - alias: 'Rebuild Window: Set Start Time to Now'
        action: time.set_value
        target:
          entity_id: time.garage_solax_inverter_charge_start_1
        data:
          time: '{{ now().strftime(''%H:%M:%S'') }}'
      - alias: Log Night Drain Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept: Night drain hit {{ states(''sensor.solax_battery_capacity'')
            }}%. Rebuilt charging window to safely lock battery.'
    - conditions:
      - condition: trigger
        id:
        - drain_night_reached_victron
      - condition: template
        value_template: "{% set start = state_attr('input_datetime.solax_night_charge_start',
          'timestamp') | float(0) %}\n{% set stop = state_attr('input_datetime.solax_night_charge_stop',
          'timestamp') | float(0) %} \n{{ start <= now().timestamp() < stop }}"
      sequence:
      - action: input_number.set_value
        alias: Copy battery value to victron control loop
        data:
          value: '{{ states(''input_number.new_battery_target'') | float + 10 }}'
        target:
          entity_id: input_number.victron_battery_charge_level
      - alias: Log Path A Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night: Set Victron charging to {{ states(''input_number.new_battery_target'')
            | float + 10 }}%.'
      - alias: Enable Charge from Grid
        action: input_boolean.turn_on
        data: {}
        target:
          entity_id: input_boolean.force_battery_charge
      - alias: Log Path A Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night: Force Charging enabled. Victron SOC {{ states(''sensor.garage_gx_device_dc_battery_charge'')
            }} less than  {{ states(''input_number.new_battery_target'') | float +
            10 }}%.'
    - conditions:
      - condition: trigger
        id: drain_day_reached
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_day_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_day_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      - condition: state
        entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        state: 'off'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Floor
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - delay:
          seconds: 2
      - alias: Set Day Target SOC to lock battery
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_nightcharge_upper_soc
        data:
          value: '{{ states(''input_number.new_day_battery_target'') | int(60) - 5
            }}'
      - delay:
          seconds: 2
      - alias: Set Start Time to Actual Time
        action: time.set_value
        target:
          entity_id: time.garage_solax_inverter_charge_start_2
        data:
          time: '{{ now().strftime(''%H:%M:%S'') }}'
      - delay:
          seconds: 1
      - alias: Re-Enable Day Period
        action: switch.turn_on
        target:
          entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
      - alias: Log Day Drain Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept: Day drain hit {{ states(''sensor.solax_battery_capacity'')
            }}%. Re-enabled Period 2 to safely lock battery.'
    - conditions:
      - condition: trigger
        id:
        - drain_day_reached_victron
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_day_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_day_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      sequence:
      - action: input_number.set_value
        alias: Copy battery value to victron control loop
        data:
          value: '{{ states(''input_number.new_day_battery_target'') | float + 10
            }}'
        target:
          entity_id: input_number.victron_battery_charge_level
      - alias: Log Path A Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Day: Set Victron charging to {{ states(''input_number.new_battery_target'')
            | float + 10 }}%.'
      - alias: Enable Charge from Grid
        action: input_boolean.turn_on
        data: {}
        target:
          entity_id: input_boolean.force_battery_charge
      - alias: Log Path A Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Day: Force Charging enabled. Victron SOC {{ states(''sensor.garage_gx_device_dc_battery_charge'')
            }} less than  {{ states(''input_number.new_battery_target'') | float +
            10 }}%.'
    - conditions:
      - condition: trigger
        id: stop_night
      - condition: template
        alias: Check if either EV is actively charging (> 50W)
        value_template: '{{ states(''sensor.box_ve1_power'') | float(0) > 50 or states(''sensor.box_ve2_power'')
          | float(0) > 50 }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.force_battery_charge
        alias: Disable Charge from Grid
        data: {}
      - alias: Night revert SOC
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night: disabling battery force charge'
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Throttle Battery Discharge (Limit to 3 via Amps)
        action: number.set_value
        target:
          entity_id: number.solax_battery_discharge_max_current
        data:
          value: 3
      - action: input_number.set_value
        metadata: {}
        target:
          entity_id: input_number.victron_max_battery_power
        data:
          value: 300
      - alias: Log EV Throttle Active
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 5: Night window closed but EVs are charging. Battery discharge
            throttled to 3A (and 300W) to protect house reserves.'
      - alias: Set Discharge Floor to Target SOC
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - alias: Night revert SOC
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night: reverting minimum SOC to 11'
      - alias: Wait for EVs to finish or time window to close
        wait_for_trigger:
        - alias: Both EVs drop below 50W
          value_template: '{{ states(''sensor.box_ve1_power'') | float(0) < 50 and
            states(''sensor.box_ve2_power'') | float(0) < 50 }}'
          trigger: template
        - alias: The EV schedule time block ends
          value_template: '{% set stop1 = state_attr(''input_datetime.automation_ev_charge_stop'',
            ''timestamp'') | float(0) %} {% set stop2 = state_attr(''input_datetime.automation_ev2_charge_stop'',
            ''timestamp'') | float(0) %} {{ now().timestamp() >= [stop1, stop2] |
            max }}'
          trigger: template
      - alias: Unlock Inverter Settings (Post-Wait)
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Battery Discharge to Normal (25A)
        action: number.set_value
        target:
          entity_id: number.solax_battery_discharge_max_current
        data:
          value: 25
      - action: input_number.set_value
        metadata: {}
        target:
          entity_id: input_number.victron_max_battery_power
        data:
          value: 1000
      - alias: Log EV Throttle Released
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 5: EVs finished charging or schedule ended. Battery discharge
            restored to full capacity (25A/1000W).'
    - conditions:
      - condition: trigger
        id: stop_night
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.force_battery_charge
        alias: Disable Charge from Grid
        data: {}
      - alias: Disabling battery force charge
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night: disabling battery force charge'
    - conditions:
      - condition: trigger
        id:
        - stop_day
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.force_battery_charge
        alias: Disable Charge from Grid
        data: {}
      - alias: Disabling battery force charge
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Day: disabling battery force charge'
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Unlock Inverter Settings (Post-Wait)
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Set Discharge Floor to Target SOC
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - alias: Day revert SOC
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Day: reverting minimum SOC to 11'
  mode: parallel
  max: 10
- id: '1779838729287'
  alias: 'Shades: Detect Manual Override'
  description: Locks out auto-shading for a specific blind if a user manually moves
    it.
  triggers:
  - trigger: state
    entity_id: cover.blinds_stairs
    id: lateral
  - trigger: state
    entity_id: cover.blinds_patio
    id: patio
  - trigger: state
    entity_id: cover.blinds_dinner
    id: dinner
  - trigger: state
    entity_id: cover.blinds_lara
    id: lara
  - trigger: state
    entity_id: cover.blinds_kitchen
    id: kitchen
  - trigger: state
    entity_id: cover.blinds_lucas
    id: lucas
  - trigger: state
    entity_id: cover.blinds_suite
    id: master_suite
  - trigger: state
    entity_id: cover.blinds_master_bathroom
    id: master_bathroom
  - trigger: state
    entity_id: cover.blinds_front_garden
    id: entrada
  conditions:
  - alias: Ignore unavailability state drops
    condition: template
    value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown'] and\n
      \  trigger.from_state.state not in ['unavailable', 'unknown'] }}\n   "
  - alias: Ensure an actual physical movement or state change occurred
    condition: template
    value_template: "{{ trigger.from_state.attributes.current_position != trigger.to_state.attributes.current_position
      }}\n   "
  - condition: or
    conditions:
    - alias: UI Interaction (User pressed a button on the dashboard)
      condition: template
      value_template: '{{ trigger.to_state.context.user_id is not none }}'
    - alias: Physical Remote Interaction
      condition: and
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.context.parent_id is none }}'
      - alias: Buffer window for local Zigbee reporting
        condition: template
        value_template: '{% set last_run = state_attr(''automation.climate_dynamic_solar_shading'',
          ''last_triggered'') %}  {{ last_run == none or (now() - last_run | as_datetime
          | as_local).total_seconds() > 40 }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: "{% if trigger.id == 'lateral' %}\n  input_boolean.lateral_shades_manual_override
        \n{% elif trigger.id == 'patio' %} \n  input_boolean.patio_shades_manual_override
        \n{% elif trigger.id == 'dinner' %} \n  input_boolean.dinner_shades_manual_override
        \n{% elif trigger.id == 'kitchen' %} \n  input_boolean.kitchen_shades_manual_override\n{%
        elif trigger.id == 'lara' %}\n  input_boolean.lara_shades_manual_override
        \n{% elif trigger.id == 'lucas' %} \n  input_boolean.lucas_shades_manual_override
        \n{% elif trigger.id == 'master_suite' %} \n  input_boolean.master_suite_shades_manual_override
        \n{% elif trigger.id == 'master_bathroom' %}\n  input_boolean.master_bathroom_shades_manual_override
        \n{% elif trigger.id == 'entrada' %} \n  input_boolean.entrada_cover_manual_override
        \n{% endif %}"
    data: {}
  - alias: Log the debug data to the file
    action: notify.send_message
    data:
      message: '{% set last_run = state_attr(''automation.climate_dynamic_solar_shading'',
        ''last_triggered'') %} {% set raw_diff = (now() - last_run | as_datetime |
        as_local).total_seconds() | round(1) if last_run else ''N/A'' %} {% set time_diff
        = raw_diff if raw_diff == ''N/A'' or raw_diff <= 300 else ''> 300'' %} {{
        now().strftime(''%Y-%m-%d %H:%M:%S'') }} - OVERRIDE DETECTED: {{ trigger.entity_id
        }} State Change: {{ trigger.from_state.state }} -> {{ trigger.to_state.state
        }} Position Change: {{ trigger.from_state.attributes.current_position | default(''N/A'')
        }} -> {{ trigger.to_state.attributes.current_position | default(''N/A'') }}
        Context User_ID: {{ trigger.to_state.context.user_id | default(''None'') }}
        Context Parent_ID: {{ trigger.to_state.context.parent_id | default(''None'')
        }} Seconds since Main Automation Ran: {{ time_diff }}'
    target:
      entity_id: notify.house_control_log
  mode: parallel
- id: '1779838929003'
  alias: 'Climate: Dynamic Solar Shading'
  description: Enforces shadow math, wind safety, and thermal ratchets across all
    zones.
  triggers:
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: state
    entity_id: input_boolean.shades_master_switch
    state: 'on'
  actions:
  - alias: Process NE Unobstructed Blinds (Lara & Lucas at 5°)
    repeat:
      for_each:
      - cover: cover.blinds_lara
        override: input_boolean.lara_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      - cover: cover.blinds_lucas
        override: input_boolean.lucas_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      sequence:
      - if:
        - alias: Check if Manual Override is inactive
          condition: template
          value_template: '{{ is_state(repeat.item.override, ''off'') }}'
        then:
        - variables:
            t: '{{ states(repeat.item.sensor) | int(100) }}'
            cur: '{{ state_attr(repeat.item.cover, ''current_position'') | int(100)
              }}'
            el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
            hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
            target: '{% if el < 5 %} 100 {% else %} {{ [t, cur] | min if hot else
              t }} {% endif %}'
        - if:
          - condition: or
            conditions:
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target - cur) | abs > 5 }}'
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target | abs) > 95 }}'
          then:
          - alias: Execute Native End-Stops or Mid-Point Sequence
            choose:
            - alias: 'Hard Limit: Fully Open'
              conditions:
              - condition: template
                value_template: '{{ target == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            - alias: 'Hard Limit: Fully Closed'
              conditions:
              - condition: template
                value_template: '{{ target == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            default:
            - alias: 'Tuya Workaround: Wake, Stop, and Move'
              action: cover.stop_cover
              target:
                entity_id: '{{ repeat.item.cover }}'
            - delay: 00:00:02
            - action: cover.set_cover_position
              target:
                entity_id: '{{ repeat.item.cover }}'
              data:
                position: '{{ target }}'
  - alias: Process NE Obstructed Blinds (Patio, Dinner, Kitchen at 18°)
    repeat:
      for_each:
      - cover: cover.blinds_patio
        override: input_boolean.patio_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      - cover: cover.blinds_dinner
        override: input_boolean.dinner_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      - cover: cover.blinds_kitchen
        override: input_boolean.kitchen_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      sequence:
      - if:
        - alias: Check if Manual Override is inactive
          condition: template
          value_template: '{{ is_state(repeat.item.override, ''off'') }}'
        then:
        - variables:
            t: '{{ states(repeat.item.sensor) | int(100) }}'
            cur: '{{ state_attr(repeat.item.cover, ''current_position'') | int(100)
              }}'
            el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
            hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
            raw_target: '{% if el < 18 %} 100 {% else %} {{ [t, cur] | min if hot
              else t }} {% endif %}'
            target: "{% if repeat.item.cover == 'cover.blinds_patio' %}\n  {{ [raw_target
              | int, 50] | max }}\n{% else %}\n  {{ raw_target | int }}\n{% endif
              %}"
        - if:
          - condition: or
            conditions:
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target - cur) | abs > 5 }}'
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target | abs) > 95 }}'
          then:
          - alias: Execute Native End-Stops or Mid-Point Sequence
            choose:
            - alias: 'Hard Limit: Fully Open'
              conditions:
              - condition: template
                value_template: '{{ target == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            - alias: 'Hard Limit: Fully Closed'
              conditions:
              - condition: template
                value_template: '{{ target == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            default:
            - alias: 'Tuya Workaround: Wake, Stop, and Move'
              action: cover.stop_cover
              target:
                entity_id: '{{ repeat.item.cover }}'
            - delay: 00:00:02
            - action: cover.set_cover_position
              target:
                entity_id: '{{ repeat.item.cover }}'
              data:
                position: '{{ target }}'
  - alias: Process SW/NW Standard Blinds (Suite, Bathroom, Stairs at 9°)
    repeat:
      for_each:
      - cover: cover.blinds_suite
        override: input_boolean.master_suite_shades_manual_override
        sensor: sensor.optimal_shade_position_master_suite
      - cover: cover.blinds_master_bathroom
        override: input_boolean.master_bathroom_shades_manual_override
        sensor: sensor.optimal_shade_position_master_bathroom
      - cover: cover.blinds_stairs
        override: input_boolean.lateral_shades_manual_override
        sensor: sensor.optimal_shade_position_lateral
      sequence:
      - if:
        - alias: Check if Manual Override is inactive
          condition: template
          value_template: '{{ is_state(repeat.item.override, ''off'') }}'
        then:
        - variables:
            t: '{{ states(repeat.item.sensor) | int(100) }}'
            cur: '{{ state_attr(repeat.item.cover, ''current_position'') | int(100)
              }}'
            el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
            hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
            target: '{% if el < 9 %} 100 {% else %} {{ [t, cur] | min if hot else
              t }} {% endif %}'
        - if:
          - condition: or
            conditions:
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target - cur) | abs > 5 }}'
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target | abs) > 95 }}'
          then:
          - alias: Execute Native End-Stops or Mid-Point Sequence
            choose:
            - alias: 'Hard Limit: Fully Open'
              conditions:
              - condition: template
                value_template: '{{ target == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            - alias: 'Hard Limit: Fully Closed'
              conditions:
              - condition: template
                value_template: '{{ target == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            default:
            - alias: 'Tuya Workaround: Wake, Stop, and Move'
              action: cover.stop_cover
              target:
                entity_id: '{{ repeat.item.cover }}'
            - delay: 00:00:02
            - action: cover.set_cover_position
              target:
                entity_id: '{{ repeat.item.cover }}'
              data:
                position: '{{ target }}'
  - alias: Process Front Garden Awning (Safety Gates & Reverse Ratchet)
    if:
    - condition: state
      entity_id: input_boolean.entrada_cover_manual_override
      state: 'off'
    then:
    - variables:
        t: '{{ states(''sensor.optimal_shade_position_entrada_cover'') | int(0) }}'
        cur: '{{ state_attr(''cover.blinds_front_garden'', ''current_position'') |
          int(0) }}'
        el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
        az: '{{ state_attr(''sun.sun'', ''azimuth'') | float(0) }}'
        wind: '{{ states(''sensor.weatherstation_wind_gust'') | float(0) }}'
        hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
        target: "{%- if el < 9 or az > 325 or wind > 40 -%}\n  0\n{%- elif wind >
          25 -%}\n  {%- set wind_capped = [t, 40] | min -%}\n  {{- [[t, cur] | max,
          40] | min if hot else wind_capped -}}\n{%- else -%}\n  {{- [t, cur] | max
          if hot else t -}}\n{%- endif -%}"
    - if:
      - condition: or
        conditions:
        - alias: Check if target position drifted more than 5%
          condition: template
          value_template: '{{ (target | int - cur) | abs > 5 }}'
        - alias: Force execution if target is an exact end-stop (0 or 100)
          condition: template
          value_template: '{{ (target | int) > 95 or (target | int) < 5 }}'
      then:
      - alias: Execute Native End-Stops or Mid-Point Sequence
        choose:
        - alias: 'Hard Limit: Fully Extended'
          conditions:
          - condition: template
            value_template: '{{ (target | int) == 100 }}'
          sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.blinds_front_garden
        - alias: 'Hard Limit: Fully Retracted'
          conditions:
          - condition: template
            value_template: '{{ (target | int) == 0 }}'
          sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.blinds_front_garden
        default:
        - alias: 'Tuya Workaround: Wake, Stop, and Move'
          action: cover.stop_cover
          target:
            entity_id: cover.blinds_front_garden
        - delay: 00:00:02
        - action: cover.set_cover_position
          target:
            entity_id: cover.blinds_front_garden
          data:
            position: '{{ target | int }}'
  mode: parallel
- id: '1779839800530'
  alias: 'Shades: Disable System at Sunset'
  description: Turns off the master switch and clears manual overrides for the next
    day.
  triggers:
  - trigger: sun
    event: sunset
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.shades_master_switch
      - input_boolean.lateral_shades_manual_override
      - input_boolean.patio_shades_manual_override
      - input_boolean.dinner_shades_manual_override
      - input_boolean.kitchen_shades_manual_override
      - input_boolean.lara_shades_manual_override
      - input_boolean.lucas_shades_manual_override
      - input_boolean.master_suite_shades_manual_override
      - input_boolean.master_bathroom_shades_manual_override
      - input_boolean.entrada_cover_manual_override
    data: {}
  - action: cover.close_cover
    metadata: {}
    target:
      entity_id: cover.blinds_front_garden
    data: {}
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.sonoff_10020744e0_1
    data: {}
  mode: single
- id: '1779839900378'
  alias: 'Shades: Manual Enable System'
  description: Turns on the Master Switch and forces an immediate position check.
  triggers: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.shades_master_switch
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.lateral_shades_manual_override
      - input_boolean.patio_shades_manual_override
      - input_boolean.dinner_shades_manual_override
      - input_boolean.kitchen_shades_manual_override
      - input_boolean.lara_shades_manual_override
      - input_boolean.lucas_shades_manual_override
      - input_boolean.master_suite_shades_manual_override
      - input_boolean.master_bathroom_shades_manual_override
      - input_boolean.entrada_cover_manual_override
  - action: automation.trigger
    target:
      entity_id: automation.climate_dynamic_solar_shading
  mode: single
- id: '1780052555532'
  alias: 'Shades: Auto-Toggle Hot Day Mode'
  description: Engages the one-way heat shield ratchet when it gets hot outside.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.weatherstation_outdoor_temperature
    above: 24
    id: hot
  - trigger: numeric_state
    entity_id: sensor.weatherstation_outdoor_temperature
    below: 21
    id: cool
  actions:
  - choose:
    - conditions: '{{ trigger.id == ''hot'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hot_day_heat_shield
    - conditions: '{{ trigger.id == ''cool'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hot_day_heat_shield
  mode: single
- id: '1781217166369'
  alias: 'Shades: Tuya Control Switch to Front Garden Awning'
  description: Mirrors UP/DOWN/STOP from the Tuya switch sensor directly to the physical
    awning.
  triggers:
  - trigger: state
    entity_id: sensor.front_garden_blinds_control_moving
    to: UP
    id: up
  - trigger: state
    entity_id: sensor.front_garden_blinds_control_moving
    to: DOWN
    id: down
  - trigger: state
    entity_id: sensor.front_garden_blinds_control_moving
    to: STOP
    id: stop
  actions:
  - choose:
    - alias: 'Command: UP'
      conditions:
      - condition: trigger
        id: up
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.blinds_front_garden
    - alias: 'Command: DOWN'
      conditions:
      - condition: trigger
        id: down
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.blinds_front_garden
    - alias: 'Command: STOP'
      conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: cover.stop_cover
        target:
          entity_id: cover.blinds_front_garden
  mode: restart
- id: '1781307008808'
  alias: 'Shades: Reset Tuya Switch when Awning Stops'
  description: Disengages the wall switch relay when the awning finishes moving so
    the next physical button press acts as a fresh command.
  triggers:
  - alias: The awning was opening or closing, but has now stopped
    trigger: state
    entity_id: cover.blinds_front_garden
    from:
    - opening
    - closing
  conditions:
  - alias: Only reset if the Tuya module still thinks it is moving
    condition: template
    value_template: '{{ states(''sensor.front_garden_blinds_control_moving'') in [''UP'',
      ''DOWN''] }}'
  actions:
  - alias: Send Stop command back to the Tuya module to disengage its relay
    action: cover.stop_cover
    target:
      entity_id: cover.front_garden_blinds_control
  mode: single
- id: '1776806970396'
  alias: 'Phase3: Optimal Energy Target SOC and Schedule Manager'
  description: Dynamically computes night and day target SOC constraints by handling
    isolated time contexts. Integrates a multi-tier architectural fallback for OMIE
    database stagnation and Solcast API blackouts.
  triggers:
  - trigger: time
    at: '22:05:00'
    id: evening_calc
  - trigger: template
    value_template: '{{ now().strftime(''%H:%M'') == (state_attr(''input_datetime.solax_night_charge_start'',
      ''timestamp'') | int | timestamp_custom(''%H:%M'', true)) }}'
    id: pre_night_start_calc
  - trigger: template
    value_template: '{{ now().strftime(''%H:%M'') == (state_attr(''input_datetime.solax_day_charge_start'',
      ''timestamp'') | int | timestamp_custom(''%H:%M'', true)) }}'
    id: pre_day_charge_calc
  conditions: []
  actions:
  - alias: Extract Market Rates and Determine Grid Strategy
    variables:
      night_tariff_str: '{{ states(''input_text.automation_low_cost_coopernico'')
        }}'
      night_price: '{{ night_tariff_str.split(''|'')[6] | default(999) | float(999)
        if night_tariff_str else 999 }}'
      afternoon_tariff_str: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'')
        }}'
      afternoon_price: '{{ afternoon_tariff_str.split(''|'')[1] | default(999) | float(999)
        if afternoon_tariff_str else 999 }}'
      afternoon_is_better: '{{ afternoon_price < (night_price * 0.9) }}'
      average_energy: 0.55
      min_soc: 11
      max_soc: 90
      pct_per_kw: 5.68
      usable_max_kw: 13.9
      inlet_temp: '{{ 16.5 - 4.5 * cos((3.14159 / 6) * (now().month - 2)) }}'
      e_tank: '{{ 150 * (states(''input_number.water_heater_dinner_target'') | float(50)
        - states(''sensor.sonoff_1001dabf03_temperature'') | float(45)) * 0.001162
        }}'
      e_shower: '{{ 100 * (40 - inlet_temp | float(16.5)) * 0.001162 }}'
      b_offset: 1
      f_offset: '{{ [e_tank | float(0) + e_shower | float(0), 0] | max | round(2)
        }}'
      ns_t: '{{ states(''input_datetime.solax_night_charge_stop'')[-8:] }}'
      nc_t: '{{ states(''input_datetime.solax_night_charge_cheap_stop'')[-8:] }}'
      ds_t: '{{ states(''input_datetime.solax_day_charge_start'')[-8:] }}'
      dp_t: '{{ states(''input_datetime.solax_day_charge_stop'')[-8:] }}'
      aq_t: '{{ states(''input_datetime.late_afternoon_water_heating_start'')[-8:]
        }}'
  - alias: Inspect Helper Validity and Remediate Outdated Datetime States
    choose:
    - alias: Handle Stale Helper Datetime Contexts
      conditions:
      - condition: template
        value_template: '{{ state_attr(''input_datetime.solax_night_charge_stop'',
          ''timestamp'') | default(0) | float < now().timestamp() }}'
      sequence:
      - alias: Forcibly Assign Default Emergency Night Window Parameters
        action: input_datetime.set_datetime
        target:
          entity_id:
          - input_datetime.solax_night_charge_start
          - input_datetime.solax_night_charge_cheap_start
        data:
          time: 00:00:00
      - alias: Forcibly Assign Default Emergency Night Expiration Parameters
        action: input_datetime.set_datetime
        target:
          entity_id:
          - input_datetime.solax_night_charge_stop
          - input_datetime.solax_night_charge_cheap_stop
        data:
          time: 03:00:00
      - alias: Forcibly Assign Default Emergency Day Window Parameters
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.solax_day_charge_start
        data:
          time: '16:00:00'
      - alias: Forcibly Assign Default Emergency Day Expiration Parameters
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.solax_day_charge_stop
        data:
          time: '18:00:00'
      - alias: Raise Persistent System UI Alert for Stale Price Blocks
        action: persistent_notification.create
        data:
          notification_id: omie_stale_data_warning
          title: '⚠️ OMIE Database Alert: Outdated Data Detected'
          message: Market pricing database has stagnated. Defaulting schedule boundaries
            to emergency blocks (00:00-03:00 and 16:00-18:00) to maintain inverter
            readiness.
  - alias: Execute Time Context Routing
    choose:
    - alias: Process Night Charging Strategy
      conditions:
      - condition: template
        value_template: '{{ trigger.id in [''evening_calc'', ''pre_night_start_calc'']
          }}'
      sequence:
      - alias: Evaluate Tomorrow Solar Array and Compute Grid Constraints
        action: input_text.set_value
        target:
          entity_id: input_text.solar_calculations
        data:
          value: "{%- set t_data = state_attr('sensor.solcast_pv_forecast_forecast_tomorrow',
            'detailedHourly') or [] %} {%- set current_temp = states('sensor.sonoff_1001dabf03_temperature')
            %} {%- if t_data | length == 0 %}\n  {# Solcast Blackout Path: Calculate
            Climatological Seasonal Baseline #}\n  {%- set current_month = now().month
            %}\n  {%- if current_month in [11, 12, 1, 2] %}{% set fallback_soc = 90
            %}\n  {%- elif current_month in [3, 4, 9, 10] %}{% set fallback_soc =
            60 %}\n  {%- else %}{% set fallback_soc = 11 %}{% endif %}\n  CRITICAL_FALLBACK|{{
            fallback_soc }}|0|0|{{ afternoon_is_better }}|{{ f_offset }}|0|0|{{ states('sensor.sonoff_1001dabf03_temperature')
            }}\n{%- else %}\n  {# Normal Operational Path #}\n  {%- set w_p50 = 0.8
            %}{% set w_p10 = 0.2 %}{% set d = '2000-01-01' %}\n  {%- set night_stop
            = [as_timestamp(d~' '~ns_t), as_timestamp(d~' '~nc_t)] | max %}\n  {%-
            set afternoon_stop = as_timestamp(d~' '~dp_t) %}\n  {%- set aqs_afternoon_ts
            = as_timestamp(d~' '~aq_t) %}\n  {%- set end_of_day = as_timestamp(d~'
            23:59:59') %}\n  {%- set ts_max_start, ts_min_start = (afternoon_stop,
            night_stop) if afternoon_is_better else (night_stop, afternoon_stop) %}\n
            \ \n  {# Execute Full Multi-Hour Optimization Loop #}\n  {%- set full
            = namespace(max=0, min=0, batt=0) %}\n  {%- for r in t_data %}\n    {%-
            set ts = as_timestamp(d ~ ' ' ~ (r.period_start | as_datetime).strftime('%H:%M:%S'))
            %}\n    {%- if ts_max_start <= ts <= end_of_day %}\n      {%- set pv =
            (r.pv_estimate | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate
            | float(0)) * w_p10) %}\n      {%- set load = f_offset if (ts <= aqs_afternoon_ts
            < ts + 3600) else 0 %}\n      {%- set full.batt = full.batt + pv - average_energy
            - load %}\n      {%- set full.max = [full.max, full.batt] | max %}\n      {%-
            set full.min = [full.min, full.batt] | min %}\n    {%- endif %}\n  {%-
            endfor %}\n  {%- set TargetMaxKW = [[usable_max_kw - full.max, (0 - full.min)
            if full.min < 0 else 0] | max, usable_max_kw] | min %}\n  \n  {# Execute
            Restricted Baseline Loop #}\n  {%- set bare = namespace(max=0, min=0,
            batt=-b_offset) %}\n  {%- for r in t_data %}\n    {%- set ts = as_timestamp(d
            ~ ' ' ~ (r.period_start | as_datetime).strftime('%H:%M:%S')) %}\n    {%-
            if ts_min_start <= ts <= end_of_day %}\n      {%- if (ts_min_start < ts_max_start
            and ts <= ts_max_start) or ts_min_start > ts_max_start %}\n        {%-
            set pv = (r.pv_estimate | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate
            | float(0)) * w_p10) %}\n        {%- set load = f_offset if (ts <= aqs_afternoon_ts
            < ts + 3600) else 0 %}\n        {%- set bare.batt = bare.batt + pv - average_energy
            - load %}\n      {%- endif %}\n      {%- set bare.min = [bare.min, bare.batt]
            | min %}\n    {%- endif %}\n  {%- endfor %}\n  {%- set TargetMinKW = [[(0
            - bare.min), 0] | max, usable_max_kw] | min %}\n  {%- set target_night_kw
            = TargetMinKW if afternoon_is_better else TargetMaxKW %}\n  {%- set batt_night
            = [[(target_night_kw * pct_per_kw + min_soc) | round(0), min_soc] | max,
            max_soc] | min %}\n  {{ batt_night | int }}|VALID_RUN|{{ full.max | round(3)
            }}|{{ full.min | round(3) }}|{{ afternoon_is_better }}|{{ f_offset }}|0|{{
            bare.min | round(3) }}|{{ current_temp | round(1) }}\n{%- endif %}"
      - alias: Write Night Target Metric to Storage Vector
        choose:
        - alias: Process Standard Cloud Computation Output
          conditions:
          - condition: template
            value_template: '{{ not is_state(''input_text.solar_calculations'', ''CRITICAL_FALLBACK'')
              }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.new_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[0]
                | int }}'
        - alias: Process System Intercept Fallback State
          conditions:
          - condition: template
            value_template: '{{ states(''input_text.solar_calculations'').split(''|'')[0]
              == ''CRITICAL_FALLBACK'' }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id:
              - input_number.new_battery_target
              - input_number.new_day_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[1]
                | int }}'
          - action: persistent_notification.create
            data:
              notification_id: solcast_blackout_warning
              title: '⚠️ Solcast API Blackout: Emergency Fallback Enforced'
              message: Solcast solar forecast array returned empty elements. Enforcing
                local calendar backup model. Storage vectors configured to seasonal
                default value of {{ states('input_text.solar_calculations').split('|')[1]
                | int }}%.
    - alias: Process Daytime Top-Off Strategy
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''pre_day_charge_calc'' }}'
        enabled: true
      sequence:
      - alias: Evaluate Today Remaining Array and Compute Target Metrics
        action: input_text.set_value
        target:
          entity_id: input_text.solar_calculations
        data:
          value: "{%- set today_data = state_attr('sensor.solcast_pv_forecast_forecast_today',
            'detailedHourly') or [] %} {%- set current_temp = states('sensor.sonoff_1001dabf03_temperature')
            %} {%- if today_data | length == 0 %}\n  {# Emergency Fallback Path if
            API fails mid-day #}\n  {%- set current_month = now().month %}\n  {%-
            if current_month in [11, 12, 1, 2] %}{% set fallback_soc = 90 %}\n  {%-
            elif current_month in [3, 4, 9, 10] %}{% set fallback_soc = 60 %}\n  {%-
            else %}{% set fallback_soc = 11 %}\n  {% endif %}\n  CRITICAL_FALLBACK|{{
            fallback_soc }}|0|0|{{ afternoon_is_better }}|{{ f_offset }}|0|0|{{ states('sensor.sonoff_1001dabf03_temperature')
            }}\n{%- else %}\n  {# Dynamically weight today's remaining metrics #}\n
            \ {%- set actual_pv = states('sensor.solax_today_s_yield') | float(0)
            %}\n  {%- set expected_pv = states('sensor.solcast_pv_forecast_forecast_today')
            | float(0) %}\n  {%- set rem_p50 = states('sensor.solcast_pv_forecast_forecast_remaining_today')
            | float(0) %}\n  {%- set exp_so_far = expected_pv - rem_p50 %}\n  {%-
            set w_p50 = [[(actual_pv / exp_so_far - 0.5) * 2.0, 0.8] | min, 0.0] |
            max if exp_so_far > 1.0 else 0.8 %}\n  {%- set w_p10 = 1.0 - w_p50 %}\n
            \ {%- set d = '2000-01-01' %}\n  {%- set afternoon_start = as_timestamp(d~'
            '~ds_t) %}\n  {%- set afternoon_stop = as_timestamp(d~' '~dp_t) %}\n  {%-
            set aqs_afternoon_ts = as_timestamp(d~' '~aq_t) %}\n  {%- set end_of_day
            = as_timestamp(d~' 23:59:59') %}\n  \n  {# Compute Today's Production
            Excess in Afternoon Charging Boundary #}\n  {%- set window = namespace(excess=0)
            %}\n  {%- for r in today_data %}\n    {%- set ts = as_timestamp(d ~ '
            ' ~ (r.period_start | as_datetime).strftime('%H:%M:%S')) %}\n    {%- if
            afternoon_start <= ts < end_of_day %}\n      {%- set pv = (r.pv_estimate
            | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate | float(0))
            * w_p10) %}\n      {%- set load = f_offset if (ts <= aqs_afternoon_ts
            < ts + 3600) else 0 %}\n      {%- set net = pv - average_energy - load
            %}\n      {%- set window.excess = window.excess + net %}\n    {%- endif
            %}\n  {%- endfor %}\n  \n  {# Re-run Today Evening Structural Deficit
            Array Math #}\n  {%- set night_stop = [as_timestamp(d~' '~ns_t), as_timestamp(d~'
            '~nc_t)] | max %}\n  {%- set ts_max_start, ts_min_start = (afternoon_stop,
            night_stop) if afternoon_is_better else (night_stop, afternoon_stop) %}\n
            \ \n  {%- set full = namespace(max=0, min=0, batt=0) %}\n  {%- for r in
            today_data %}\n    {%- set ts = as_timestamp(d ~ ' ' ~ (r.period_start
            | as_datetime).strftime('%H:%M:%S')) %}\n    {%- if ts_max_start <= ts
            <= end_of_day %}\n      {%- set pv = (r.pv_estimate | float(0) * w_p50)
            + (r.pv_estimate10 | default(r.pv_estimate | float(0)) * w_p10) %}\n      {%-
            set load = f_offset if (ts <= aqs_afternoon_ts < ts + 3600) else 0 %}\n
            \     {%- set full.batt = full.batt + pv - average_energy - load %}\n
            \     {%- set full.max = [full.max, full.batt] | max %}\n      {%- set
            full.min = [full.min, full.batt] | min %}\n    {%- endif %}\n  {%- endfor
            %}\n  {%- set TargetMaxKW = [[usable_max_kw - full.max, (0 - full.min)
            if full.min < 0 else 0] | max, usable_max_kw] | min %}\n  \n  {%- set
            bare = namespace(max=0, min=0, batt=-b_offset) %}\n  {%- for r in today_data
            %}\n    {%- set ts = as_timestamp(d ~ ' ' ~ (r.period_start | as_datetime).strftime('%H:%M:%S'))
            %}\n    {%- if ts_min_start <= ts <= end_of_day %}\n      {%- if (ts_min_start
            < ts_max_start and ts <= ts_max_start) or ts_min_start > ts_max_start
            %}\n        {%- set pv = (r.pv_estimate | float(0) * w_p50) + (r.pv_estimate10
            | default(r.pv_estimate | float(0)) * w_p10) %}\n        {%- set load
            = f_offset if (ts <= aqs_afternoon_ts < ts + 3600) else 0 %}\n        {%-
            set bare.batt = bare.batt + pv - average_energy - load %}\n      {%- endif
            %}\n      {%- set bare.min = [bare.min, bare.batt] | min %}\n    {%- endif
            %}\n  {%- endfor %}\n  {%- set TargetMinKW = [[(0 - bare.min), 0] | max,
            usable_max_kw] | min %}\n  \n  {%- set target_afternoon_kw = [TargetMaxKW
            - window.excess, 0] | max if afternoon_is_better else [TargetMinKW - window.excess,
            0] | max %}\n  {%- set batt_afternoon = [[(target_afternoon_kw * pct_per_kw
            + min_soc) | round(0), min_soc] | max, max_soc] | min %}\n  DayCalcOnly|{{
            batt_afternoon | int }}|{{ full.max | round(3) }}|{{ full.min | round(3)
            }}|{{ afternoon_is_better }}|{{ f_offset }}|{{ window.excess | round(3)
            }}|{{ bare.min | round(3) }}|{{ current_temp | round(1) }}\n{%- endif
            %}"
      - alias: Write Day Target Metric to Storage Vector
        choose:
        - alias: Process Standard Mid-Day Cloud Output
          conditions:
          - condition: template
            value_template: '{{ not is_state(''input_text.solar_calculations'', ''CRITICAL_FALLBACK'')
              }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.new_day_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[1]
                | int }}'
        - alias: Process Mid-Day System Fallback Intercept
          conditions:
          - condition: template
            value_template: '{{ states(''input_text.solar_calculations'').split(''|'')[0]
              == ''CRITICAL_FALLBACK'' }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.new_day_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[1]
                | int }}'
          - action: persistent_notification.create
            data:
              notification_id: solcast_midday_blackout_warning
              title: '⚠️ Solcast API Mid-day Drop: Emergency Baseline Enforced'
              message: Solcast database dropped connection mid-day. Overwriting remaining
                afternoon top-off bounds to climatological fallback target of {{ states('input_text.solar_calculations').split('|')[1]
                | int }}%.
  - alias: Log Strategy Actions to System Energy Database File
    action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Strategy execution verified. Time Trigger ID: {{ trigger.id }}. Market
        conditions favor afternoon grid window: {{ afternoon_is_better }}. Solar calculation
        raw data payload: {{ states(''input_text.solar_calculations'') }}'
  mode: queued
  max: 5
- id: '1781824502362'
  alias: 'Phase 1: OMIE Charging time calculations v2'
  description: Calculates charging windows dynamically upon market data refresh or
    system boot.
  triggers:
  - trigger: state
    entity_id: sensor.template_coopernico_spot_price_bihorario
    attribute: tomorrow_hours
    id: market_data_updated
  - trigger: homeassistant
    event: start
    id: ha_restart
  - trigger: time
    at: '14:00:00'
    id: fallback_trigger
  - trigger: time
    at: '22:00:00'
    id: update_next_day_afternoon
  conditions:
  - condition: time
    after: '12:00:00'
    before: '23:59:00'
  actions:
  - alias: Wait for Coopernico sensor to initialize after boot
    wait_template: '{{ states(''sensor.template_coopernico_spot_price_bihorario'')
      not in [''unknown'', ''unavailable''] }}'
    timeout: 00:05:00
    continue_on_timeout: false
  - condition: template
    value_template: '{% set today = state_attr(''sensor.template_coopernico_spot_price_bihorario'',
      ''today_hours'') %} {{ today is not none and today.values() | list | count >
      32 }}'
  - alias: 'BLOCK A: Night & General EV Calculations (Skips at 22:00)'
    if:
    - condition: template
      value_template: '{{ trigger.id != ''update_next_day_afternoon'' }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.automation_low_cost_coopernico
      data:
        value: "{% set sensor = 'sensor.template_coopernico_spot_price_bihorario'
          %}  {% set today_dict = state_attr(sensor, 'today_hours') %}  {% set tomorrow_dict
          = state_attr(sensor, 'tomorrow_hours') %}\n{% if today_dict is not none
          and tomorrow_dict is not none %}\n  {% set today_prices = today_dict.items()
          | sort(attribute='0') | map(attribute='1') | list %}\n  {% set tomorrow_prices
          = tomorrow_dict.items() | sort(attribute='0') | map(attribute='1') | list
          %}\n\n  {# 22:00 is now index 88 (22 * 4). Tomorrow 08:00 is index 32 (8
          * 4) #}\n  {% set window = today_prices[88:] + tomorrow_prices[:32] %}\n
          \ {% set min_price = window | map('float', 1000) | min %}\n\n  {% set ns
          = namespace(ts_2h='', ts_3h='', ts_5h='', ts_1h='', ts_start=999, ts_stop=0,
          found_start=false, ended=false, best_1h_idx=0) %}\n\n  {% for d in [5, 3,
          2, 1] %}\n    {% set d_steps = d * 4 %}\n    {% set best = namespace(min_sum=999999,
          idx=0) %}\n    {% for i in range((window | count - d_steps), -1, -1) %}\n
          \     {% set current_sum = window[i:i+d_steps] | map('float', 1000) | sum
          %}\n      {% if current_sum <= best.min_sum %}\n        {% set best.min_sum
          = current_sum %}\n        {% set best.idx = i %}\n      {% endif %}\n    {%
          endfor %}\n    \n    {# Convert step index to 15-minute blocks #}\n    {%
          set ts = (today_at(\"22:00\") + timedelta(minutes=best.idx * 15)).timestamp()
          | int | string %}\n    \n    {% if d == 5 %}{% set ns.ts_5h = ts %}{% endif
          %}\n    {% if d == 3 %}{% set ns.ts_3h = ts %}{% endif %}\n    {% if d ==
          2 %}{% set ns.ts_2h = ts %}{% endif %}\n    {% if d == 1 %}\n      {% set
          ns.ts_1h = ts %}\n      {% set ns.best_1h_idx = best.idx %}\n    {% endif
          %}\n  {% endfor %}\n\n  {# Calculate a safe threshold (10%) that won't break
          if OMIE drops to 0 EUR #}\n  {% set buffer = (min_price * 0.10) if min_price
          > 10 else 2.0 %}\n  {% set max_allowed = min_price + buffer %}\n\n  {% for
          i in range(window | count) %}\n    {% if not ns.ended %}\n      {% if window[i]
          is not none and window[i] | float(1000) <= max_allowed %}\n        {% if
          not ns.found_start %}\n          {% set ns.ts_start = i %}\n          {%
          set ns.found_start = true %}\n        {% endif %}\n        {% set ns.ts_stop
          = i + 1 %} \n      {% else %}\n        {% if ns.found_start %}\n          {#
          If the continuous block is at least 1 hour (4 blocks), lock it in #}\n          {%
          if (ns.ts_stop - ns.ts_start) >= 4 %}\n            {% set ns.ended = true
          %}\n          {% else %}\n            {# Otherwise, it was just a brief
          15-30min dip. Reset and keep searching. #}\n            {% set ns.found_start
          = false %}\n          {% endif %}\n        {% endif %}\n      {% endif %}\n
          \   {% endif %}\n  {% endfor %}\n\n  {# Failsafe: If no continuous block
          of at least 1 hour was found, force the absolute best 1-hour block #}\n
          \ {% if (ns.ts_stop - ns.ts_start) < 4 %}\n    {% set ns.ts_start = ns.best_1h_idx
          %}\n    {% set ns.ts_stop = ns.best_1h_idx + 4 %}\n  {% endif %}\n\n  {%
          set start_dt = (today_at(\"22:00\") + timedelta(minutes=ns.ts_start * 15)).timestamp()
          | int | string %}\n  {% set stop_dt = (today_at(\"22:00\") + timedelta(minutes=ns.ts_stop
          * 15)).timestamp() | int | string %}\n\n  {{ ns.ts_2h ~ '|' ~ ns.ts_3h ~
          '|' ~ ns.ts_5h ~ '|' ~ ns.ts_1h ~ '|' ~ start_dt ~ '|' ~ stop_dt ~ '|' ~
          (min_price | string) }}\n{% endif %}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_water_heating_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[0]
          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_water_heating_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[0]
          | int + 7200 }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev_charge_start
        - input_datetime.automation_ev2_charge_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[2]
          | int }}'
    - action: input_datetime.set_datetime
      target:
