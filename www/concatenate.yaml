    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int + 7200 }}'
  - alias: Dynamic Logging
    action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: "{% if trigger.id == 'update_next_day_afternoon' %}\n  Phase 1 Complete:
        22:00 Update. Only Tomorrow's Afternoon datetimes were recalculated to prevent
        race conditions.\n{% else %}\n  Phase 1 Complete: Full OMIE pricing optimized.
        Both Night and Afternoon daily datetimes successfully assigned. (Trigger:
        {{ trigger.id }})\n{% endif %}"
  mode: single
- id: '1782236389841'
  alias: 'Holiday Mode: Morning Blinds Simulation'
  description: Executes a randomized human-presence simulation sequence for the blinds
    when Holiday Mode is active.
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.holliday_mode
    state:
    - 'on'
  actions:
  - alias: Randomize start time between 10:00 and 10:30
    delay:
      minutes: '{{ range(0, 31) | random }}'
      seconds: '{{ range(0, 60) | random }}'
    enabled: true
  - alias: Stop Master Suite (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_suite
  - alias: Open Master Suite
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_suite
    data:
      position: '{{ range(15, 26) | random }}'
  - delay:
      seconds: '{{ range(5, 11) | random }}'
  - alias: Stop Master Bathroom (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_master_bathroom
  - alias: Open Master Bathroom
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_master_bathroom
    data:
      position: '{{ range(15, 21) | random }}'
  - alias: Determine the order for kids rooms
    variables:
      first_room: '{{ [''cover.blinds_lara'', ''cover.blinds_lucas''] | random }}'
      second_room: '{{ ''cover.blinds_lucas'' if first_room == ''cover.blinds_lara''
        else ''cover.blinds_lara'' }}'
  - alias: Stop First Kids Room (Initialization)
    action: cover.stop_cover
    target:
      entity_id: '{{ first_room }}'
  - alias: Open First Kids Room
    action: cover.set_cover_position
    target:
      entity_id: '{{ first_room }}'
    data:
      position: '{{ range(15, 26) | random }}'
  - delay:
      seconds: 15
  - alias: Stop Second Kids Room (Initialization)
    action: cover.stop_cover
    target:
      entity_id: '{{ second_room }}'
  - alias: Open Second Kids Room
    action: cover.set_cover_position
    target:
      entity_id: '{{ second_room }}'
    data:
      position: '{{ range(15, 26) | random }}'
  - delay:
      seconds: 15
  - alias: Stop Stairs (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_stairs
  - alias: Open Stairs
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_stairs
    data:
      position: '{{ range(20, 26) | random }}'
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.sonoff_10020744e0_1
    data: {}
  - delay:
      seconds: 30
  - alias: Stop Dinner (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_dinner
  - alias: Open Dinner
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_dinner
    data:
      position: '{{ range(40, 51) | random }}'
  - delay:
      seconds: 5
  - alias: Stop Patio (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_patio
  - alias: Open Patio
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_patio
    data:
      position: 50
  - delay:
      seconds: 5
  - alias: Stop Kitchen (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_kitchen
  - alias: Open Kitchen
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_kitchen
    data:
      position: '{{ range(50, 56) | random }}'
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.shades_master_switch
    data: {}
  mode: single
- id: '1782238419640'
  alias: 'Holiday Mode: Evening Presence Simulation'
  description: Closes blinds and manages randomized lighting sequences to simulate
    realistic human presence throughout the evening.
  triggers:
  - trigger: sun
    event: sunset
    id: sunset_events
  - trigger: time
    at: '22:00:00'
    id: night_blinds_close
  - trigger: time
    at: '21:50:00'
    id: lights_on_sequence
  - trigger: time
    at: '22:10:00'
    id: kids_lights_off
  - trigger: time
    at: '22:30:00'
    id: hall_light_off
  conditions:
  - condition: state
    entity_id: input_boolean.holliday_mode
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset_events
      sequence:
      - alias: Stop Patio and Kitchen (Initialization)
        action: cover.stop_cover
        target:
          entity_id:
          - cover.blinds_patio
          - cover.blinds_kitchen
      - alias: Close Patio and Kitchen fully
        action: cover.close_cover
        target:
          entity_id:
          - cover.blinds_patio
          - cover.blinds_kitchen
      - alias: Turn on Sunset Light
        action: light.turn_on
        target:
          entity_id: light.switch_quadro1_l2
    - conditions:
      - condition: trigger
        id: lights_on_sequence
      sequence:
      - alias: Randomize start time between 21:50 and 21:58
        delay:
          minutes: '{{ range(0, 9) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Determine the random order of the 3 lights
        variables:
          l_list: '{{ [''light.switch_quadro1_l1'', ''switch.switch_quarto_lucas'',
            ''switch.switch_quarto_lara''] }}'
          first_l: '{{ l_list | random }}'
          l_list2: '{{ l_list | reject(''eq'', first_l) | list }}'
          second_l: '{{ l_list2 | random }}'
          third_l: '{{ l_list2 | reject(''eq'', second_l) | list | first }}'
      - alias: Turn on First Random Light
        action: homeassistant.turn_on
        target:
          entity_id: '{{ first_l }}'
      - delay:
          seconds: '{{ range(5, 11) | random }}'
      - alias: Turn on Second Random Light
        action: homeassistant.turn_on
        target:
          entity_id: '{{ second_l }}'
      - delay:
          seconds: '{{ range(5, 11) | random }}'
      - alias: Turn on Third Random Light
        action: homeassistant.turn_on
        target:
          entity_id: '{{ third_l }}'
    - conditions:
      - condition: trigger
        id: night_blinds_close
      sequence:
      - alias: Randomize closing time between 22:00 and 22:30
        delay:
          minutes: '{{ range(0, 31) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Stop Master Suite (Initialization)
        action: cover.stop_cover
        target:
          entity_id: cover.blinds_suite
      - alias: Close Master Suite
        action: cover.close_cover
        target:
          entity_id: cover.blinds_suite
      - delay:
          seconds: '{{ range(5, 11) | random }}'
      - alias: Stop Master Bathroom (Initialization)
        action: cover.stop_cover
        target:
          entity_id: cover.blinds_master_bathroom
      - alias: Close Master Bathroom
        action: cover.close_cover
        target:
          entity_id: cover.blinds_master_bathroom
    - conditions:
      - condition: trigger
        id: kids_lights_off
      sequence:
      - alias: Randomize start time between 22:10 and 22:30
        delay:
          minutes: '{{ range(0, 21) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Determine the random order to turn off kids lights
        variables:
          first_kid: '{{ [''switch.switch_quarto_lucas'', ''switch.switch_quarto_lara'']
            | random }}'
          second_kid: '{{ ''switch.switch_quarto_lucas'' if first_kid == ''switch.switch_quarto_lara''
            else ''switch.switch_quarto_lara'' }}'
      - alias: Turn off First Kids Light
        action: homeassistant.turn_off
        target:
          entity_id: '{{ first_kid }}'
      - alias: Wait between 30s and 1m
        delay:
          seconds: '{{ range(30, 61) | random }}'
      - alias: Turn off Second Kids Light
        action: homeassistant.turn_off
        target:
          entity_id: '{{ second_kid }}'
    - conditions:
      - condition: trigger
        id: hall_light_off
      sequence:
      - alias: Randomize turn off between 22:30 and 22:45
        delay:
          minutes: '{{ range(0, 16) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Turn off Hall Light
        action: light.turn_off
        target:
          entity_id: light.switch_quadro1_l1
      - alias: Turn off Living room Light
        action: light.turn_off
        target:
          entity_id: light.switch_quadro1_l2
  mode: parallel
  max: 10
- id: network_link_speed_degradation_monitor
  alias: 'System: Network Link Speed Degradation Monitor'
  description: Monitors switch uplinks and APs. Triggers a persistent UI alert and
    logs the event if a port negotiates below its hardware specification.
  triggers:
  - alias: Trigger when 2.5GbE ports drop below optimal speed
    trigger: numeric_state
    entity_id:
    - sensor.swcloset_port_1_link_speed
    - sensor.swcloset_port_2_link_speed
    - sensor.swcloset_port_3_link_speed
    - sensor.swcloset_port_5_link_speed
    - sensor.swentrada_ap_quartos_link_speed
    - sensor.swentrada_uplink_to_garagem_link_speed
    - sensor.swgaragem_ap_garagem_link_speed
    - sensor.swgaragem_servidor_link_speed
    - sensor.swgaragem_uplink_to_entrada_link_speed
    below: 2500
    for: 00:01:00
    id: degraded_2500
  - alias: Trigger when 1GbE ports drop below optimal speed
    trigger: numeric_state
    entity_id:
    - sensor.swentrada_ap_sala_link_speed
    - sensor.swentrada_internet_link_speed
    below: 1000
    for: 00:01:00
    id: degraded_1000
  conditions:
  - alias: Ensure the state is a valid numerical speed, ignoring offline/unknown states
    condition: template
    value_template: '{{ trigger.to_state.state | is_number }}'
  actions:
  - alias: Log the degradation event for system traceability
    action: notify.send_message
    target:
      entity_id: notify.system_log
    data:
      message: 'Network Degradation: {{ trigger.to_state.name }} negotiated at {{
        trigger.to_state.state }} Mbps.'
  - alias: Create a persistent UI notification for the administrator
    action: persistent_notification.create
    data:
      title: ⚠️ Network Port Degraded
      message: "The port **{{ trigger.to_state.name }}** is operating below expected
        capacity.  Current Link Speed: **{{ trigger.to_state.state }} Mbps**. \nPlease
        inspect the Cat6 cabling, RJ45 terminations, or switch port configurations."
      notification_id: network_degrade_{{ trigger.entity_id }}
  mode: parallel
  max: 15
