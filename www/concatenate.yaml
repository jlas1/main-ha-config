- id: '1710687693819'
  alias: SOLAX Grid Injection control
  description: ''
  triggers:
  - alias: Turn ON Level 4 (Living Room AC & AQS)
    id: Trigger Level Four
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {% set
      mult = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} {{ soc >= base + (3 * mult)
      and soc > 90 }}'
    for:
      seconds: 15
  - alias: Turn ON Level 3 (Rooms AC)
    id: Trigger Level Three
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {% set
      mult = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} {{ soc >= base + (2 * mult)
      and soc > 90 }}'
    for:
      seconds: 15
  - alias: Turn ON Level 2 (EV + AQS)
    id: Trigger Level Two
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {% set
      mult = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} {{ soc >= base + (1 * mult)
      }}'
    for:
      seconds: 15
  - alias: Turn ON Level 1 (EV or AQS)
    id: Trigger Level One
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {{ soc
      >= base }}'
    for:
      seconds: 15
  - alias: Turn OFF Level 3 & 4 (Living Room & Rooms AC)
    id: Disable Level Three and Four
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {% set
      mult = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} {{ soc < base + (1 * mult)
      or soc <= 90 }}'
    for:
      seconds: 15
  - alias: Turn OFF Level 2 (Downgrade to Level 1)
    id: Disable Level Two
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {{ soc
      < base }}'
    for:
      seconds: 15
  - alias: Turn OFF Level 1 (Stop all dumping)
    id: Disable Level One
    trigger: template
    value_template: '{% set soc = states(''sensor.solax_battery_capacity'')|float(0)
      %} {% set base = states(''sensor.solar_dump_base_target'')|float(0) %} {% set
      mult = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} {{ soc < base - (1 * mult)
      }}'
    for:
      seconds: 15
  - alias: AQS Water Temperature Reached Target
    id: Water Temperature reached target
    trigger: numeric_state
    entity_id:
    - sensor.sonoff_1001dabf03_temperature
    above: input_number.water_heater_dinner_target
    value_template: '{{ float(state.state) - 10 }}'
    for:
      seconds: 15
  conditions:
  - condition: or
    conditions:
    - condition: sun
      before: sunset
      after: sunrise
    - condition: template
      value_template: '{{ trigger.id in [''Disable Level Three and Four'', ''Disable
        Level Two'', ''Disable Level One''] }}'
  - condition: template
    value_template: "{% set avg_solar = states('sensor.solar_power_5min_average')
      | float(0) %}  {% set soc = states('sensor.solax_battery_capacity') | float(0)
      %} {% set feedin = states('sensor.solax_grid_export') | float(0) %}  {% set
      is_turn_on_trigger = trigger.id in ['Trigger Level One', 'Trigger Level Two',
      'Trigger Level Three', 'Trigger Level Four', 'Water Temperature reached target']
      %}\n{% if is_turn_on_trigger %}\n  {% if feedin > 50 %}\n    true {# Always
      allow diverting if we are actively injecting to the grid #}\n  {% else %}\n
      \   true\n  {% endif %}\n{% else %}\n  true\n{% endif %}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Trigger Level One
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.sonoff_1001dabf03_temperature
          above: input_number.water_heater_dinner_target
          value_template: '{{ float (state.state) - 10 }}'
        then:
        - target:
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_off
        - target:
            entity_id: input_boolean.grid_injection_avoidance_ve_s
          action: input_boolean.turn_on
        - alias: Trigger Dual-EV Solar Splitter Fallback
          action: automation.trigger
          target:
            entity_id: automation.power_management_dual_ev_solar_splitter_fallback
          data:
            skip_condition: true
        else:
        - target:
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level One Solar Dump.
    - conditions:
      - condition: trigger
        id: Trigger Level Two
      sequence:
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.grid_injection_avoidance_ve_s
        action: input_boolean.turn_on
      - alias: Trigger Dual-EV Solar Splitter Fallback
        action: automation.trigger
        target:
          entity_id: automation.power_management_dual_ev_solar_splitter_fallback
        data:
          skip_condition: true
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level Two Solar Dump.
    - conditions:
      - condition: trigger
        id: Trigger Level Three
      sequence:
      - target:
          entity_id: input_boolean.automation_start_rooms_ac
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level Three Solar Dump.
    - conditions:
      - condition: trigger
        id: Trigger Level Four
      sequence:
      - target:
          entity_id:
          - input_boolean.automation_start_livingroom_ac
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level Four Solar Dump.
    - conditions:
      - condition: trigger
        id: Disable Level Three and Four
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: input_boolean.automation_start_livingroom_ac
            state: 'on'
          - condition: state
            entity_id: input_boolean.automation_start_rooms_ac
            state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.automation_start_livingroom_ac
            - input_boolean.automation_start_rooms_ac
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: Disabled Level Three and Four Solar Dump.
    - conditions:
      - condition: trigger
        id: Disable Level Two
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.sonoff_1001dabf03_temperature
          above: input_number.water_heater_dinner_target
          value_template: '{{ float (state.state) - 2 }}'
        then:
        - target:
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_off
        else:
        - target:
            entity_id:
            - input_boolean.grid_injection_avoidance_ve2_switch
            - input_boolean.grid_injection_avoidance_ve_s
            - input_boolean.grid_injection_avoidance_ve_switch
          action: input_boolean.turn_off
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Disabled Level Two Solar Dump.
    - conditions:
      - condition: trigger
        id: Disable Level One
      sequence:
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_off
      - target:
          entity_id:
          - input_boolean.grid_injection_avoidance_ve2_switch
          - input_boolean.grid_injection_avoidance_ve_s
          - input_boolean.grid_injection_avoidance_ve_switch
        action: input_boolean.turn_off
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Disabled Level One Solar Dump.
    - conditions:
      - condition: trigger
        id: Water Temperature reached target
      sequence:
      - if:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.grid_injection_avoidance_ve_s
            state: 'off'
          - condition: state
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
            state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_off
        - target:
            entity_id: input_boolean.grid_injection_avoidance_ve_s
          action: input_boolean.turn_on
        - alias: Trigger Dual-EV Solar Splitter Fallback
          action: automation.trigger
          target:
            entity_id: automation.power_management_dual_ev_solar_splitter_fallback
          data:
            skip_condition: true
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: AQS Water reached target during dump. Diverting to EV.
  mode: queued
  max: 3
- id: '1711213074704'
  alias: Auto Backup
  description: ''
  trigger:
  - platform: time
    at: '23:00:00'
  condition: []
  action:
  - if:
    - condition: template
      value_template: '{{ true if now().weekday() == 0 else false }}'
    then:
    - service: auto_backup.backup_full
      data:
        compressed: true
        keep_days: 31
    - action: notify.send_message
      target:
        entity_id: notify.system_log
      data:
        message: Monthly auto backup performed.
    else:
    - service: auto_backup.backup_full
      data:
        compressed: true
        keep_days: 7
    - action: notify.send_message
      target:
        entity_id: notify.system_log
      data:
        message: Weekly auto backup performed.
  mode: single
