          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_cheap_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[5]
          | int }}'
  - alias: 'BLOCK B: Afternoon/Day Calculations (Runs on ALL triggers)'
    action: input_text.set_value
    target:
      entity_id: input_text.automation_afternoon_low_cost_coopernico
    data:
      value: "{% set sensor = 'sensor.template_coopernico_spot_price_bihorario' %}
        \ \n{% set tomorrow_dict = state_attr(sensor, 'tomorrow_hours') %}  \n{% set
        today_dict = state_attr(sensor, 'today_hours') %}\n\n{% if now().hour >= 20
        and tomorrow_dict is not none and tomorrow_dict.values()|list|count > 32 %}\n
        \ {% set source_dict = tomorrow_dict %}\n  {% set day_offset = 1 %}\n{% else
        %}\n  {% set source_dict = today_dict %}\n  {% set day_offset = 0 %}\n{% endif
        %}\n\n{% if source_dict is not none %}\n  {% set all_prices = source_dict.items()
        | sort(attribute='0') | map(attribute='1') | list %}\n  \n  {# 08:00 is index
        32, 20:00 is index 80 (48 total 15-min blocks) #}\n  {% set window = all_prices[32:80]
        %}\n  \n  {% set ns_min = namespace(min_sum=999999) %}\n  {# We need a 2-hour
        window, which is 8 x 15-minute blocks #}\n  {% set d_steps = 8 %}\n  \n  {%
        for i in range(window | count - d_steps + 1) %}\n    {% set current_sum =
        window[i:i+d_steps] | map('float', 1000) | sum %}\n    {% set current_avg
        = current_sum / d_steps %}\n    {% if current_avg < ns_min.min_sum %}\n      {%
        set ns_min.min_sum = current_avg %}\n    {% endif %}\n  {% endfor %}\n\n  {%
        set buffer = (ns_min.min_sum * 0.10) if ns_min.min_sum > 10 else 2.0 %}\n
        \ {% set max_allowed = ns_min.min_sum + buffer %}\n\n  {% set best = namespace(idx=0,
        found=false) %}\n  {% for i in range((window | count - d_steps), -1, -1) %}\n
        \   {% if not best.found %}\n      {% set current_sum = window[i:i+d_steps]
        | map('float', 1000) | sum %}\n      {% set current_avg = current_sum / d_steps
        %}\n      {% if current_avg <= max_allowed %}\n        {% set best.idx = i
        %}\n        {% set best.found = true %}\n      {% endif %}\n    {% endif %}\n
        \ {% endfor %}\n\n  {% set start_dt = (today_at(\"08:00\") + timedelta(days=day_offset)
        + timedelta(minutes=best.idx * 15)) %}\n\n  {{ start_dt.timestamp() | int
        | string ~ \"|\" ~ (ns_min.min_sum | round(2) | string) }}\n{% endif %}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.late_afternoon_water_heating_start
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.late_afternoon_water_heating_stop
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int + 7200 }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_start
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int }}'
  - action: input_datetime.set_datetime
