- id: '1709567168156'
  alias: OMIE Optimizations
  description: ''
  triggers:
  - at: '19:00:00'
    id: Prepare for night energy usage
    trigger: time
  conditions: []
  actions:
  - target:
      entity_id: input_text.automation_low_cost_coopernico
    data:
      value: "{% set sensor = 'sensor.template_coopernico_spot_price_bihorario' %}\n{#
        1. Extract and convert dicts to sorted lists #} {% set today_dict = state_attr(sensor,
        'today_hours') %} {% set tomorrow_dict = state_attr(sensor, 'tomorrow_hours')
        %}\n{% if today_dict is not none and tomorrow_dict is not none %}\n  {% set
        today_prices = today_dict.items() | sort(attribute='0') | map(attribute='1')
        | list %}\n  {% set tomorrow_prices = tomorrow_dict.items() | sort(attribute='0')
        | map(attribute='1') | list %}\n\n  {# 2. Window: Today 22:00 to Tomorrow
        08:00 (10 hours total) #}\n  {% set window = today_prices[22:] + tomorrow_prices[:8]
        %}\n  {% set min_price = window | map('float', 1000) | min %}\n\n  {# 3. Namespaces
        for calculations #}\n  {% set ns = namespace(ts_2h='', ts_3h='', ts_5h='',
        ts_1h='', ts_start=99, ts_stop=0, found_start=false, ended=false) %}\n\n  {#
        4. Calculate best starts for 5h, 2h, 1h (Latest occurrence) and derive 3h
        from 5h #}\n  {% for d in [5, 3, 2, 1] %}\n    {% set best = namespace(min_sum=999999,
        idx=0) %}\n    {# Backward range ensures latest index is picked on tie #}\n
        \   {% for i in range((window | count - d), -1, -1) %}\n      {% set current_sum
        = window[i:i+d] | map('float', 1000) | sum %}\n      {% if current_sum <=
        best.min_sum %}\n        {% set best.min_sum = current_sum %}\n        {%
        set best.idx = i %}\n      {% endif %}\n    {% endfor %}\n    \n    {% set
        ts = (today_at(\"22:00\") + timedelta(hours=best.idx)).timestamp() | int |
        string %}\n    \n    {% if d == 5 %}{% set ns.ts_5h = ts %}{% endif %}\n    {%
        if d == 3 %}{% set ns.ts_3h = ts %}{% endif %}\n    {% if d == 2 %}{% set
        ns.ts_2h = ts %}{% endif %}\n    {% if d == 1 %}{% set ns.ts_1h = ts %}{%
        endif %}\n  {% endfor %}\n\n  {# 5. Calculate ts_start and ts_stop (Continuous
        block within 5% of min_price, stops instantly at first spike) #}\n  {% for
        i in range(window | count) %}\n    {% if not ns.ended %}\n      {% if window[i]
        is not none and window[i] <= (min_price * 1.05) %}\n        {% if not ns.found_start
        %}\n          {% set ns.ts_start = i %}\n          {% set ns.found_start =
        true %}\n        {% endif %}\n        {# +1 ensures the stop time is the end
        boundary of the cheap hour #}\n        {% set ns.ts_stop = i + 1 %} \n      {%
        else %}\n        {% if ns.found_start %}\n          {# We hit a price above
        the 5% threshold (the spike). End the block permanently. #}\n          {%
        set ns.ended = true %}\n        {% endif %}\n      {% endif %}\n    {% endif
        %}\n  {% endfor %}\n\n  {% set start_dt = (today_at(\"22:00\") + timedelta(hours=ns.ts_start)).timestamp()
        | int | string %}\n  {% set stop_dt = (today_at(\"22:00\") + timedelta(hours=ns.ts_stop)).timestamp()
        | int | string %}\n\n  {# 6. Final Output String matching your macro's order
        #}\n  {{ ns.ts_2h ~ '|' ~ ns.ts_3h ~ '|' ~ ns.ts_5h ~ '|' ~ ns.ts_1h ~ '|'
        ~ start_dt ~ '|' ~ stop_dt ~ '|' ~ (min_price | string) }}\n{% endif %}"
    action: input_text.set_value
  - target:
      entity_id: input_text.automation_afternoon_low_cost_coopernico
    data:
      value: "{% set sensor = 'sensor.template_coopernico_spot_price_bihorario' %}\n{#
        1. Determine which data to use (Fallback to today if tomorrow is missing)
        #}  {% set tomorrow_dict = state_attr(sensor, 'tomorrow_hours') %}  {% set
        today_dict = state_attr(sensor, 'today_hours') %}\n{% if tomorrow_dict is
        not none and tomorrow_dict.values()|list|count > 8 %}\n  {% set source_dict
        = tomorrow_dict %}\n  {% set day_offset = 1 %}\n{% else %}\n  {% set source_dict
        = today_dict %}\n  {% set day_offset = 0 %}\n{% endif %}\n{% if source_dict
        is not none %}\n  {# 2. Extract 08:00 to 20:00 (12 hour window) #}\n  {% set
        all_prices = source_dict.items() | sort(attribute='0') | map(attribute='1')
        | list %}\n  {% set window = all_prices[8:20] %}\n  \n  {# 3. Find the absolute
        minimum 2-hour average in the afternoon #}\n  {% set ns_min = namespace(min_sum=999999)
        %}\n  {% for i in range(11) %}\n    {% set current_sum = (window[i] | float(1000)
        + window[i+1] | float(1000)) / 2 %}\n    {% if current_sum < ns_min.min_sum
        %}\n      {% set ns_min.min_sum = current_sum %}\n    {% endif %}\n  {% endfor
        %}\n\n  {# 4. NEW 10% BANDING LOGIC #}\n  {# Add 10% to the minimum to create
        a ceiling. If min is near 0, add a flat 2 euro/MWh buffer to prevent math
        breaking #}\n  {% set buffer = (ns_min.min_sum * 0.10) if ns_min.min_sum >
        10 else 2.0 %}\n  {% set max_allowed = ns_min.min_sum + buffer %}\n\n  {#
        5. Search BACKWARDS to find the LATEST block that fits under the ceiling #}\n
        \ {% set best = namespace(idx=0, found=false) %}\n  {% for i in range(10,
        -1, -1) %}\n    {% if not best.found %}\n      {% set current_sum = (window[i]
        | float(1000) + window[i+1] | float(1000)) / 2 %}\n      {% if current_sum
        <= max_allowed %}\n        {% set best.idx = i %}\n        {% set best.found
        = true %}\n      {% endif %}\n    {% endif %}\n  {% endfor %}\n\n  {# 6. Calculate
        timestamp (Base 08:00 + offset + day_offset) #}\n  {% set start_dt = (today_at(\"08:00\")
        + timedelta(days=day_offset) + timedelta(hours=best.idx)) %}\n\n  {# 7. Output:
        [Timestamp]|[Min Price] #}\n  {{ start_dt.timestamp() | int | string ~ \"|\"
        ~ (ns_min.min_sum | round(2) | string) }}\n{% endif %}"
    action: input_text.set_value
  - target:
      entity_id:
      - input_datetime.night_water_heating_start
    data:
      timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[0]
        | int }}'
    action: input_datetime.set_datetime
  - target:
