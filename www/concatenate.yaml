###
### SHADING CALCULATIONS
###

    # =========================================================
    # 1. LATERAL SHADES (NW - 325°)
    # =========================================================
    - name: "Optimal Shade Position Lateral"
      unique_id: optimal_shade_position_lateral
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 325 %}
        {% set h_win = 1.2 %}
        {% set d_over = 0.1 %}
        {% set h_over = 0.3 %}
        {% set max_pen = 0.15 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          100 
        {% else %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma * pi / 180) %}
          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
          {% endif %}
        {% endif %}

    # =========================================================
    # 2. PATIO SHADES (NE - 55°)
    # (Also used for Dinner, Kitchen, Lara, and Lucas)
    # =========================================================
    - name: "Optimal Shade Position Patio"
      unique_id: optimal_shade_position_patio
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 55 %}
        {% set h_win = 2.1 %}
        {% set d_over = 0.1 %}
        {% set h_over = 0.3 %}
        {% set max_pen = 0.3 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          100 
        {% else %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma * pi / 180) %}
          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
          {% endif %}
        {% endif %}

    # =========================================================
    # 3. MASTER SUITE (SW - 235°)
    # =========================================================
    - name: "Optimal Shade Position Master Suite"
      unique_id: optimal_shade_position_master_suite
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 235 %}
        {% set h_win = 2.1 %}
        {% set d_over = 0.1 %}
        {% set h_over = 0.3 %}
        {% set max_pen = 0.2 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          100 
        {% else %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma * pi / 180) %}
          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
          {% endif %}
        {% endif %}

    # =========================================================
    # 4. MASTER BATHROOM (SW - 235°)
    # =========================================================
    - name: "Optimal Shade Position Master Bathroom"
      unique_id: optimal_shade_position_master_bathroom
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 235 %}
        {% set h_win = 1.0 %}
        {% set d_over = 0.1 %}
        {% set h_over = 0.3 %}
        {% set max_pen = 0.2 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          100 
        {% else %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma * pi / 180) %}
          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
          {% endif %}
        {% endif %}

    # =========================================================
    # 5. ENTRADA SLIDING COVER (SW - 235°)
    # =========================================================
    - name: "Optimal Shade Position Entrada Cover"
      unique_id: optimal_shade_position_entrada_cover
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 235 %}
        {% set h_win = 2.5 %}
        {% set h_over = 0.2 %}
        {% set min_ext = 0.8 %}
        {% set max_ext = 3.5 %}
        {% set angle_deg = 20 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          0 
        {% else %}
          {% set gamma_rad = gamma * pi / 180 %}
          {% set slope_rad = angle_deg * pi / 180 %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma_rad) %}
          {% set denominator = sin(slope_rad) + (cos(slope_rad) * tan_beta) %}
          
          {% if denominator > 0 %}
            {% set req_L = (h_over + h_win) / denominator %}
          {% else %}
            {% set req_L = max_ext %}
          {% endif %}
          
          {% set final_L = [[req_L, min_ext] | max, max_ext] | min %}
          {% set pct_extended = ((final_L - min_ext) / (max_ext - min_ext)) * 100 %}
          
          {{ [[pct_extended, 0] | max, 80] | min | round(0) }}
        {% endif %}

