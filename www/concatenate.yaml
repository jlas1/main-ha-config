      state: "{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[3])%256 | int(default=0)) }}:{{'%02d' %((state_attr('sensor.solax_rest_settings', 'Data')[3])/256) | int(default=0)}} "

    - name: "Solax Local Battery Setting Stop Charge"
      state: "{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[4])%256 | int(default=0)) }}:{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[4])/256) | int(default=0)}} "

    - name: "Solax Local Battery Setting Start Discharge"
      state: "{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[5])%256 | int(default=0)) }}:{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[5])/256) | int(default=0)}} "

    - name: "Solax Local Battery Setting Stop Discharge"
      state: "{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[6])%256 | int(default=0)) }}:{{ '%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[6])/256) | int(default=0)}} "

### Battery settings charge/discharge (period 2) ###    
    - name: "Solax Local Battery Setting Start Charge 2"
      state: "{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[8])%256 | int(default=0)) }}:{{'%02d' %((state_attr('sensor.solax_rest_settings', 'Data')[8])/256) | int(default=0)}} "

    - name: "Solax Local Battery Setting Stop Charge 2"
      state: "{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[9])%256 | int(default=0)) }}:{{'%02d' % ((state_attr('sensor.solax_rest_settings', 'Data')[9])/256) | int(default=0)}} "

### Battery charge/discharge period2 enabled
    - name: "Solax Local Battery ChD2 Enabled"
      unique_id: solax_local_battery_chd2_enabled
      state: "{{ state_attr('sensor.solax_rest_settings', 'Data')[7] == 1 | bool(default=false) }}"

### Inverter working mode
    - name: "Solax Local Inverter Mode"
      unique_id: solax_local_inverter_mode
      device_class: enum
      state: >
          {% set mapper =  {
              0 : 'Self Use',
              1 : 'Feed In Priority',
              2 : 'Back Up',
              3 : 'Manual'} %}
          {% set state =  state_attr('sensor.solax_rest_settings', 'Data')[10] | int(default=0) %}
          {{ mapper[state] if state in mapper else 'Unknown' }}

### Inverter manual mode
    - name: "Solax Local Manual Mode Behaviour"
      unique_id: solax_local_manual_mode_behaviour
      device_class: enum
      state: >
          {% set mapper =  {
              0 : 'Do Nothing',
              1 : 'Forced Charge',
              2 : 'Forced Discharge'} %}
          {% set state =  state_attr('sensor.solax_rest_settings', 'Data')[11] | int(default=0) %}
          {{ mapper[state] if state in mapper else 'Unknown' }}


### Grid power (negative for feed-in, positive for consumption) ###
    - name: "Solax Local Grid Power"
      unique_id: solax_local_grid_power
      state:  >
        {% if state_attr('sensor.solax_local', 'Data')[32] > 32767 %}{{ (state_attr('sensor.solax_local', 'Data')[32] - 65536) | int * -1 }}
        {% else %}{{ state_attr('sensor.solax_local', 'Data')[32] | int * -1}}{% endif %}
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power

### Expected household load (negative not expected as it only consumes energy) ###

    - name: "Solax Local Load Power"
      unique_id: solax_local_load_power
      state: "{{ states('sensor.solax_local_ac_power')| float(default=0) + states('sensor.solax_local_grid_power') | int(default=0) }}"
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power

### HomeAssistant energy dashboard integration

    - name: "House export power"
      unique_id: house_export_power
      icon: mdi:solar-power-variant
      state:  >
        {% if int(states('sensor.solax_local_grid_power')) > 0 %}
          {{ 0 }}
        {% else %}
          {{ states('sensor.solax_local_grid_power') | int * -1}}
        {% endif %}
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power 

    - name: "House import power"
      unique_id: house_import_power
      icon: mdi:solar-power-variant
      state:  >
        {% if int(states('sensor.solax_local_grid_power')) > 0 %}
          {{ states('sensor.solax_local_grid_power') }}
        {% else %}
          {{ 0 }}
        {% endif %}
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power 

    - name: "Battery discharge power"
      unique_id: battery_discharge_power
      state:  >
        {% if int(states('sensor.solax_local_battery_power')) < 0 %}
          {{ states('sensor.solax_local_battery_power') | int * -1 }}
        {% else %}
          {{ 0 }}
        {% endif %}
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power

    - name: "Battery Charge power"
      unique_id: battery_charge_power
      state:  >
        {% if int(states('sensor.solax_local_battery_power')) < 0 %}
          {{ 0 }}
        {% else %}
          {{ states('sensor.solax_local_battery_power') }}
        {% endif %}
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power


### COOPERNICO bi-horario

    - unique_id: coopernico_spot_price_bihorario
      unit_of_measurement: '€/MWh'
      availability: "{{ has_value('sensor.omie_spot_price_pt') }}"
      state_class: measurement
      state: >
        {% set PM = states('sensor.omie_spot_price_pt')|float -%}
        {% set CGS = 4 -%}
        {% set TSE = 2.893 -%}
        {% set k = 10 -%}
        {% set FP = 0.16 -%}
        {% set TAR_vazio = 9.2 -%}
        {% set TAR_fora_vazio = 50.2 -%}
        {% set TAR = TAR_vazio if now().hour < 8 or now().hour > 21 else TAR_fora_vazio -%}
        
        {{ ((PM + CGS + TSE + k)*(1 + FP) + TAR) | round(2) }}
      attributes:
        friendly_name: "Coopérnico Base (tarifário bi-horário)"
        formula: "(PM+CGS+TSE+k)x(1+FP)+TAR"
        PM: "{{ states('sensor.omie_spot_price_pt')|float }}"
        CGS: "{{ 4 }}"
        TSE: "{{ 2.893 }}"
        k: "{{ 10 }}"
        FP: "{{ 0.16 }}"
        TAR_vazio: "{{ 9.2 }}"
        TAR_fora_vazio: "{{ 50.2 }}"
        today_hours: >
            {% set CGS = 4 -%}
            {% set TSE = 2.893 -%}
            {% set k = 10 -%}
            {% set FP = 0.16 -%}
            {% set TAR_vazio = 9.2 -%}
            {% set TAR_fora_vazio = 50.2 -%}
            
            {% set ns = namespace(hourly_data=[]) %}
            {% for h, PM in state_attr('sensor.omie_spot_price_pt', 'today_hours').items() -%}          
              {% if PM == None %}
                {% set price=PM %}
              {% else %}
                {% set TAR = TAR_vazio if h.hour < 8 or h.hour > 21 else TAR_fora_vazio -%}
                {% set price=((PM + CGS + TSE + k)*(1 + FP) + TAR) | round(2) %}
              {% endif %}
              {% set ns.hourly_data=ns.hourly_data + [(h.isoformat(), price)] %}
            {% endfor -%}
            {{ dict(ns.hourly_data) }}
        tomorrow_hours: >
            {% set CGS = 4 -%}
            {% set TSE = 2.893 -%}
            {% set k = 10 -%}
            {% set FP = 0.16 -%}
            {% set TAR_vazio = 9.2 -%}
            {% set TAR_fora_vazio = 50.2 -%}

            {% set ns = namespace(hourly_data=[]) %}
            {% for h, PM in state_attr('sensor.omie_spot_price_pt', 'tomorrow_hours').items() -%}
              {% if PM == None %}
                {% set price=PM %}
              {% else %}
                {% set TAR = TAR_vazio if h.hour < 8 or h.hour > 21 else TAR_fora_vazio -%}
                {% set price=((PM + CGS + TSE + k)*(1 + FP) + TAR) | round(2) %}
              {% endif %}
              {% set ns.hourly_data=ns.hourly_data + [(h.isoformat(), price)] %}
            {% endfor -%}
            {{ dict(ns.hourly_data) }}

### Coppernico cost in euros/kwh

    - unique_id: coopernico_current_price
      name: "Coopernico current Price"
      device_class: monetary
      unit_of_measurement: "€/kWh"
      state: >
        {{ (states('sensor.template_coopernico_spot_price_bihorario')|float(0) / 1000 * 1.23 | round(6)) }}

### Coppernico cost in euros/kwh

    - unique_id: energy_adjusted_price
      name: "Energy adjusted Price"
      device_class: monetary
      unit_of_measurement: "€/kWh"
      state: >
        {% set input_power = states('sensor.house_import_power')|int %}
        {{ input_power/states('sensor.solax_local_total_home_use')|int * states('sensor.coopernico_current_price')|float | round(6) }}

### Energy savings

    - unique_id: energy_saved_price
      name: "Price of energy saved"
      device_class: monetary
      unit_of_measurement: "€/kWh"
      state: >
        {% set input_power = states('sensor.house_import_power')|int %}
        {% set percentage = (1-input_power/(states('sensor.solax_local_total_home_use')|int))|float %}
        {% if percentage < 0 %}
          {% set percentage = 0 %}
        {% endif %}
        {% if percentage > 1 %}
          {% set percentage = 1 %}
        {% endif %}
        {{ percentage * states('sensor.coopernico_current_price')|float | round(6) }}

###
### Energy Costs and Savings calculations
###

### Current Total energy Saved

    - unique_id: current_total_energy_savings
      name: "Current Total_Energy Savings"
      device_class: monetary
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.solax_local_total_home_use')|float(0) * states('sensor.price_of_energy_saved')|float(0) / 1000 }}

### Current Total energy Cost

    - unique_id: current_total_energy_cost
      name: "Current Total_Energy cost"
      device_class: monetary
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.house_import_power')|float(0) * states('sensor.coopernico_current_price')|float(0) | round(6) / 1000 }}

### Current AQS energy Cost

    - unique_id: current_aqs_energy_cost
      name: "Current AQS_Energy cost"
      device_class: monetary
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.tomada_aqs_power')|float(0) * states('sensor.energy_adjusted_price')|float(0) / 1000 }}

### Current VE energy Cost

    - unique_id: current_ve_energy_cost
      name: "Current VE_Energy cost"
      device_class: monetary
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.box_ve1_power')|float(0) * states('sensor.energy_adjusted_price')|float(0) / 1000 }}


### Not specified costs

    - unique_id: other_energy_cost_daily
      name: "Other Energy costs Daily"
      device_class: monetary
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.total_energy_cost_daily')|float(0) - states('sensor.bmw_energy_cost_daily')|float(0) - states('sensor.aqs_energy_cost_daily')|float(0) }}

    - unique_id: other_energy_cost_monthly
      name: "Other Energy costs Monthly"
      device_class: monetary
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.total_energy_cost_monthly')|float(0) - states('sensor.bmw_energy_cost_monthly')|float(0) - states('sensor.aqs_energy_cost_monthly')|float(0) }}



  daily_energy:
