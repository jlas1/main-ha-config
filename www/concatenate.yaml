###################################
# Solax X1 Hybrid G4 Rest Sensors #
###################################

### Integrations to convert power into energy

- platform: integration
  source: sensor.house_export_power
  unique_id: house_export_energy
  name: "House exported Energy"
  unit_prefix: k
  round: 2

- platform: integration
  source: sensor.house_import_power
  unique_id: house_import_energy
  name: "House imported Energy"
  unit_prefix: k
  round: 2

- platform: integration
  source: sensor.battery_charge_power
  unique_id: battery_charge_energy
  name: "Battery Energy Charged"
  unit_prefix: k
  round: 2

- platform: integration
  source: sensor.battery_discharge_power
  unique_id: battery_discharge_energy
  name: "Battery Energy Discharged"
  unit_prefix: k
  round: 2

### Schedule State

- platform: schedule_state
  name: Schedule for Water heating at night
  # refresh: "6:00:00"                # this is the default
  # default_state: default            # this is the default
  # icon: mdi:calendar-check          # this is the default
  # error_icon: mdi:calendar-alert    # this is the default
  # minutes_to_refresh_on_error: 5    # this is the default
  # allow_wrap: False                 # this is the default
  default_state: "Off"
  allow_wrap: True
  events:
    - state: "Off"
    - start: "{{ as_timestamp(states('input_datetime.night_water_heating_start')) }}"
      end: "{{ as_timestamp(states('input_datetime.night_water_heating_stop')) }}"
      state: "On"

- platform: average
  name: "Box VE1 Power 5min Average"
  duration:
    minutes: 5
  entities:
      - sensor.box_ve1_power 

- platform: average
  name: "Box VE2 Power 5min Average"
  duration:
    minutes: 5
  entities:
      - sensor.box_ve2_power 

- platform: average
  name: "Solar Power 5min Average"
  duration:
    minutes: 5
  entities:
      - sensor.solax_pv_power_total

- platform: average
  name: "House Power 5min Average"
  duration:
    minutes: 5
  entities:
      - sensor.solax_house_load 

- platform: average
  name: "AQS Power 5min Average"
  duration:
    minutes: 5
  entities:
      - sensor.tomada_aqs_power
- trigger:
    - platform: time
      at: "23:59"
  sensor:
    - name: "Estimated Solar Power Yesterday"
      unique_id: estimated_solar_power_yesterday
      unit_of_measurement: "kWh"
      state: >
        {{ states('sensor.energy_production_today') }}

- sensor:

    - name: "Grid Meter Power"
      unique_id: grid_meter_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:transmission-tower
      state: >-
        {% set pwr = states('sensor.power_monitor_1_power_a') | float(0) | abs %}
        {% set flow = states('sensor.power_monitor_1_energy_flow_a') | string | lower %}
        {% set direction = -1 if flow == 'producing' else 1 %}
        {{ (pwr * direction) | round(2) }}
      availability: >-
        {{ has_value('sensor.power_monitor_1_power_a') and has_value('sensor.power_monitor_1_energy_flow_a') }}

    - name: "Solax Local Inverter Operation Mode"
      unique_id: solax_local_inverter_operation_mode
      icon: mdi:solar-power-variant
      state: >
        {{ states('sensor.solax_run_mode') }}

    - name: "Solax Cloud Yield Today"
      state: "{{ states('sensor.solax_today_s_yield') }}"
      unit_of_measurement: "kWh"
      unique_id: solax_2
      icon: mdi:flash
      device_class: energy
      state_class: total_increasing

    - name: "Solax Cloud Yield Total"
      state: "{{ states('sensor.solax_total_yield') }}"
      unit_of_measurement: "kWh"
      unique_id: solax_3
      icon: mdi:flash
      device_class: energy
      state_class: total_increasing

    - name: "Solax Cloud Inverter"
      unit_of_measurement: "W"
      state: "{{ states('sensor.solax_inverter_power') | default(0) }}"
      unique_id: solax_cloud_inverter
      icon: mdi:flash
      device_class: power
      state_class: measurement

    - name: "Solax Cloud Battery Status"
      state: "{{ states('sensor.solax_bdc_status') }}"
      unique_id: solax_6
      icon: mdi:battery

    - name: "Solax Cloud Solar Panel"
      state: "{{ states('sensor.solax_pv_power_total') }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: solax_cloud_solar_panel
      icon: mdi:solar-power-variant

    - name: "Solax Cloud Battery Use"
      state: >
       {{ states('sensor.solax_battery_power_charge') }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: solax_cloud_battery_use
      icon: mdi:battery

    - name: "Solax Cloud Battery Adjusted"
      state: >
        {% set ac = states('sensor.solax_cloud_inverter')|int %}
        {% set pv = states('sensor.solax_cloud_solar_panel')|int %}
        {{ (0 - ac + pv) }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: solax_cloud_battery_adjusted
      icon: mdi:battery

    - name: "Solax Cloud Battery Use In"
      state: >
        {% set batAdj = states('sensor.solax_cloud_battery_adjusted')|int(default=0) %}
        {% set attr = states('sensor.solax_battery_power_charge') %}
        {{ batAdj if is_number(batAdj) and (batAdj|int > 0) else 0 }}
      unit_of_measurement: "W"
      unique_id: solax_cloud_battery_use_in
      icon: mdi:battery

    - name: "Solax Cloud Battery Use Out"
      state: >
        {% set batAdj = states('sensor.solax_cloud_battery_adjusted')|int(default=0) %}
        {% set attr = states('sensor.solax_battery_power_charge') %}
        {{ (0 - batAdj) if is_number(batAdj) and (batAdj|int < 0) else 0 }}
      unit_of_measurement: "W"
