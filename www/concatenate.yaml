    - name: "Total House SOC"
      unique_id: total_house_soc
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      icon: mdi:battery-charging-50
      state: >-
        {% set solax_avail = has_value('sensor.solax_battery_capacity') %}
        {% set victron_avail = has_value('sensor.garage_gx_device_dc_battery_charge') %}

        {% set solax_soc = states('sensor.solax_battery_capacity') | float(0) if solax_avail else 0 %}
        {% set victron_soc = states('sensor.garage_gx_device_dc_battery_charge') | float(0) if victron_avail else 0 %}

        {% set w_solax = 11.6 if solax_avail else 0 %}
        {% set w_victron = 8.4 if victron_avail else 0 %}

        {% set total_weight = w_solax + w_victron %}

        {% if total_weight > 0 %}
          {% set raw_soc = ((solax_soc * w_solax) + (victron_soc * w_victron)) / total_weight %}
          {{ [[raw_soc, 0] | max, 100] | min | round(1) }}
        {% else %}
          unavailable
        {% endif %}
      availability: >-
        {{ has_value('sensor.solax_battery_capacity') or has_value('sensor.garage_gx_device_dc_battery_charge') }}

