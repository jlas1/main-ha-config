- id: '1395837280000'
  alias: SOLAX Set Solar Battery night charge Target Level
  description: Set target battery level (charge from grid) based on anticipated solar
    production
  trigger:
  - platform: time
    at: '21:30:00'
  condition: []
  action:
  - repeat:
      sequence:
      - service: input_number.set_value
        data_template:
          entity_id: input_number.new_battery_target
          value: "{% set solar = states('sensor.energy_production_tomorrow') | float
            %} {% set target = 80 %} {% if is_number(solar) %}\n   {% set batt_needed
            = ( 22 - solar | float) | float%} \n   {% if (batt_needed  <= 0) %}\n
            \     {% set target = 10 %}\n   {% endif %}\n   {% if (batt_needed > 0)
            and (batt_needed <= 1) %}\n      {% set target = 20 %}\n   {% endif %}\n
            \  {% if (batt_needed > 1) and (batt_needed <= 2) %}\n      {% set target
            = 30 %}\n   {% endif %}\n   {% if (batt_needed > 2) and (batt_needed <=
            3) %}\n      {% set target = 40 %}\n   {% endif %}\n   {% if (batt_needed
            > 3) and (batt_needed <= 4) %}\n      {% set target = 50 %}\n   {% endif
            %}\n   {% if (batt_needed > 4) and (batt_needed <= 5) %}\n      {% set
            target = 60 %}\n   {% endif %}\n   {% if (batt_needed > 5) and (batt_needed
            <= 6) %}\n      {% set target = 70 %}\n   {% endif %}\n   {% if (batt_needed
            > 6) and (batt_needed <= 7) %}\n      {% set target = 80 %}\n   {% endif
            %}\n   {% if (batt_needed > 7) and (batt_needed <= 8) %}\n      {% set
            target = 90 %}\n   {% endif %}\n   {% if (batt_needed > 8) %}\n      {%
            set target = 95 %}\n   {% endif %}\n {% endif %}\n {{ target }}\n"
      - service: rest_command.solax_local_set_charge_battery_from_grid
        data:
          level: '{{ states(''input_number.new_battery_target'') }}

            '
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      - service: homeassistant.update_entity
        data: {}
        target:
          entity_id: sensor.solax_local_rest_settings_2
      until:
      - condition: template
        value_template: "{{ states('sensor.solax_local_battery_charge_from_grid_to')|int
          == states('input_number.new_battery_target')|int or\n    repeat.index ==
          3 }}"
  mode: single
