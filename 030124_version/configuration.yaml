# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Uncomment this if you are using SSL/TLS, running in Docker container, etc.
# http:
#   base_url: example.duckdns.org:8123

# Text to speech
tts:
  - platform: google_translate

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
#scene: !include scenes.yaml
sensor: !include sensor.yaml
homeassistant:
  customize: !include customize.yaml
  packages: !include_dir_named packages
template: !include template.yaml
powercalc: !include powercalc.yaml

rest_command:

  solax_local_set_charge_battery_from_grid:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_battery_grid_charge_level_payload

  solax_local_set_battery_min_soc:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_battery_min_soc_payload

  solax_local_set_battery_min_soc:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_charger_max_current

  solax_local_set_period2_enable:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_period2_enable_payload

  solax_local_set_forced_charge_start:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_battery_forced_charge_start

  solax_local_set_forced_charge_stop:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_battery_forced_charge_stop

  solax_local_set_forced_charge_stop2:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_battery_forced_charge_stop2

  solax_local_set_inverter_mode:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_inverter_mode

  solax_local_set_manual_mode_behaviour:
    url: !secret solax_local_ip
    method: post
    payload: !secret solax_local_set_manual_mode_behaviour

api:

#alexa:
#  smart_home:

emulated_hue:
  listen_port: 80
  host_ip: 10.10.10.80
  expose_by_default: true
#  exposed_domains: ["switch", "light", "group", "input_boolean",mysensors"]
  exposed_domains: ["switch", "light", "group", "input_boolean"]
  

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.10.10.252
    - 10.10.10.253
    - 10.10.10.254
  ip_ban_enabled: true
  login_attempts_threshold: 10

mysensors:
  gateways:
    - device: 'mqtt'
      topic_in_prefix: 'myRFM69-out'
      topic_out_prefix: 'myRFM69-in'
      nodes:
        1:
            name: 'Solar Heater Temperature'
        3:
            name: 'Main Power Meter'
        10:
            name: 'Solar Power Meter'
            
    - device: 'mqtt'
      topic_in_prefix: 'myRFM24-out'
      topic_out_prefix: 'myRFM24-in'     
  version: '2.3'

recorder:
 purge_keep_days: 62

# Enables support for tracking state changes over time
history:


# View all events in a logbook
logbook:

# Track the sun
sun:

influxdb:
  host: 'localhost'
  port: 8086
  database: 'homeassistant'
  username: 'homeassistant'
  password: 'homeassistant'
  max_retries: 3
  default_measurement: state

# Logger

logger:
  default: info
  logs:
    device_tracker: warning
    homeassistant.components.rest: debug
#   custom_components.powercalc: debug    
