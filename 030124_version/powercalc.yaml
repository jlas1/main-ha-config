sensors:
  - entity_id: sensor.solax_local_pv_output
    name: Solax Solar Panels V2
    fixed:
      power: "{{ states('sensor.solax_local_pv_output')| int(default=0) }}"

  - entity_id: sensor.solax_cloud_solar_panel
    name: Solax Cloud Solar Panels V1
    fixed:
      power: "{{ states('sensor.solax_cloud_solar_panel')| int(default=0) }}"

  - entity_id: sensor.solax_cloud_battery_use_in
    name: Solax Cloud Battery In V1
    fixed:
      power: "{{states('sensor.solax_cloud_battery_use_in')}}"

  - entity_id: sensor.solax_cloud_battery_use_out
    name: Solax Cloud Battery Out V1
    fixed:
      power: "{{states('sensor.solax_cloud_battery_use_out')}}"

  - entity_id: sensor.solax_local_battery_power
    name: Battery charging/discharging Energy
    fixed:
      power: "{{states('sensor.solax_local_battery_power')}}"

  - entity_id: sensor.solax_local_grid_power
    name: Grid power Energy
    fixed:
      power: "{{states('sensor.solax_local_grid_power')}}"

  - entity_id: sensor.solax_local_ac_power
    name: Inverter output Energy
    fixed:
      power: "{{states('sensor.solax_local_ac_power')}}"

  - entity_id: sensor.solax_local_ac_power
    name: Expected household load Energy
    fixed:
      power: "{{states('sensor.solax_local_ac_power')}}"

