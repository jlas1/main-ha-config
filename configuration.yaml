recorder:
 purge_keep_days: 3
 auto_purge: true
 auto_repack: false

# Enables support for tracking state changes over time
history:


# View all events in a logbook
logbook:

# Track the sun
sun:

# Logger

logger:
  default: info
  logs:
    device_tracker: warning
#    recorder: debug
#    homeassistant.components.mysensors: debug
#    homeassistant.components.rest: debug
#   custom_components.powercalc: debug    
#    custom_components.pyscript: info

cover:
  - platform: template
    covers:
      garage_door:
        device_class: garage
        friendly_name: "Garage Door"
        unique_id: garage_door_cover
        value_template: >-
          {% if is_state('binary_sensor.porta_garagem_garage_door_contact', 'on') %}
            open
          {% else %}
            closed
          {% endif %}
        open_cover:
          service: switch.turn_off
          target:
            entity_id: switch.porta_garagem_trigger
        close_cover:
          service: switch.turn_off
          target:
            entity_id: switch.porta_garagem_trigger
        stop_cover:
          service: switch.turn_off
          target:
            entity_id: switch.porta_garagem_trigger
