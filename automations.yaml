- id: '1704330555876'
  alias: Change Energy Tarifs
  description: ''
  triggers:
  - at: 08:00:00
    trigger: time
  - at: '22:00:00'
    trigger: time
  - event: start
    trigger: homeassistant
  actions:
  - variables:
      is_peak: '{{ today_at(''08:00'') <= now() < today_at(''22:00'') }}'
      tariff: '{{ ''peak'' if is_peak else ''offpeak'' }}'
      tariffPT: '{{ ''pico'' if is_peak else ''Fora de Vazio'' }}'
  - target:
      entity_id: select.daily_energy
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - target:
      entity_id: select.daily_energy
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - target:
      entity_id: select.bmw_ce_monthly_energy
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - target:
      entity_id: select.monthly_energy
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - target:
      entity_id: select.water_heater_energy_daily
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - target:
      entity_id: select.water_heater_energy_weekly
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - target:
      entity_id: select.water_heater_energy_monthly
    data:
      option: '{{ tariff }}'
    action: select.select_option
  - action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: Energy tariffs changed to {{ tariff }}.
  mode: single
- id: '1706317008926'
  alias: Automation Light Escadas Garagem
  description: ''
  triggers:
  - entity_id:
    - switch.switch_escadas_garagem
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: switched.on
    trigger: state
  - event_type: timer.finished
    event_data:
      entity_id: timer.luz_escadas_garagem
    id: timer.finished
    trigger: event
  - entity_id:
    - binary_sensor.0x00158d000447584c_occupancy
    to: 'on'
    from:
    id: movement.detected
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - switch.switch_escadas_garagem
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: switched.off
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: movement.detected
      sequence:
      - if:
        - condition: state
          entity_id: switch.switch_escadas_garagem
          state: 'off'
        then:
        - action: timer.start
          target:
            entity_id: timer.luz_escadas_garagem
          data:
            duration: 00:02:00
        - action: switch.turn_on
          target:
            entity_id: switch.switch_escadas_garagem
          enabled: false
        - action: notify.send_message
          target:
            entity_id: notify.house_control_log
          data:
            message: Garage stairs light turned ON (Motion detected).
        else:
        - action: timer.start
          target:
            entity_id: timer.luz_escadas_garagem
          data:
            duration: 00:02:00
        - action: notify.send_message
          target:
            entity_id: notify.house_control_log
          data:
            message: Garage stairs light timer extended (Motion).
    - conditions:
      - condition: trigger
        id: switched.on
      sequence:
      - action: timer.start
        target:
          entity_id: timer.luz_escadas_garagem
        data:
          duration: 00:02:00
      - action: notify.send_message
        target:
          entity_id: notify.house_control_log
        data:
          message: Garage stairs light turned ON (Manual).
    - conditions:
      - condition: trigger
        id: timer.finished
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.switch_escadas_garagem
      - action: notify.send_message
        target:
          entity_id: notify.house_control_log
        data:
          message: Garage stairs light turned OFF (Timer finished).
    - conditions:
      - condition: trigger
        id: switched.off
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.luz_escadas_garagem
      - action: notify.send_message
        target:
          entity_id: notify.house_control_log
        data:
          message: Garage stairs light turned OFF (Manual).
  mode: single
- id: '1706828856750'
  alias: Freeds MQTT update
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.main_power_meter_3_1_2
    attribute: V_WATT
    id: Power change
  - platform: state
    entity_id:
    - sensor.freeds_water_temp
    id: Water temp change
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: Power change
      sequence:
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/GridWatts
          qos: 0
          payload_template: '{{ states(''sensor.main_power_meter_3_1_2'') }}'
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/MPPT1_Watts
          qos: 0
          payload_template: '{{ states(''sensor.solax_local_pv1_output'') }}'
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/MPPT2_Watts
          qos: 0
          payload_template: '{{ states(''sensor.solax_local_pv2_output'') }}'
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/PvWattsTotal
          qos: 0
          payload_template: '{{ states(''sensor.solax_local_pv_output'') }}'
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/BatterySOC
          qos: 0
          payload_template: '{{ states(''sensor.solax_battery_capacity'') }}'
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/LoadWatts
          qos: 0
          payload_template: '{{ states(''sensor.solax_local_ac_power'') }}'
      - service: mqtt.publish
        data:
          retain: true
          topic: Inverter/BatteryWatts
          qos: 0
          payload_template: '{{ states(''sensor.solax_local_battery_power'') }}'
  mode: single
- id: '1708009852571'
  alias: Automation Luz Garagem
  description: Smart Garage Light with Timer, Motion, Manual Override & Ghost Protection
  triggers:
  - trigger: state
    entity_id: switch.switch_garagem_left
    from: 'off'
    to: 'on'
    id: switched.on
  - trigger: state
    entity_id: switch.switch_garagem_left
    from: 'on'
    to: 'off'
    id: switched.off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.luz_garagem
    id: timer.finished
  - trigger: state
    entity_id:
    - binary_sensor.gms2_occupancy
    - binary_sensor.gms3_occupancy
    - binary_sensor.gms4_occupancy
    from: 'off'
    to: 'on'
    id: movement.detected
  - trigger: state
    entity_id: cover.garage_door
    from: closed
    to: open
    id: garage door opening
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - movement.detected
        - garage door opening
      - condition: template
        value_template: "{% set light = states.switch.switch_garagem_left %} {% if
          light.state == 'off' %}\n  {% if light.context.parent_id == none %}\n    {{
          (now() - light.last_changed).total_seconds() > 5 }}\n  {% else %}\n    true\n
          \ {% endif %}\n{% else %}\n  {{ light.context.parent_id != none }}\n{% endif
          %}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.switch_garagem_left
      - action: timer.start
        target:
          entity_id: timer.luz_garagem
        data:
          duration: 00:05:00
      - action: notify.send_message
        target:
          entity_id: notify.house_control_log
        data:
          message: Garage light ON / Timer extended to 5m (Motion/Door).
    - conditions:
      - condition: trigger
        id: switched.on
      - condition: template
        value_template: '{{ trigger.to_state.context.parent_id == none }}'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.luz_garagem
        data:
          duration: 01:00:00
      - action: notify.send_message
        target:
          entity_id: notify.house_control_log
        data:
          message: Garage light ON (Manual 60m Override).
    - conditions:
      - condition: trigger
        id: switched.off
      - condition: template
        value_template: '{{ trigger.to_state.context.parent_id == none }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.luz_garagem
      - action: notify.send_message
        target:
          entity_id: notify.house_control_log
        data:
          message: Garage light OFF (Manual).
    - conditions:
      - condition: trigger
        id: timer.finished
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.gms2_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.gms3_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.gms4_occupancy
            state: 'on'
        then:
        - action: timer.start
          target:
            entity_id: timer.luz_garagem
          data:
            duration: 00:05:00
        - action: notify.send_message
          target:
            entity_id: notify.house_control_log
          data:
            message: Garage light timer extended 5m (Still occupied).
        else:
        - action: switch.turn_off
          target:
            entity_id: switch.switch_garagem_left
        - action: notify.send_message
          target:
            entity_id: notify.house_control_log
          data:
            message: Garage light OFF (Timer finished, empty).
  mode: restart
- id: '1708298931183'
  alias: Water Heater Management
  description: ''
  triggers:
  - entity_id:
    - sensor.sonoff_1001dabf03_temperature
    - input_number.water_heater_minimum_target
    - input_number.water_heater_maximum_target
    - input_number.water_heater_dinner_target
    - input_boolean.no_water_heating
    id: water temperature change
    trigger: state
  - at: input_datetime.night_water_heating_start
    trigger: time
  - at: input_datetime.night_water_heating_stop
    trigger: time
  - at: input_datetime.late_afternoon_water_heating_start
    trigger: time
  - at: input_datetime.late_afternoon_water_heating_stop
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.no_water_heating
        state: 'on'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'on'
        then:
        - target:
            entity_id: input_boolean.automatic_aqs_switch
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Disabled AQS (No water heating active).
    - conditions:
      - condition: time
        after: input_datetime.night_water_heating_start
        before: input_datetime.night_water_heating_stop
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.sonoff_1001dabf03_temperature
          below: input_number.water_heater_maximum_target
        - condition: template
          value_template: '{{ (( as_timestamp(now()) - state_attr(''input_datetime.last_high_water_temp'',
            ''timestamp''))  / 86400) | round() > 30 }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'off'
        then:
        - target:
            entity_id:
            - input_boolean.automatic_aqs_switch
          action: input_boolean.turn_on
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Started AQS (Night water too cold).
    - conditions:
      - condition: time
        after: input_datetime.night_water_heating_start
        before: input_datetime.night_water_heating_stop
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.sonoff_1001dabf03_temperature
          above: input_number.water_heater_maximum_target
          value_template: '{{ float (state.state) -2 }}'
        - condition: template
          value_template: '{{ not (( as_timestamp(now()) - state_attr(''input_datetime.last_high_water_temp'',
            ''timestamp''))  / 86400) | round() > 30 }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.automatic_aqs_switch
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped AQS (Night water too hot).
    - conditions:
      - condition: time
        after: input_datetime.late_afternoon_water_heating_start
        before: input_datetime.late_afternoon_water_heating_stop
      - condition: numeric_state
        entity_id: sensor.sonoff_1001dabf03_temperature
        below: input_number.water_heater_dinner_target
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'off'
        then:
        - target:
            entity_id:
            - input_boolean.automatic_aqs_switch
          action: input_boolean.turn_on
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Started AQS (Late afternoon water too cold).
    - conditions:
      - condition: time
        after: input_datetime.late_afternoon_water_heating_start
        before: input_datetime.late_afternoon_water_heating_stop
      - condition: numeric_state
        entity_id: sensor.sonoff_1001dabf03_temperature
        above: input_number.water_heater_dinner_target
        value_template: '{{ float (state.state) -2 }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.automatic_aqs_switch
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped AQS (Late afternoon water too hot).
    - conditions:
      - condition: numeric_state
        entity_id: sensor.sonoff_1001dabf03_temperature
        below: input_number.water_heater_minimum_target
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'off'
        then:
        - target:
            entity_id:
            - input_boolean.automatic_aqs_switch
          action: input_boolean.turn_on
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Started AQS (Water critically cold).
    - conditions:
      - condition: numeric_state
        entity_id: sensor.sonoff_1001dabf03_temperature
        above: input_number.water_heater_minimum_target
        value_template: '{{ float (state.state) -2 }}'
      - condition: not
        conditions:
        - condition: time
          after: input_datetime.night_water_heating_start
          before: input_datetime.night_water_heating_stop
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automatic_aqs_switch
          state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.automatic_aqs_switch
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped AQS (Water reached target).
  - if:
    - condition: numeric_state
      entity_id: sensor.sonoff_1001dabf03_temperature
      above: 65
    then:
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ now().timestamp() }}'
      target:
        entity_id: input_datetime.last_high_water_temp
  mode: queued
  max: 10
