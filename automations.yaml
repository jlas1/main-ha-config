  description: ''
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.ev_charger_status'') == ''waiting'' }}'
    id: EV charger waiting
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: template
    value_template: '{{ states(''sensor.ev_charger_2_status'') == ''waiting'' }}'
    id: EV charger2 waiting
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions: []
  actions:
  - if:
    - condition: and
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.manual_override_ve_switch
          state: 'on'
        - condition: state
          entity_id: input_boolean.automatic_ve_switch
          state: 'on'
        - condition: state
          entity_id: input_boolean.grid_injection_avoidance_ve_switch
          state: 'on'
      - condition: state
        entity_id: sensor.ev_charger_status
        state:
        - waiting
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.box_ve1
    - delay:
        seconds: 5
    - action: switch.turn_on
      target:
        entity_id: switch.box_ve1
    - action: notify.send_message
      target:
        entity_id: notify.ev_fleet_log
      data:
        message: EV Charger reset triggered.
  - if:
    - condition: and
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.manual_override_ve2_switch
          state: 'on'
        - condition: state
          entity_id: input_boolean.automatic_ve2_switch
          state: 'on'
        - condition: state
          entity_id: input_boolean.grid_injection_avoidance_ve2_switch
          state: 'on'
      - condition: state
        entity_id: sensor.ev_charger_2_status
        state:
        - waiting
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.box_ve2
    - delay:
        seconds: 5
    - action: switch.turn_on
      target:
        entity_id: switch.box_ve2
    - action: notify.send_message
      target:
        entity_id: notify.ev_fleet_log
      data:
        message: EV2 Charger reset triggered.
  mode: single
