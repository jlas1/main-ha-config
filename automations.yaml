      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.tomada_ds2
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: Dehumidifier Lucas stopped due to low power (<50W for 30m).
    - conditions:
      - condition: trigger
        id: Stop dehumidifier Lara
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.desumificador_lara
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: Dehumidifier Lara stopped due to low power (<50W for 30m).
  mode: queued
  max: 10
- id: '1721774385824'
  alias: AC Automatic Mode
  description: ''
  triggers:
  - entity_id:
    - input_boolean.automation_start_rooms_ac
    id: Start rooms
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.automation_start_rooms_ac
    id: Stop rooms2
    from: 'on'
    to: 'off'
    trigger: state
  - entity_id:
    - input_boolean.automation_start_livingroom_ac
    id: Start LivingRoom
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.automation_start_livingroom_ac
    id: Stop LivingRoom
    from: 'on'
    to: 'off'
    trigger: state
  - entity_id:
    - timer.top_ac_timer
    to: idle
    from: active
    id: Timer Top stopped
    trigger: state
  - entity_id:
    - timer.bottom_ac_timer
    from: active
    to: idle
    id: Timer Bottom stopped
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Start rooms
      sequence:
      - target:
          entity_id:
          - climate.lara_ac_control
          - climate.quarto_lucas_ac
          - climate.suite_ac
        action: climate.turn_on
      - delay:
          seconds: 3
      - target:
          entity_id:
          - climate.lara_ac_control
          - climate.quarto_lucas_ac
          - climate.suite_ac
        action: climate.turn_on
      - target:
          entity_id: timer.top_ac_timer
        action: timer.start
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: Started Rooms AC.
    - conditions:
      - condition: trigger
        id: Stop rooms2
      sequence:
      - if:
        - condition: state
          entity_id: timer.top_ac_timer
          state: idle
        then:
        - target:
            entity_id:
            - climate.lara_ac_control
            - climate.quarto_lucas_ac
            - climate.suite_ac
          action: climate.turn_off
        - delay:
            hours: 0
            minutes: 0
            seconds: 3
            milliseconds: 0
        - target:
            entity_id:
            - climate.lara_ac_control
            - climate.quarto_lucas_ac
            - climate.suite_ac
          action: climate.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped Rooms AC (Commanded).
    - conditions:
      - condition: trigger
        id: Timer Top stopped
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automation_start_rooms_ac
          state: 'off'
        then:
        - target:
            entity_id:
            - climate.lara_ac_control
            - climate.quarto_lucas_ac
            - climate.suite_ac
          action: climate.turn_off
        - delay:
            seconds: 3
        - target:
            entity_id:
            - climate.lara_ac_control
            - climate.quarto_lucas_ac
            - climate.suite_ac
          action: climate.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped Rooms AC (Timer expired & Dump Off).
    - conditions:
      - condition: trigger
        id: Start LivingRoom
      sequence:
      - target:
          entity_id:
          - climate.dinner_ac
          - climate.tv_ac
        action: climate.turn_on
      - delay:
          seconds: 3
      - target:
          entity_id:
          - climate.dinner_ac
          - climate.tv_ac
        action: climate.turn_on
      - target:
          entity_id: timer.bottom_ac_timer
        action: timer.start
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: Started Living Room AC.
    - conditions:
      - condition: trigger
        id: Stop LivingRoom
      sequence:
      - if:
        - condition: state
          entity_id: timer.bottom_ac_timer
          state: idle
        then:
        - target:
            entity_id:
            - climate.dinner_ac
            - climate.tv_ac
          action: climate.turn_off
        - delay:
            seconds: 3
        - target:
            entity_id:
            - climate.dinner_ac
            - climate.tv_ac
          action: climate.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped Living Room AC (Commanded).
    - conditions:
      - condition: trigger
        id: Timer Bottom stopped
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.automation_start_livingroom_ac
          state: 'off'
        then:
        - target:
            entity_id:
            - climate.dinner_ac
            - climate.tv_ac
          action: climate.turn_off
        - delay:
            seconds: 3
        - target:
            entity_id:
            - climate.dinner_ac
            - climate.tv_ac
          action: climate.turn_off
        - target:
            entity_id:
            - climate.dinner_ac
            - climate.tv_ac
          action: climate.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.climate_aqs_log
          data:
            message: Stopped Living Room AC (Timer expired & Dump Off).
  mode: queued
  max: 2
- id: '1731493787262'
  alias: No Water Heating
  description: Blocks AQS during Horas de Ponta (Tri-horário, Ciclo Diário)
  triggers:
  - at: 09:00:00
    trigger: time
  - at: '10:30:00'
    trigger: time
  - at: '13:00:00'
    trigger: time
  - at: '18:00:00'
    trigger: time
  - at: '19:30:00'
    trigger: time
  - at: '20:30:00'
    trigger: time
  - at: '21:00:00'
    trigger: time
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - variables:
      is_dst: '{{ now().timetuple().tm_isdst > 0 }}'
      in_winter_peak: '{{ not is_dst and ((today_at("09:00") <= now() < today_at("10:30"))
        or (today_at("18:00") <= now() < today_at("20:30"))) }}'
      in_summer_peak: '{{ is_dst and ((today_at("10:30") <= now() < today_at("13:00"))
        or (today_at("19:30") <= now() < today_at("21:00"))) }}'
      target_state: '{{ "on" if (in_winter_peak or in_summer_peak) else "off" }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ target_state == "on" and is_state("input_boolean.no_water_heating",
          "off") }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.no_water_heating
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: No Water Heating schedule started (Peak Tariff).
    - conditions:
      - condition: template
        value_template: '{{ target_state == "off" and is_state("input_boolean.no_water_heating",
          "on") }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.no_water_heating
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: No Water Heating schedule ended (Peak Tariff over).
  mode: single
