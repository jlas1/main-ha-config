          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Night [Victron]: Excess energy (Current SOC: {{ states(''sensor.garage_gx_device_dc_battery_charge'')
              }}%). Force Charging disabled, minimum SOC set to {{ (states(''input_number.new_battery_target'')
              | float(0) + 10) | int }}%.'
    - conditions:
      - condition: trigger
        id: start_day
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
