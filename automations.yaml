    data: {}
  mode: single
- id: '1782238419640'
  alias: 'Holiday Mode: Evening Presence Simulation'
  description: Closes blinds and manages randomized lighting sequences to simulate
    realistic human presence throughout the evening.
  triggers:
  - trigger: sun
    event: sunset
    id: sunset_events
  - trigger: time
    at: '22:00:00'
    id: night_blinds_close
  - trigger: time
    at: '21:50:00'
    id: lights_on_sequence
  - trigger: time
    at: '22:10:00'
    id: kids_lights_off
  - trigger: time
    at: '22:30:00'
    id: hall_light_off
  conditions:
  - condition: state
    entity_id: input_boolean.holliday_mode
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset_events
      sequence:
      - alias: Stop Patio and Kitchen (Initialization)
        action: cover.stop_cover
        target:
          entity_id:
          - cover.blinds_patio
          - cover.blinds_kitchen
      - alias: Close Patio and Kitchen fully
        action: cover.close_cover
        target:
          entity_id:
          - cover.blinds_patio
          - cover.blinds_kitchen
      - alias: Turn on Sunset Light
        action: light.turn_on
        target:
          entity_id: light.switch_quadro1_l2
    - conditions:
      - condition: trigger
        id: lights_on_sequence
      sequence:
      - alias: Randomize start time between 21:50 and 21:58
        delay:
          minutes: '{{ range(0, 9) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Determine the random order of the 3 lights
        variables:
          l_list: '{{ [''light.switch_quadro1_l1'', ''switch.switch_quarto_lucas'',
            ''switch.switch_quarto_lara''] }}'
          first_l: '{{ l_list | random }}'
          l_list2: '{{ l_list | reject(''eq'', first_l) | list }}'
          second_l: '{{ l_list2 | random }}'
          third_l: '{{ l_list2 | reject(''eq'', second_l) | list | first }}'
      - alias: Turn on First Random Light
        action: homeassistant.turn_on
        target:
          entity_id: '{{ first_l }}'
      - delay:
          seconds: '{{ range(5, 11) | random }}'
      - alias: Turn on Second Random Light
        action: homeassistant.turn_on
        target:
          entity_id: '{{ second_l }}'
      - delay:
          seconds: '{{ range(5, 11) | random }}'
      - alias: Turn on Third Random Light
        action: homeassistant.turn_on
        target:
          entity_id: '{{ third_l }}'
    - conditions:
      - condition: trigger
        id: night_blinds_close
      sequence:
      - alias: Randomize closing time between 22:00 and 22:30
        delay:
          minutes: '{{ range(0, 31) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Stop Master Suite (Initialization)
        action: cover.stop_cover
        target:
          entity_id: cover.blinds_suite
      - alias: Close Master Suite
        action: cover.close_cover
        target:
          entity_id: cover.blinds_suite
      - delay:
          seconds: '{{ range(5, 11) | random }}'
      - alias: Stop Master Bathroom (Initialization)
        action: cover.stop_cover
        target:
          entity_id: cover.blinds_master_bathroom
      - alias: Close Master Bathroom
        action: cover.close_cover
        target:
          entity_id: cover.blinds_master_bathroom
    - conditions:
      - condition: trigger
        id: kids_lights_off
      sequence:
      - alias: Randomize start time between 22:10 and 22:30
        delay:
          minutes: '{{ range(0, 21) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Determine the random order to turn off kids lights
        variables:
          first_kid: '{{ [''switch.switch_quarto_lucas'', ''switch.switch_quarto_lara'']
            | random }}'
          second_kid: '{{ ''switch.switch_quarto_lucas'' if first_kid == ''switch.switch_quarto_lara''
            else ''switch.switch_quarto_lara'' }}'
      - alias: Turn off First Kids Light
        action: homeassistant.turn_off
        target:
          entity_id: '{{ first_kid }}'
      - alias: Wait between 30s and 1m
        delay:
          seconds: '{{ range(30, 61) | random }}'
      - alias: Turn off Second Kids Light
        action: homeassistant.turn_off
        target:
          entity_id: '{{ second_kid }}'
    - conditions:
      - condition: trigger
        id: hall_light_off
      sequence:
      - alias: Randomize turn off between 22:30 and 22:45
        delay:
          minutes: '{{ range(0, 16) | random }}'
          seconds: '{{ range(0, 60) | random }}'
      - alias: Turn off Hall Light
        action: light.turn_off
        target:
          entity_id: light.switch_quadro1_l1
      - alias: Turn off Living room Light
        action: light.turn_off
        target:
          entity_id: light.switch_quadro1_l2
  mode: parallel
  max: 10
- id: '1783463289663'
  alias: 'System: Network Link Speed Degradation Monitor'
  description: Monitors switch uplinks and APs. Triggers a persistent UI alert and
    logs the event if a port negotiates below its hardware specification.
  triggers:
  - alias: Trigger when 2.5GbE ports drop below optimal speed
    trigger: numeric_state
    entity_id:
    - sensor.swcloset_port_1_link_speed
    - sensor.swcloset_port_2_link_speed
    - sensor.swcloset_port_3_link_speed
    - sensor.swcloset_port_5_link_speed
    - sensor.swentrada_ap_quartos_link_speed
    - sensor.swentrada_uplink_to_garagem_link_speed
    - sensor.swgaragem_ap_garagem_link_speed
    - sensor.swgaragem_servidor_link_speed
    - sensor.swgaragem_uplink_to_entrada_link_speed
    below: 2500
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: degraded_2500
  - alias: Trigger when 1GbE ports drop below optimal speed
    trigger: numeric_state
    entity_id:
    - sensor.swentrada_ap_sala_link_speed
    - sensor.swentrada_internet_link_speed
    below: 1000
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: degraded_1000
  conditions:
  - alias: Ensure valid numeric speed and protect against manual UI runs
    condition: template
    value_template: '{{ trigger is defined and trigger.to_state is defined and is_number(trigger.to_state.state)
      }}'
  actions:
  - alias: Log the degradation event for system traceability
    action: notify.send_message
    target:
      entity_id: notify.system_log
    data:
      message: 'Network Degradation: {{ trigger.to_state.name }} negotiated at {{
        trigger.to_state.state }} Mbps.'
  - alias: Create a persistent UI notification for the administrator
    action: persistent_notification.create
    data:
      title: ⚠️ Network Port Degraded
      message: "The port **{{ trigger.to_state.name }}** is operating below expected
        capacity.  Current Link Speed: **{{ trigger.to_state.state }} Mbps**. \nPlease
        inspect the Cat6 cabling, RJ45 terminations, or switch port configurations."
      notification_id: network_degrade_{{ trigger.entity_id }}
  mode: parallel
  max: 15
- id: '1789428376453'
  alias: Victron ESS - Increase Battery Output (Load-Following)
  description: Increases Victron battery discharge assistance by stepping the AC power
    setpoint down  by 25W (clamped at -300W floor) whenever main bus house load exceeds
    the active  setpoint by 100W continuously for 2 minutes.
  triggers:
  - alias: trigger_main_bus_load_exceeds_setpoint_plus_100w_for_2_minutes
    trigger: template
    value_template: "{{ has_value('sensor.total_house_load') and\n   has_value('sensor.garage_gx_device_critical_loads_on_l1')
      and\n   has_value('number.gx_device_ac_power_setpoint') and\n   ((states('sensor.total_house_load')
      | float(0) -\n     states('sensor.garage_gx_device_critical_loads_on_l1') |
      float(0)) >\n    (states('number.gx_device_ac_power_setpoint') | float(0) +
      100) and not (now().minute % 2 == 0 and now().second < 2)) }}"
    for:
      hours: 0
      minutes: 1
      seconds: 50
  conditions:
  - alias: condition_verify_ess_mode_is_optimised_without_batterylife
    condition: state
    entity_id: select.gx_device_ess_mode
    state:
    - optimized_no_battery_life
  - alias: condition_verify_total_load_critical_load_and_setpoint_telemetry_valid
    condition: template
    value_template: "{{ has_value('sensor.total_house_load') and\n   has_value('number.gx_device_ac_power_setpoint')
      and\n   has_value('sensor.garage_gx_device_critical_loads_on_l1') }}"
  - alias: condition_verify_dc_battery_state_discharging_or_idle
    condition: state
    entity_id: sensor.gx_device_dc_battery_state
    state:
    - discharging
    - idle
  - alias: condition_verify_discharge_setpoint_above_300w_injection_limit
    condition: template
    value_template: '{{ states(''number.gx_device_ac_power_setpoint'') | float(0)
      > -300 }}'
  actions:
  - alias: action_increase_battery_discharge_clamped_at_300w_injection_limit
    action: number.set_value
    target:
      entity_id: number.gx_device_ac_power_setpoint
    data:
      value: '{% set current_sp = states(''number.gx_device_ac_power_setpoint'') |
        float(0) %} {{ [current_sp - 25, -300] | max }}'
  - alias: action_dispatch_battery_output_increase_audit_log
    action: notify.send_message
    target:
      entity_id: notify.power_victron_log
    data:
      message: '[POWER_VICTRON_LOG] Action: Increase Battery Output | Main Bus Load:
        {{ (states(''sensor.total_house_load'') | float(0) - states(''sensor.garage_gx_device_critical_loads_on_l1'')
        | float(0)) | round(2) }} W | Target Threshold: {{ states(''number.gx_device_ac_power_setpoint'')
        | float(0) + 100 }} W | Previous Setpoint: {{ states(''number.gx_device_ac_power_setpoint'')
        }} W | New Setpoint: {{ [states(''number.gx_device_ac_power_setpoint'') |
        float(0) - 25, -300] | max }} W'
- id: '1789430313569'
  alias: Victron ESS - Decrease Battery Output (Load-Following)
  description: Decreases Victron battery discharge assistance by stepping the AC power
    setpoint up  by 25W (clamped at 0W baseline) whenever main bus house load drops
    50W below the active  battery output continuously for 30 seconds.
  triggers:
  - alias: trigger_main_bus_load_50w_below_output_for_30_seconds
    trigger: template
    value_template: "{{ has_value('sensor.total_house_load') and\n   has_value('sensor.garage_gx_device_critical_loads_on_l1')
      and\n   has_value('number.gx_device_ac_power_setpoint') and\n   (((states('sensor.total_house_load')
      | float(0) -\n      states('sensor.garage_gx_device_critical_loads_on_l1') |
      float(0)) +\n     states('number.gx_device_ac_power_setpoint') | float(0)) <
      -50 and not (now().second < 2)) }}"
    for:
      seconds: 30
  conditions:
  - alias: condition_verify_ess_mode_is_optimised_without_batterylife
    condition: state
    entity_id: select.gx_device_ess_mode
    state:
    - optimized_no_battery_life
  - alias: condition_verify_total_load_critical_load_and_setpoint_telemetry_valid
    condition: template
    value_template: "{{ has_value('sensor.total_house_load') and\n   has_value('number.gx_device_ac_power_setpoint')
      and\n   has_value('sensor.garage_gx_device_critical_loads_on_l1') }}"
  - alias: condition_verify_setpoint_below_zero_watt_baseline
    condition: template
    value_template: '{{ states(''number.gx_device_ac_power_setpoint'') | float(0)
      < 0 }}'
  actions:
  - alias: action_decrease_battery_discharge_clamped_at_zero_baseline
    action: number.set_value
    target:
      entity_id: number.gx_device_ac_power_setpoint
    data:
      value: '{% set current_sp = states(''number.gx_device_ac_power_setpoint'') |
        float(0) %} {{ [current_sp + 25, 0] | min }}'
  - alias: action_dispatch_battery_output_increase_audit_log
    action: notify.send_message
    target:
      entity_id: notify.power_victron_log
    data:
      message: '[POWER_VICTRON_LOG] Action: Decrease Battery Output | Main Bus Load:
        {{ (states(''sensor.total_house_load'') | float(0) - states(''sensor.garage_gx_device_critical_loads_on_l1'')
        | float(0)) | round(2) }} W | Current Setpoint: {{ states(''number.gx_device_ac_power_setpoint'')
        }} W | New Setpoint: {{ [states(''number.gx_device_ac_power_setpoint'') |
        float(0) + 25, 0] | min }} W'
- id: '1789748874256'
  alias: New automation
  description: Executes targets, intercepts excess charge, and limits battery drain
    when EVs are active.
  triggers:
  - trigger: time
    at: input_datetime.solax_night_charge_start
    id: start_night
  - trigger: time
    at: input_datetime.solax_night_charge_stop
    id: stop_night
  - trigger: time
    at: input_datetime.solax_day_charge_start
    id: start_day
  - trigger: time
    at: input_datetime.solax_day_charge_stop
    id: stop_day
  - trigger: template
    value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100) <=
      (states(''input_number.new_battery_target'') | float(0) + 1) }}'
    id: drain_night_reached
  - trigger: template
    value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100) <=
      (states(''input_number.new_day_battery_target'') | float(0) + 1) }}'
    id: drain_day_reached
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start_night
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100)
            <= states(''input_number.new_battery_target'') | float(0) }}'
        then:
        - alias: Enable Charge from Grid
          action: switch.turn_on
          target:
            entity_id: switch.garage_solax_inverter_selfuse_night_charge
        - delay:
            seconds: 1
        - alias: Set Upper SOC to Real Target
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_nightcharge_upper_soc
          data:
            value: '{{ states(''input_number.new_battery_target'') | int(60) }}'
        - alias: Log Path A Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Night: Charging needed. Grid enabled, Upper SOC set
              to {{ states(''input_number.new_battery_target'') }}%.'
        else:
        - alias: Collapse Night Window (Start = End)
          action: time.set_value
          target:
            entity_id: time.solax_inverter_charger_start_time_1
          data:
            time: '{{ state_attr(''input_datetime.solax_night_charge_stop'', ''timestamp'')
              | timestamp_custom(''%H:%M:%S'', true) }}'
        - delay:
            seconds: 2
        - alias: Set Discharge Floor to Target SOC
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_discharge_min_soc
          data:
            value: '{{ states(''input_number.new_battery_target'') | int(60) }}'
        - alias: Log Path B Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Night: Excess energy ({{ states(''sensor.solax_battery_capacity'')
              }}%). Window collapsed, draining to {{ states(''input_number.new_battery_target'')
              }}%.'
    - conditions:
      - condition: trigger
        id: start_day
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100)
            <= states(''input_number.new_day_battery_target'') | float(0) }}'
        then:
        - alias: Set Upper SOC to Real Day Target
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_nightcharge_upper_soc
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | int(60) }}'
        - alias: Log Path A Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day: Charging needed. Upper SOC set to {{ states(''input_number.new_day_battery_target'')
              }}%.'
        else:
        - alias: Disable Day Period
          action: switch.turn_off
          target:
            entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        - delay:
            seconds: 2
        - alias: Set Discharge Floor to Day Target SOC
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_discharge_min_soc
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | int(60) }}'
        - alias: Log Path B Action
          action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day: Excess energy ({{ states(''sensor.solax_battery_capacity'')
              }}%). Period 2 disabled, draining to {{ states(''input_number.new_day_battery_target'')
              }}%.'
    - conditions:
      - condition: trigger
        id: drain_night_reached
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_night_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_night_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      - condition: template
        value_template: '{{ states(''time.solax_inverter_charger_start_time_1'') ==
          states(''time.solax_inverter_charger_end_time_1'') }}'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Floor
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - delay:
          seconds: 2
      - alias: Set Target SOC to lock battery
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_nightcharge_upper_soc
        data:
          value: '{{ states(''input_number.new_battery_target'') | int(60) }}'
      - delay:
          seconds: 2
      - alias: 'Rebuild Window: Set Start Time to Now'
        action: time.set_value
        target:
          entity_id: time.solax_inverter_charger_start_time_1
        data:
          time: '{{ now().strftime(''%H:%M:%S'') }}'
      - alias: Log Night Drain Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept: Night drain hit {{ states(''sensor.solax_battery_capacity'')
            }}%. Rebuilt charging window to safely lock battery.'
    - conditions:
      - condition: trigger
        id: drain_day_reached
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_day_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_day_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      - condition: state
        entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        state: 'off'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Floor
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - delay:
          seconds: 2
      - alias: Set Day Target SOC to lock battery
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_nightcharge_upper_soc
        data:
          value: '{{ states(''input_number.new_day_battery_target'') | int(60) }}'
      - delay:
          seconds: 2
      - alias: Set Start Time to Actual Time
        action: time.set_value
        target:
          entity_id: time.solax_inverter_charger_start_time_2
        data:
          time: '{{ now().strftime(''%H:%M:%S'') }}'
      - delay:
          seconds: 1
      - alias: Re-Enable Day Period
        action: switch.turn_on
        target:
          entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
      - alias: Log Day Drain Action
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept: Day drain hit {{ states(''sensor.solax_battery_capacity'')
            }}%. Re-enabled Period 2 to safely lock battery.'
    - conditions:
      - condition: trigger
        id: stop_night
      - condition: template
        alias: Check if either EV is actively charging (> 50W)
        value_template: '{{ states(''sensor.box_ve1_power'') | float(0) > 50 or states(''sensor.box_ve2_power'')
          | float(0) > 50 }}'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Throttle Battery Discharge (Limit to 3 via Amps)
        action: number.set_value
        target:
          entity_id: number.solax_battery_discharge_max_current
        data:
          value: 3
      - alias: Log EV Throttle Active
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 5: Night window closed but EVs are charging. Battery discharge
            throttled to 3A to protect house reserves.'
      - alias: Set Discharge Floor to Target SOC
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - alias: Night revert SOC
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night: reverting minimum SOC to 11'
      - alias: Wait for EVs to finish or time window to close
        wait_for_trigger:
        - alias: Both EVs drop below 50W
          value_template: '{{ states(''sensor.box_ve1_power'') | float(0) < 50 and
            states(''sensor.box_ve2_power'') | float(0) < 50 }}'
          trigger: template
        - alias: The EV schedule time block ends
          value_template: '{% set stop1 = state_attr(''input_datetime.automation_ev_charge_stop'',
            ''timestamp'') | float(0) %} {% set stop2 = state_attr(''input_datetime.automation_ev2_charge_stop'',
            ''timestamp'') | float(0) %} {{ now().timestamp() >= [stop1, stop2] |
            max }}'
          trigger: template
      - alias: Unlock Inverter Settings (Post-Wait)
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Battery Discharge to Normal (25A)
        action: number.set_value
        target:
          entity_id: number.solax_battery_discharge_max_current
        data:
          value: 25
      - alias: Log EV Throttle Released
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 5: EVs finished charging or schedule ended. Battery discharge
            restored to full capacity (25A).'
    - conditions:
      - condition: trigger
        id:
        - stop_day
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Unlock Inverter Settings (Post-Wait)
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Set Discharge Floor to Target SOC
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - alias: Day revert SOC
        action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Day: reverting minimum SOC to 11'
  mode: parallel
  max: 10
- id: '1790765104916'
  alias: Change Energy Tarifs Trihorario
  description: Automatically updates Utility Meter tariffs for Tri-horário (Vazio,
    Cheias, Ponta)
  triggers:
  - trigger: time
    at:
    - 08:00:00
    - 09:00:00
    - '10:30:00'
    - '13:00:00'
    - '18:00:00'
    - '19:30:00'
    - '20:30:00'
    - '21:00:00'
    - '22:00:00'
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      is_summer: '{{ now().dst() is not none and now().dst().total_seconds() > 0 }}'
      hour: '{{ now().hour + (now().minute / 60.0) }}'
      tariff: "{% if is_summer %}\n  {% if (hour >= 10.5 and hour < 13.0) or (hour
        >= 19.5 and hour < 21.0) %}\n    ponta\n  {% elif (hour >= 8.0 and hour <
        10.5) or (hour >= 13.0 and hour < 19.5) or (hour >= 21.0 and hour < 22.0)
        %}\n    cheias\n  {% else %}\n    vazio\n  {% endif %}\n{% else %}\n  {% if
        (hour >= 9.0 and hour < 10.5) or (hour >= 18.0 and hour < 20.5) %}\n    ponta\n
        \ {% elif (hour >= 8.0 and hour < 9.0) or (hour >= 10.5 and hour < 18.0) or
        (hour >= 20.5 and hour < 22.0) %}\n    cheias\n  {% else %}\n    vazio\n  {%
        endif %}\n{% endif %}"
  - action: select.select_option
    target:
      entity_id:
      - select.daily_energy
      - select.monthly_energy
      - select.bmw_ce_monthly_energy
      - select.water_heater_energy_daily
      - select.water_heater_energy_weekly
      - select.water_heater_energy_monthly
    data:
      option: '{{ tariff }}'
  - action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: Energy tariffs changed to {{ tariff }} (Tri-horário).
  mode: single
- id: '1790778272163'
  alias: 'Power Management: Pre-Peak Battery Guard'
  description: Ensures SolaX & Victron batteries have sufficient energy to sustain
    a 700W house load during Tri-horário Ponta (Peak) windows.
  triggers:
  - trigger: time
    at: '10:00:00'
    id: summer_morning_check
  - trigger: time
    at: '19:00:00'
    id: summer_evening_check
  - trigger: time
    at: 08:30:00
    id: winter_morning_check
  - trigger: time
    at: '17:30:00'
    id: winter_evening_check
  conditions:
  - condition: template
    value_template: "{% set is_dst = now().dst() is not none and now().dst().total_seconds()
      > 0 %} {{ (is_dst and trigger.id in ['summer_morning_check', 'summer_evening_check'])
      or\n   (not is_dst and trigger.id in ['winter_morning_check', 'winter_evening_check'])
      }}"
  actions:
  - variables:
      is_dst: '{{ now().dst() is not none and now().dst().total_seconds() > 0 }}'
      is_morning: '{{ trigger.id in [''summer_morning_check'', ''winter_morning_check'']
        }}'
      peak_duration: "{% if is_dst %}\n  {{ 2.5 if is_morning else 1.5 }}\n{% else
        %}\n  {{ 1.5 if is_morning else 2.5 }}\n{% endif %}"
      peak_start_time: "{% if is_dst %}\n  {{ today_at('10:30:00') if is_morning else
        today_at('19:30:00') }}\n{% else %}\n  {{ today_at('09:00:00') if is_morning
        else today_at('18:00:00') }}\n{% endif %}"
      required_kwh: '{{ (700 * (peak_duration | float) / 1000.0) + 0.7 | round(2)
        }}'
      min_soc_floor: '{{ 11 if is_morning else 25 }}'
      pct_per_kwh: 5.56
      required_soc: '{{ (min_soc_floor + (required_kwh | float * pct_per_kwh)) | round(0)
        | int }}'
      current_soc: '{{ states(''sensor.total_house_soc'') | float(0) }}'
  - if:
    - condition: template
      value_template: '{{ current_soc < required_soc }}'
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_day_charge_start
      data:
        timestamp: '{{ (now() + timedelta(minutes=1)).timestamp() | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_day_charge_stop
      data:
        timestamp: '{{ (now() + timedelta(minutes=29)).timestamp() | int }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.new_day_battery_target
      data:
        value: '{{ required_soc }}'
    - action: notify.send_message
      target:
        entity_id: notify.energy_log
      data:
        message: 'Pre-Peak Guard: Battery SOC is {{ current_soc }}% (Required: {{
          required_soc }}% for {{ required_kwh }} kWh over {{ peak_duration }}h peak).
          Intercepting helpers to force top-off.'
  mode: single
- id: '1793215378991'
  alias: 'Phase 4 & 5: Battery Execution & EV Throttle via Modbus'
  description: Executes targets, intercepts excess charge, and limits battery drain
    when EVs are active.
  triggers:
  - trigger: time
    at: input_datetime.solax_night_charge_start
