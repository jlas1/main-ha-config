- id: '1709761672379'
  alias: BMW CE Automation
  description: ''
  triggers:
  - at: input_datetime.automation_ev_charge_start
    id: EV start charging
    trigger: time
  - at: input_datetime.automation_ev_charge_stop
    id: EV stop charging
    trigger: time
  - at: input_datetime.automation_cheap_ev_charge_start
    id: Cheap EV start charging
    trigger: time
  - at: input_datetime.automation_cheap_ev_charge_stop
    id: Cheap EV stop charging
    trigger: time
  conditions: []
  actions:
  - alias: Check if it's a long charging night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - EV start charging
        - EV stop charging
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 0 and
            states(''input_boolean.home_office_monday'') == ''off'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 1 and
            states(''input_boolean.home_office_tuesday'') == ''off'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 2 and
            states(''input_boolean.home_office_wednesday'') == ''off'' else false
            }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 3 and
            states(''input_boolean.home_office_thursday'') == ''off'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 4 and
            states(''input_boolean.home_office_friday'') == ''off'' else false }}'
    then:
    - if:
      - condition: trigger
        id:
        - EV start charging
      then:
      - if:
        - condition: numeric_state
          entity_id: input_number.ev1_suggested_current
          above: 6
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.ev1_suggested_current
          data:
            value: 6
      - target:
          entity_id:
          - input_boolean.automatic_ve_switch
        action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: Started BMW CE Long Charging.
      else:
      - if:
        - condition: trigger
          id:
          - EV stop charging
        then:
        - target:
            entity_id:
            - input_boolean.automatic_ve_switch
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.ev_fleet_log
          data:
            message: Stopped BMW CE Long Charging.
  - alias: Check if it's a short charging night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Cheap EV start charging
        - Cheap EV stop charging
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 0 and
            states(''input_boolean.home_office_monday'') == ''on'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 1 and
            states(''input_boolean.home_office_tuesday'') == ''on'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 2 and
            states(''input_boolean.home_office_wednesday'') == ''on'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 3 and
            states(''input_boolean.home_office_thursday'') == ''on'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 4 and
            states(''input_boolean.home_office_friday'') == ''on'' else false }}'
        - condition: template
          value_template: '{{ true if (now()+timedelta(hours=12)).weekday() == 5 or
            (now()+timedelta(hours=12)).weekday() == 6 else false }}'
    then:
    - if:
      - condition: trigger
        id:
        - Cheap EV start charging
      then:
      - if:
        - condition: numeric_state
          entity_id: input_number.ev1_suggested_current
          above: 6
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.ev1_suggested_current
          data:
            value: 6
      - target:
          entity_id: input_boolean.automatic_ve_switch
        action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: Started BMW CE Short Charging.
      else:
      - if:
        - condition: trigger
          id:
          - Cheap EV stop charging
        then:
        - target:
            entity_id: input_boolean.automatic_ve_switch
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.ev_fleet_log
          data:
            message: Stopped BMW CE Short Charging.
  mode: queued
  max: 10
- id: '1710625524216'
  alias: Water Heater Automatic Mode
  description: ''
  triggers:
  - entity_id:
    - input_boolean.manual_override_aqs_switch
    - input_boolean.automatic_aqs_switch
    - input_boolean.grid_injection_avoidance_aqs_switch
    - switch.sonoff_1001dabf03
    id: AQS Switch changed state
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.manual_override_aqs_switch
        state: 'on'
      - condition: state
        entity_id: input_boolean.automatic_aqs_switch
        state: 'on'
      - condition: state
        entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        state: 'on'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.sonoff_1001dabf03
    - action: notify.send_message
      target:
        entity_id: notify.climate_aqs_log
      data:
        message: Water heater switch turned ON.
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.sonoff_1001dabf03
    - action: notify.send_message
      target:
        entity_id: notify.climate_aqs_log
      data:
        message: Water heater switch turned OFF.
  - if:
    - condition: numeric_state
      entity_id: sensor.sonoff_1001dabf03_temperature
      above: 65
    then:
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ now().timestamp() }}'
      target:
        entity_id: input_datetime.last_high_water_temp
  mode: queued
  max: 10
- id: '1710687693819'
  alias: SOLAX Grid Injection control
  description: ''
  triggers:
  - alias: Turn ON Level 4 (Living Room AC & AQS)
    id: Trigger Level Four
    trigger: template
    value_template: '{% set soc = states(''sensor.total_house_soc'')|float(0) %} {%
      set base = states(''sensor.solar_dump_base_target'')|float(0) %} {% set mult
      = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} {{ soc >= base + (3 * mult) and
      soc > 90 }}'
    for:
      seconds: 15
  - alias: Turn ON Level 3 (Rooms AC)
    id: Trigger Level Three
    trigger: template
    value_template: '{% set soc = states(''sensor.total_house_soc'')|float(0) %}

      {% set base = states(''sensor.solar_dump_base_target'')|float(0) %}

      {% set mult = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %}

      {{ soc >= base + (2 * mult) and soc > 90 }}'
    for:
      seconds: 15
  - alias: Turn ON Level 2 (EV + AQS)
    id: Trigger Level Two
    trigger: template
    value_template: "{% set soc = states('sensor.total_house_soc')|float(0) %} \n{%
      set base = states('sensor.solar_dump_base_target')|float(0) %} \n{% set mult
      = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %}\n{{ soc >= base + (1 * mult) }}"
    for:
      seconds: 15
  - alias: Turn ON Level 1 (EV or AQS)
    id: Trigger Level One
    trigger: template
    value_template: "{% set soc = states('sensor.total_house_soc')|float(0) %}\n{%
      set base = states('sensor.solar_dump_base_target')|float(0) %} \n{{ soc >= base
      }}"
    for:
      seconds: 15
  - alias: Turn OFF Level 3 & 4 (Living Room & Rooms AC)
    id: Disable Level Three and Four
    trigger: template
    value_template: "{% set soc = states('sensor.total_house_soc')|float(0) %} \n{%
      set base = states('sensor.solar_dump_base_target')|float(0) %} \n{% set mult
      = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %}\n{{ soc < base + (1 * mult) or
      soc <= 90 }}"
    for:
      seconds: 15
  - alias: Turn OFF Level 2 (Downgrade to Level 1)
    id: Disable Level Two
    trigger: template
    value_template: "{% set soc = states('sensor.total_house_soc')|float(0) %} \n{%
      set base = states('sensor.solar_dump_base_target')|float(0) %} \n{{ soc < base
      }}"
    for:
      seconds: 15
  - alias: Turn OFF Level 1 (Stop all dumping)
    id: Disable Level One
    trigger: template
    value_template: "{% set soc = states('sensor.total_house_soc')|float(0) %} \n{%
      set base = states('sensor.solar_dump_base_target')|float(0) %} \n{% set mult
      = ([1.0, 10.5 - (0.1 * soc), 3.0]|sort)[1] %} \n{{ soc < base - (1 * mult) }}"
    for:
      seconds: 15
  - alias: AQS Water Temperature Reached Target
    id: Water Temperature reached target
    trigger: numeric_state
    entity_id:
    - sensor.sonoff_1001dabf03_temperature
    above: input_number.water_heater_dinner_target
    value_template: '{{ float(state.state) - 10 }}'
    for:
      seconds: 15
  conditions:
  - condition: or
    conditions:
    - condition: sun
      before: sunset
      after: sunrise
    - condition: template
      value_template: '{{ trigger.id in [''Disable Level Three and Four'', ''Disable
        Level Two'', ''Disable Level One''] }}'
  - condition: template
    value_template: "{% set avg_solar = states('sensor.solar_power_5min_average')
      | float(0) %} \n{% set soc = states('sensor.total_house_soc') | float(0) %}\n{%
      set feedin = states('sensor.solax_grid_export') | float(0) %} \n{% set is_turn_on_trigger
      = trigger.id in ['Trigger Level One', 'Trigger Level Two', 'Trigger Level Three',
      'Trigger Level Four', 'Water Temperature reached target'] %}\n{% if is_turn_on_trigger
      %}\n  {% if feedin > 50 %}\n    true {# Always allow diverting if we are actively
      injecting to the grid #}\n  {% else %}\n    true\n  {% endif %}\n{% else %}\n
      \ true\n{% endif %}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Trigger Level One
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.sonoff_1001dabf03_temperature
          above: input_number.water_heater_dinner_target
          value_template: '{{ float (state.state) - 10 }}'
        then:
        - target:
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_off
        - target:
            entity_id: input_boolean.grid_injection_avoidance_ve_s
          action: input_boolean.turn_on
        - alias: Trigger Dual-EV Solar Splitter Fallback
          action: automation.trigger
          target:
            entity_id: automation.power_management_dual_ev_solar_splitter_fallback
          data:
            skip_condition: true
        else:
        - target:
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level One Solar Dump.
    - conditions:
      - condition: trigger
        id: Trigger Level Two
      sequence:
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.grid_injection_avoidance_ve_s
        action: input_boolean.turn_on
      - alias: Trigger Dual-EV Solar Splitter Fallback
        action: automation.trigger
        target:
          entity_id: automation.power_management_dual_ev_solar_splitter_fallback
        data:
          skip_condition: true
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level Two Solar Dump.
    - conditions:
      - condition: trigger
        id: Trigger Level Three
      sequence:
      - target:
          entity_id: input_boolean.automation_start_rooms_ac
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level Three Solar Dump.
    - conditions:
      - condition: trigger
        id: Trigger Level Four
      sequence:
      - target:
          entity_id:
          - input_boolean.automation_start_livingroom_ac
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_on
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Triggered Level Four Solar Dump.
    - conditions:
      - condition: trigger
        id: Disable Level Three and Four
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: input_boolean.automation_start_livingroom_ac
            state: 'on'
          - condition: state
            entity_id: input_boolean.automation_start_rooms_ac
            state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.automation_start_livingroom_ac
            - input_boolean.automation_start_rooms_ac
          action: input_boolean.turn_off
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: Disabled Level Three and Four Solar Dump.
    - conditions:
      - condition: trigger
        id: Disable Level Two
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.sonoff_1001dabf03_temperature
          above: input_number.water_heater_dinner_target
          value_template: '{{ float (state.state) - 2 }}'
        then:
        - target:
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_off
        else:
        - target:
            entity_id:
            - input_boolean.grid_injection_avoidance_ve2_switch
            - input_boolean.grid_injection_avoidance_ve_s
            - input_boolean.grid_injection_avoidance_ve_switch
          action: input_boolean.turn_off
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Disabled Level Two Solar Dump.
    - conditions:
      - condition: trigger
        id: Disable Level One
      sequence:
      - target:
          entity_id: input_boolean.grid_injection_avoidance_aqs_switch
        action: input_boolean.turn_off
      - target:
          entity_id:
          - input_boolean.grid_injection_avoidance_ve2_switch
          - input_boolean.grid_injection_avoidance_ve_s
          - input_boolean.grid_injection_avoidance_ve_switch
        action: input_boolean.turn_off
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: Disabled Level One Solar Dump.
    - conditions:
      - condition: trigger
        id: Water Temperature reached target
      sequence:
      - if:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.grid_injection_avoidance_ve_s
            state: 'off'
          - condition: state
            entity_id: input_boolean.grid_injection_avoidance_aqs_switch
            state: 'on'
        then:
        - target:
            entity_id:
            - input_boolean.grid_injection_avoidance_aqs_switch
          action: input_boolean.turn_off
        - target:
            entity_id: input_boolean.grid_injection_avoidance_ve_s
          action: input_boolean.turn_on
        - alias: Trigger Dual-EV Solar Splitter Fallback
          action: automation.trigger
          target:
            entity_id: automation.power_management_dual_ev_solar_splitter_fallback
          data:
            skip_condition: true
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: AQS Water reached target during dump. Diverting to EV.
  mode: queued
  max: 3
- id: '1711213074704'
  alias: Auto Backup
  description: ''
  triggers:
  - at: '23:00:00'
    trigger: time
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ true if now().weekday() == 0 else false }}'
    then:
    - data:
        compressed: true
        keep_days: 31
        location: Backup
      action: auto_backup.backup_full
    - action: notify.send_message
      target:
        entity_id: notify.system_log
      data:
        message: Monthly auto backup performed.
    else:
    - data:
        compressed: true
        keep_days: 7
        location: Backup
      action: auto_backup.backup_full
    - action: notify.send_message
      target:
        entity_id: notify.system_log
      data:
        message: Weekly auto backup performed.
  mode: single
- id: '1711276188208'
  alias: keep Energy sensors working
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - switch.tomada_arca_frigorifrica
    - switch.tomada_maquina_lavar_loica
    - switch.tomada_maquina_lavar_roupa
    - switch.tomada_aqs
    - switch.tomada_dryer
    to: 'off'
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: '*'
    minutes: '*'
    seconds: '45'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: switch.tomada_arca_frigorifrica
      state: 'off'
    - condition: state
      entity_id: switch.tomada_maquina_lavar_loica
      state: 'off'
    - condition: state
      entity_id: switch.tomada_maquina_lavar_roupa
      state: 'off'
    - condition: state
      entity_id: switch.tomada_aqs
      state: 'off'
    - condition: state
      entity_id: switch.tomada_dryer
      state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.tomada_arca_frigorifrica
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.tomada_arca_frigorifrica
    - conditions:
      - condition: state
        entity_id: switch.tomada_maquina_lavar_loica
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.tomada_maquina_lavar_loica
    - conditions:
      - condition: state
        entity_id: switch.tomada_maquina_lavar_roupa
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.tomada_maquina_lavar_roupa
    - conditions:
      - condition: state
        entity_id: switch.tomada_aqs
        state: 'off'
      sequence:
      - delay:
          seconds: 5
      - action: switch.turn_on
        target:
          entity_id: switch.tomada_aqs
    - conditions:
      - condition: state
        entity_id: switch.tomada_dryer
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.tomada_dryer
  mode: queued
  max: 10
- id: '1712705407698'
  alias: Dehumifier Automatic Mode
  description: ''
  triggers:
  - at: '12:00:00'
    id: Start dehumifiers
    trigger: time
  - at: '18:00:00'
    id: Stop dehumifiers
    trigger: time
  - trigger: numeric_state
    entity_id:
    - sensor.tomada_ds2_power
    below: 50
    for:
      minutes: 30
    id: Stop dehumidifier Lucas
