        target:
          entity_id:
          - switch.tomada_ds2
          - switch.desumificador_lara
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: Dehumidifiers started.
    - conditions:
      - condition: trigger
        id: Stop dehumifiers
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.tomada_ds2
          - switch.desumificador_lara
      - action: notify.send_message
        target:
          entity_id: notify.climate_aqs_log
        data:
          message: Dehumidifiers stopped.
    - conditions:
      - condition: trigger
