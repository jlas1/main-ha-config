- id: '1779648576510'
  alias: 'Phase 2: Inverter Window Update Scheduling'
  description: Pushes the calculated charging windows and defaults the upper SOC to
    15% while the inverter is awake.
  triggers:
  - trigger: state
    entity_id:
    - input_datetime.solax_night_charge_start
    - input_datetime.solax_night_charge_stop
    - input_datetime.solax_day_charge_start
    - input_datetime.solax_day_charge_stop
    id: phase1_complete
  - trigger: time
    at: '14:30:00'
    id: safety_fallback
  conditions:
  - condition: time
    after: 08:00:00
    before: '23:05:00'
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - alias: Unlock Inverter Settings
    action: select.select_option
    target:
      entity_id: select.solax_lock_state
    data:
      option: Unlocked - Advanced
  - delay:
      seconds: 2
  - alias: Default Night Charge Upper SOC to 15%
    action: number.set_value
    target:
      entity_id: number.solax_selfuse_nightcharge_upper_soc
    data:
      value: 15
    enabled: false
  - delay:
      seconds: 2
  - alias: 'Period 1: Reset Start to Midnight (Prevents Start > End Validation Error)'
    action: time.set_value
    target:
      entity_id: time.garage_solax_inverter_charge_start_1
    data:
      time: 00:00:00
  - delay:
      seconds: 2
  - alias: 'Period 1: Set Target End Time'
    action: time.set_value
    target:
      entity_id: time.garage_solax_inverter_charge_end_1
    data:
      time: '{{ state_attr(''input_datetime.solax_night_charge_stop'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 2
  - alias: 'Period 1: Set Target Start Time'
    action: time.set_value
    target:
      entity_id: time.garage_solax_inverter_charge_start_1
    data:
      time: '{{ state_attr(''input_datetime.solax_night_charge_start'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 2
  - alias: Enable Period 1
    action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.garage_solax_inverter_selfuse_night_charge
    data: {}
  - delay:
      seconds: 2
  - alias: 'Period 2: Reset Start to Midnight (Prevents Start > End Validation Error)'
    action: time.set_value
    target:
      entity_id: time.garage_solax_inverter_charge_start_2
    data:
      time: 00:00:00
  - delay:
      seconds: 2
  - alias: 'Period 2: Set Target End Time'
    action: time.set_value
    target:
      entity_id: time.garage_solax_inverter_charge_end_2
    data:
      time: '{{ state_attr(''input_datetime.solax_day_charge_stop'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 2
  - alias: 'Period 2: Set Target Start Time'
    action: time.set_value
    target:
      entity_id: time.garage_solax_inverter_charge_start_2
    data:
      time: '{{ state_attr(''input_datetime.solax_day_charge_start'', ''timestamp'')
        | timestamp_custom(''%H:%M:%S'', true) }}'
  - delay:
      seconds: 2
  - alias: Enable Period 2
    action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
  - action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Phase 2 Complete: Inverter hardware schedules successfully updated
        and Upper SOC defaulted to 15%.'
  mode: single
- id: '1779838729287'
  alias: 'Shades: Detect Manual Override'
  description: Locks out auto-shading for a specific blind if a user manually moves
    it.
  triggers:
  - trigger: state
    entity_id: cover.blinds_stairs
    id: lateral
  - trigger: state
    entity_id: cover.blinds_patio
    id: patio
  - trigger: state
    entity_id: cover.blinds_dinner
    id: dinner
  - trigger: state
    entity_id: cover.blinds_lara
    id: lara
  - trigger: state
    entity_id: cover.blinds_kitchen
    id: kitchen
  - trigger: state
    entity_id: cover.blinds_lucas
    id: lucas
  - trigger: state
    entity_id: cover.blinds_suite
    id: master_suite
  - trigger: state
    entity_id: cover.blinds_master_bathroom
    id: master_bathroom
  - trigger: state
    entity_id: cover.blinds_front_garden
    id: entrada
  conditions:
  - alias: Ignore unavailability state drops
    condition: template
    value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown'] and\n
      \  trigger.from_state.state not in ['unavailable', 'unknown'] }}\n   "
  - alias: Ensure an actual physical movement or state change occurred
    condition: template
    value_template: "{{ trigger.from_state.attributes.current_position != trigger.to_state.attributes.current_position
      }}\n   "
  - condition: or
    conditions:
    - alias: UI Interaction (User pressed a button on the dashboard)
      condition: template
      value_template: '{{ trigger.to_state.context.user_id is not none }}'
    - alias: Physical Remote Interaction
      condition: and
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.context.parent_id is none }}'
      - alias: Buffer window for local Zigbee reporting
        condition: template
        value_template: '{% set last_run = state_attr(''automation.climate_dynamic_solar_shading'',
          ''last_triggered'') %}  {{ last_run == none or (now() - last_run | as_datetime
          | as_local).total_seconds() > 40 }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: "{% if trigger.id == 'lateral' %}\n  input_boolean.lateral_shades_manual_override
        \n{% elif trigger.id == 'patio' %} \n  input_boolean.patio_shades_manual_override
        \n{% elif trigger.id == 'dinner' %} \n  input_boolean.dinner_shades_manual_override
        \n{% elif trigger.id == 'kitchen' %} \n  input_boolean.kitchen_shades_manual_override\n{%
        elif trigger.id == 'lara' %}\n  input_boolean.lara_shades_manual_override
        \n{% elif trigger.id == 'lucas' %} \n  input_boolean.lucas_shades_manual_override
        \n{% elif trigger.id == 'master_suite' %} \n  input_boolean.master_suite_shades_manual_override
        \n{% elif trigger.id == 'master_bathroom' %}\n  input_boolean.master_bathroom_shades_manual_override
        \n{% elif trigger.id == 'entrada' %} \n  input_boolean.entrada_cover_manual_override
        \n{% endif %}"
    data: {}
  - alias: Log the debug data to the file
    action: notify.send_message
    data:
      message: '{% set last_run = state_attr(''automation.climate_dynamic_solar_shading'',
        ''last_triggered'') %} {% set raw_diff = (now() - last_run | as_datetime |
        as_local).total_seconds() | round(1) if last_run else ''N/A'' %} {% set time_diff
        = raw_diff if raw_diff == ''N/A'' or raw_diff <= 300 else ''> 300'' %} {{
        now().strftime(''%Y-%m-%d %H:%M:%S'') }} - OVERRIDE DETECTED: {{ trigger.entity_id
        }} State Change: {{ trigger.from_state.state }} -> {{ trigger.to_state.state
        }} Position Change: {{ trigger.from_state.attributes.current_position | default(''N/A'')
        }} -> {{ trigger.to_state.attributes.current_position | default(''N/A'') }}
        Context User_ID: {{ trigger.to_state.context.user_id | default(''None'') }}
        Context Parent_ID: {{ trigger.to_state.context.parent_id | default(''None'')
        }} Seconds since Main Automation Ran: {{ time_diff }}'
    target:
      entity_id: notify.house_control_log
  mode: parallel
- id: '1779838929003'
  alias: 'Climate: Dynamic Solar Shading'
  description: Enforces shadow math, wind safety, and thermal ratchets across all
    zones.
  triggers:
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: state
    entity_id: input_boolean.shades_master_switch
    state: 'on'
  actions:
  - alias: Process NE Unobstructed Blinds (Lara & Lucas at 5°)
    repeat:
      for_each:
      - cover: cover.blinds_lara
        override: input_boolean.lara_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      - cover: cover.blinds_lucas
        override: input_boolean.lucas_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      sequence:
      - if:
        - alias: Check if Manual Override is inactive
          condition: template
          value_template: '{{ is_state(repeat.item.override, ''off'') }}'
        then:
        - variables:
            t: '{{ states(repeat.item.sensor) | int(100) }}'
            cur: '{{ state_attr(repeat.item.cover, ''current_position'') | int(100)
              }}'
            el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
            hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
            target: '{% if el < 5 %} 100 {% else %} {{ [t, cur] | min if hot else
              t }} {% endif %}'
        - if:
          - condition: or
            conditions:
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target - cur) | abs > 5 }}'
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target | abs) > 95 }}'
          then:
          - alias: Execute Native End-Stops or Mid-Point Sequence
            choose:
            - alias: 'Hard Limit: Fully Open'
              conditions:
              - condition: template
                value_template: '{{ target == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            - alias: 'Hard Limit: Fully Closed'
              conditions:
              - condition: template
                value_template: '{{ target == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            default:
            - alias: 'Tuya Workaround: Wake, Stop, and Move'
              action: cover.stop_cover
              target:
                entity_id: '{{ repeat.item.cover }}'
            - delay: 00:00:02
            - action: cover.set_cover_position
              target:
                entity_id: '{{ repeat.item.cover }}'
              data:
                position: '{{ target }}'
  - alias: Process NE Obstructed Blinds (Patio, Dinner, Kitchen at 18°)
    repeat:
      for_each:
      - cover: cover.blinds_patio
        override: input_boolean.patio_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      - cover: cover.blinds_dinner
        override: input_boolean.dinner_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      - cover: cover.blinds_kitchen
        override: input_boolean.kitchen_shades_manual_override
        sensor: sensor.optimal_shade_position_patio
      sequence:
      - if:
        - alias: Check if Manual Override is inactive
          condition: template
          value_template: '{{ is_state(repeat.item.override, ''off'') }}'
        then:
        - variables:
            t: '{{ states(repeat.item.sensor) | int(100) }}'
            cur: '{{ state_attr(repeat.item.cover, ''current_position'') | int(100)
              }}'
            el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
            hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
            raw_target: '{% if el < 18 %} 100 {% else %} {{ [t, cur] | min if hot
              else t }} {% endif %}'
            target: "{% if repeat.item.cover == 'cover.blinds_patio' %}\n  {{ [raw_target
              | int, 50] | max }}\n{% else %}\n  {{ raw_target | int }}\n{% endif
              %}"
        - if:
          - condition: or
            conditions:
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target - cur) | abs > 5 }}'
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target | abs) > 95 }}'
          then:
          - alias: Execute Native End-Stops or Mid-Point Sequence
            choose:
            - alias: 'Hard Limit: Fully Open'
              conditions:
              - condition: template
                value_template: '{{ target == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            - alias: 'Hard Limit: Fully Closed'
              conditions:
              - condition: template
                value_template: '{{ target == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            default:
            - alias: 'Tuya Workaround: Wake, Stop, and Move'
              action: cover.stop_cover
              target:
                entity_id: '{{ repeat.item.cover }}'
            - delay: 00:00:02
            - action: cover.set_cover_position
              target:
                entity_id: '{{ repeat.item.cover }}'
              data:
                position: '{{ target }}'
  - alias: Process SW/NW Standard Blinds (Suite, Bathroom, Stairs at 9°)
    repeat:
      for_each:
      - cover: cover.blinds_suite
        override: input_boolean.master_suite_shades_manual_override
        sensor: sensor.optimal_shade_position_master_suite
      - cover: cover.blinds_master_bathroom
        override: input_boolean.master_bathroom_shades_manual_override
        sensor: sensor.optimal_shade_position_master_bathroom
      - cover: cover.blinds_stairs
        override: input_boolean.lateral_shades_manual_override
        sensor: sensor.optimal_shade_position_lateral
      sequence:
      - if:
        - alias: Check if Manual Override is inactive
          condition: template
          value_template: '{{ is_state(repeat.item.override, ''off'') }}'
        then:
        - variables:
            t: '{{ states(repeat.item.sensor) | int(100) }}'
            cur: '{{ state_attr(repeat.item.cover, ''current_position'') | int(100)
              }}'
            el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
            hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
            target: '{% if el < 9 %} 100 {% else %} {{ [t, cur] | min if hot else
              t }} {% endif %}'
        - if:
          - condition: or
            conditions:
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target - cur) | abs > 5 }}'
            - alias: Check if target position drifted more than 5%
              condition: template
              value_template: '{{ (target | abs) > 95 }}'
          then:
          - alias: Execute Native End-Stops or Mid-Point Sequence
            choose:
            - alias: 'Hard Limit: Fully Open'
              conditions:
              - condition: template
                value_template: '{{ target == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            - alias: 'Hard Limit: Fully Closed'
              conditions:
              - condition: template
                value_template: '{{ target == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item.cover }}'
            default:
            - alias: 'Tuya Workaround: Wake, Stop, and Move'
              action: cover.stop_cover
              target:
                entity_id: '{{ repeat.item.cover }}'
            - delay: 00:00:02
            - action: cover.set_cover_position
              target:
                entity_id: '{{ repeat.item.cover }}'
              data:
                position: '{{ target }}'
  - alias: Process Front Garden Awning (Safety Gates & Reverse Ratchet)
    if:
    - condition: state
      entity_id: input_boolean.entrada_cover_manual_override
      state: 'off'
    then:
    - variables:
        t: '{{ states(''sensor.optimal_shade_position_entrada_cover'') | int(0) }}'
        cur: '{{ state_attr(''cover.blinds_front_garden'', ''current_position'') |
          int(0) }}'
        el: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
        az: '{{ state_attr(''sun.sun'', ''azimuth'') | float(0) }}'
        wind: '{{ states(''sensor.weatherstation_wind_gust'') | float(0) }}'
        hot: '{{ is_state(''input_boolean.hot_day_heat_shield'', ''on'') }}'
        target: "{%- if el < 9 or az > 325 or wind > 40 -%}\n  0\n{%- elif wind >
          25 -%}\n  {%- set wind_capped = [t, 40] | min -%}\n  {{- [[t, cur] | max,
          40] | min if hot else wind_capped -}}\n{%- else -%}\n  {{- [t, cur] | max
          if hot else t -}}\n{%- endif -%}"
    - if:
      - condition: or
        conditions:
        - alias: Check if target position drifted more than 5%
          condition: template
          value_template: '{{ (target | int - cur) | abs > 5 }}'
        - alias: Force execution if target is an exact end-stop (0 or 100)
          condition: template
          value_template: '{{ (target | int) > 95 or (target | int) < 5 }}'
      then:
      - alias: Execute Native End-Stops or Mid-Point Sequence
        choose:
        - alias: 'Hard Limit: Fully Extended'
          conditions:
          - condition: template
            value_template: '{{ (target | int) == 100 }}'
          sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.blinds_front_garden
        - alias: 'Hard Limit: Fully Retracted'
          conditions:
          - condition: template
            value_template: '{{ (target | int) == 0 }}'
          sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.blinds_front_garden
        default:
        - alias: 'Tuya Workaround: Wake, Stop, and Move'
          action: cover.stop_cover
          target:
            entity_id: cover.blinds_front_garden
        - delay: 00:00:02
        - action: cover.set_cover_position
          target:
            entity_id: cover.blinds_front_garden
          data:
            position: '{{ target | int }}'
  mode: parallel
- id: '1779839800530'
  alias: 'Shades: Disable System at Sunset'
  description: Turns off the master switch and clears manual overrides for the next
    day.
  triggers:
  - trigger: sun
    event: sunset
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.shades_master_switch
      - input_boolean.lateral_shades_manual_override
      - input_boolean.patio_shades_manual_override
      - input_boolean.dinner_shades_manual_override
      - input_boolean.kitchen_shades_manual_override
      - input_boolean.lara_shades_manual_override
      - input_boolean.lucas_shades_manual_override
      - input_boolean.master_suite_shades_manual_override
      - input_boolean.master_bathroom_shades_manual_override
      - input_boolean.entrada_cover_manual_override
    data: {}
  - action: cover.close_cover
    metadata: {}
    target:
      entity_id: cover.blinds_front_garden
    data: {}
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.sonoff_10020744e0_1
    data: {}
  mode: single
- id: '1779839900378'
  alias: 'Shades: Manual Enable System'
  description: Turns on the Master Switch and forces an immediate position check.
  triggers: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.shades_master_switch
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.lateral_shades_manual_override
      - input_boolean.patio_shades_manual_override
      - input_boolean.dinner_shades_manual_override
      - input_boolean.kitchen_shades_manual_override
      - input_boolean.lara_shades_manual_override
      - input_boolean.lucas_shades_manual_override
      - input_boolean.master_suite_shades_manual_override
      - input_boolean.master_bathroom_shades_manual_override
      - input_boolean.entrada_cover_manual_override
  - action: automation.trigger
    target:
      entity_id: automation.climate_dynamic_solar_shading
  mode: single
- id: '1780052555532'
  alias: 'Shades: Auto-Toggle Hot Day Mode'
  description: Engages the one-way heat shield ratchet when it gets hot outside.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.weatherstation_outdoor_temperature
    above: 24
    id: hot
  - trigger: numeric_state
    entity_id: sensor.weatherstation_outdoor_temperature
    below: 21
    id: cool
  actions:
  - choose:
    - conditions: '{{ trigger.id == ''hot'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hot_day_heat_shield
    - conditions: '{{ trigger.id == ''cool'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hot_day_heat_shield
  mode: single
- id: '1781217166369'
  alias: 'Shades: Tuya Control Switch to Front Garden Awning'
  description: Mirrors UP/DOWN/STOP from the Tuya switch sensor directly to the physical
    awning.
  triggers:
  - trigger: state
    entity_id: sensor.front_garden_blinds_control_moving
    to: UP
    id: up
  - trigger: state
    entity_id: sensor.front_garden_blinds_control_moving
    to: DOWN
    id: down
  - trigger: state
    entity_id: sensor.front_garden_blinds_control_moving
    to: STOP
    id: stop
  actions:
  - choose:
    - alias: 'Command: UP'
      conditions:
      - condition: trigger
        id: up
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.blinds_front_garden
    - alias: 'Command: DOWN'
      conditions:
      - condition: trigger
        id: down
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.blinds_front_garden
    - alias: 'Command: STOP'
      conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: cover.stop_cover
        target:
          entity_id: cover.blinds_front_garden
  mode: restart
- id: '1781307008808'
  alias: 'Shades: Reset Tuya Switch when Awning Stops'
  description: Disengages the wall switch relay when the awning finishes moving so
    the next physical button press acts as a fresh command.
  triggers:
  - alias: The awning was opening or closing, but has now stopped
    trigger: state
    entity_id: cover.blinds_front_garden
    from:
    - opening
    - closing
  conditions:
  - alias: Only reset if the Tuya module still thinks it is moving
    condition: template
    value_template: '{{ states(''sensor.front_garden_blinds_control_moving'') in [''UP'',
      ''DOWN''] }}'
  actions:
  - alias: Send Stop command back to the Tuya module to disengage its relay
    action: cover.stop_cover
    target:
      entity_id: cover.front_garden_blinds_control
  mode: single
- id: '1776806970396'
  alias: 'Phase 3: Optimal Energy Target SOC and Schedule Manager'
  description: Dynamically computes night and day target SOC constraints by handling
    isolated time contexts. Integrates a multi-tier architectural fallback for OMIE
    database stagnation and Solcast API blackouts.
  triggers:
  - trigger: time
    at: '22:05:00'
    id: evening_calc
  - trigger: template
    value_template: '{{ now().strftime(''%H:%M'') == ((state_attr(''input_datetime.solax_night_charge_start'',
      ''timestamp'') | int(0) - 300) | timestamp_custom(''%H:%M'', true)) }}'
    id: pre_night_start_calc
  - trigger: template
    value_template: '{{ now().strftime(''%H:%M'') == ((state_attr(''input_datetime.solax_day_charge_start'',
      ''timestamp'') | int(0) - 300) | timestamp_custom(''%H:%M'', true)) }}'
    id: pre_day_charge_calc
  conditions: []
  actions:
  - alias: Extract Market Rates and Determine Grid Strategy
    variables:
      night_tariff_str: '{{ states(''input_text.automation_low_cost_coopernico'')
        }}'
      night_price: '{{ night_tariff_str.split(''|'')[6] | default(999) | float(999)
        if night_tariff_str else 999 }}'
      afternoon_tariff_str: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'')
        }}'
      afternoon_price: '{{ afternoon_tariff_str.split(''|'')[1] | default(999) | float(999)
        if afternoon_tariff_str else 999 }}'
      afternoon_is_better: '{{ afternoon_price < (night_price * 0.9) }}'
      average_energy: 0.55
      min_soc: 11
      max_soc: 90
      pct_per_kw: 5.56
      usable_max_kw: 14.28
      inlet_temp: '{{ 16.5 - 4.5 * cos((3.14159 / 6) * (now().month - 2)) }}'
      tank_deficit_day: '{{ 150 * ([states(''input_number.water_heater_dinner_target'')
        | float(50) - states(''sensor.sonoff_1001dabf03_temperature'') | float(45),
        0] | max) * 0.001162 }}'
      shower_day: '{{ 100 * ([[states(''sensor.sonoff_1001dabf03_temperature'') |
        float(45), 45] | min - (16.5 - 4.5 * cos((3.14159 / 6) * (now().month - 2))),
        0] | max) * 0.001162 }}'
      b_offset: 1
      f_offset: '{{ (tank_deficit_day | float(0) + shower_day | float(0)) | round(2)
        }}'
      ns_t: '{{ states(''input_datetime.solax_night_charge_stop'')[-8:] }}'
      nc_t: '{{ states(''input_datetime.solax_night_charge_cheap_stop'')[-8:] }}'
      ds_t: '{{ states(''input_datetime.solax_day_charge_start'')[-8:] }}'
      dp_t: '{{ states(''input_datetime.solax_day_charge_stop'')[-8:] }}'
      aq_t: '{{ states(''input_datetime.late_afternoon_water_heating_start'')[-8:]
        }}'
  - alias: Inspect Helper Validity and Remediate Outdated Datetime States
    choose:
    - alias: Handle Stale Helper Datetime Contexts
      conditions:
      - condition: template
        value_template: '{{ state_attr(''input_datetime.solax_night_charge_stop'',
          ''timestamp'') | default(0) | float < now().timestamp() }}'
      sequence:
      - alias: Forcibly Assign Default Emergency Night Window Parameters
        action: input_datetime.set_datetime
        target:
          entity_id:
          - input_datetime.solax_night_charge_start
          - input_datetime.solax_night_charge_cheap_start
        data:
          time: 00:00:00
      - alias: Forcibly Assign Default Emergency Night Expiration Parameters
        action: input_datetime.set_datetime
        target:
          entity_id:
          - input_datetime.solax_night_charge_stop
          - input_datetime.solax_night_charge_cheap_stop
        data:
          time: 03:00:00
      - alias: Forcibly Assign Default Emergency Day Window Parameters
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.solax_day_charge_start
        data:
          time: '16:00:00'
      - alias: Forcibly Assign Default Emergency Day Expiration Parameters
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.solax_day_charge_stop
        data:
          time: '18:00:00'
      - alias: Raise Persistent System UI Alert for Stale Price Blacks
        action: persistent_notification.create
        data:
          notification_id: omie_stale_data_warning
          title: '⚠️ OMIE Database Alert: Outdated Data Detected'
          message: Market pricing database has stagnated. Defaulting schedule boundaries
            to emergency blocks (00:00-03:00 and 16:00-18:00) to maintain inverter
            readiness.
  - alias: Execute Time Context Routing
    choose:
    - alias: Process Night Charging Strategy
      conditions:
      - condition: template
        value_template: '{{ trigger.id in [''evening_calc'', ''pre_night_start_calc'']
          }}'
      sequence:
      - alias: Evaluate Solar Array and Compute Grid Constraints
        action: input_text.set_value
        target:
          entity_id: input_text.solar_calculations
        data:
          value: "{% set forecast_entity = 'sensor.solcast_pv_forecast_forecast_today'
            if now().hour < 8 else 'sensor.solcast_pv_forecast_forecast_tomorrow'
            %} {% set t_data = state_attr(forecast_entity, 'detailedHourly') or []
            %} {% set current_temp = states('sensor.sonoff_1001dabf03_temperature')
            %} {% if t_data | length == 0 %}\n  {% set current_month = now().month
            %}\n  {% if current_month in [11, 12, 1, 2] %}{% set fallback_soc = 90
            %}\n  {% elif current_month in [3, 4, 9, 10] %}{% set fallback_soc = 60
            %}\n  {% else %}{% set fallback_soc = 11 %}{% endif %}\n  CRITICAL_FALLBACK|{{
            fallback_soc }}|0|0|{{ afternoon_is_better }}|{{ f_offset }}|0|0|{{ states('sensor.sonoff_1001dabf03_temperature')
            }}\n{% else %}\n  {% set w_p50 = 0.8 %}\n  {% set w_p10 = 0.2 %}\n  {%
            set d = '2000-01-01' %}\n  {% set night_stop = [as_timestamp(d~' '~ns_t),
            as_timestamp(d~' '~nc_t)] | max %}\n  {% set afternoon_stop = as_timestamp(d~'
            '~dp_t) %}\n  {% set aqs_afternoon_ts = as_timestamp(d~' '~aq_t) %}\n
            \ {% set end_of_day = as_timestamp(d~' 23:59:59') %}\n  {% set ts_max_start,
            ts_min_start = (afternoon_stop, night_stop) if afternoon_is_better else
            (night_stop, afternoon_stop) %}\n  \n  {% set full = namespace(max=0,
            min=0, batt=0, aqs_rem=f_offset) %}\n    {% for r in t_data %}\n      {%
            set ts = as_timestamp(d ~ ' ' ~ (r.period_start | as_datetime).strftime('%H:%M:%S'),
            0) %}\n      {% if ts_max_start <= ts <= end_of_day %}\n        {% set
            pv = (r.pv_estimate | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate
            | float(0)) * w_p10) %}\n        {% set net_solar = pv - average_energy
            %}\n        \n        {# If solar exceeds base load and water heater needs
            heat, dump solar to AQS first #}\n        {% if net_solar > 0 and full.aqs_rem
            > 0 %}\n          {% set dumped = [net_solar, full.aqs_rem] | min %}\n
            \         {% set full.aqs_rem = full.aqs_rem - dumped %}\n          {%
            set to_batt = net_solar - dumped %}\n        {% elif net_solar > 0 %}\n
            \         {% set to_batt = net_solar %}\n        {% else %}\n          {%
            set to_batt = net_solar %}\n        {% endif %}\n        \n        {%
            set full.batt = full.batt + to_batt %}\n        {% set full.max = [full.max,
            full.batt] | max %}\n        {% set full.min = [full.min, full.batt] |
            min %}\n      {% endif %}\n    {% endfor %}\n  {% set TargetMaxKW = [[usable_max_kw
            - full.max, (0 - full.min) if full.min < 0 else 0] | max, usable_max_kw]
            | min %}\n  \n  {% set bare = namespace(max=0, min=0, batt=-b_offset)
            %}\n  {% for r in t_data %}\n    {% set ts = as_timestamp(d ~ ' ' ~ (r.period_start
            | as_datetime).strftime('%H:%M:%S')) %}\n    {% if ts_min_start <= ts
            <= end_of_day %}\n      {% if (ts_min_start < ts_max_start and ts <= ts_max_start)
            or ts_min_start > ts_max_start %}\n        {% set pv = (r.pv_estimate
            | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate | float(0))
            * w_p10) %}\n        {% set load = f_offset if (ts <= aqs_afternoon_ts
            < ts + 3600) else 0 %}\n        {% set bare.batt = bare.batt + pv - average_energy
            - load %}\n      {% endif %}\n      {% set bare.min = [bare.min, bare.batt]
            | min %}\n    {% endif %}\n  {% endfor %}\n  {% set TargetMinKW = [[(0
            - bare.min), 0] | max, usable_max_kw] | min %}\n  {% set target_night_kw
            = TargetMinKW if afternoon_is_better else TargetMaxKW %}\n  {% set batt_night
            = [[(target_night_kw * pct_per_kw + min_soc) | round(0), min_soc] | max,
            max_soc] | min %}\n  {{ batt_night | int }}|VALID_RUN|{{ full.max | round(3)
            }}|{{ full.min | round(3) }}|{{ afternoon_is_better }}|{{ f_offset }}|0|{{
            bare.min | round(3) }}|{{ current_temp | round(1) }}\n{% endif %}"
      - alias: Write Night Target Metric to Storage Vector
        choose:
        - alias: Process Standard Cloud Computation Output
          conditions:
          - condition: template
            value_template: '{{ not is_state(''input_text.solar_calculations'', ''CRITICAL_FALLBACK'')
              }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.new_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[0]
                | int }}'
        - alias: Process System Intercept Fallback State
          conditions:
          - condition: template
            value_template: '{{ states(''input_text.solar_calculations'').split(''|'')[0]
              == ''CRITICAL_FALLBACK'' }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id:
              - input_number.new_battery_target
              - input_number.new_day_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[1]
                | int }}'
          - action: persistent_notification.create
            data:
              notification_id: solcast_blackout_warning
              title: '⚠️ Solcast API Blackout: Emergency Fallback Enforced'
              message: Solcast solar forecast array returned empty elements. Enforcing
                local calendar backup model. Storage vectors configured to seasonal
                default value of {{ states('input_text.solar_calculations').split('|')[1]
                | int }}%.
    - alias: Process Daytime Top-Off Strategy
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''pre_day_charge_calc'' }}'
        enabled: true
      sequence:
      - alias: Evaluate Today Remaining Array and Compute Target Metrics
        action: input_text.set_value
        target:
          entity_id: input_text.solar_calculations
        data:
          value: "{% set today_data = state_attr('sensor.solcast_pv_forecast_forecast_today',
            'detailedHourly') or [] %} {% set current_temp = states('sensor.sonoff_1001dabf03_temperature')
            %} {% if today_data | length == 0 %}\n  {% set current_month = now().month
            %}\n  {% if current_month in [11, 12, 1, 2] %}{% set fallback_soc = 90
            %}\n  {% elif current_month in [3, 4, 9, 10] %}{% set fallback_soc = 60
            %}\n  {% else %}{% set fallback_soc = 11 %}{% endif %}\n  CRITICAL_FALLBACK|{{
            fallback_soc }}|0|0|{{ afternoon_is_better }}|{{ f_offset }}|0|0|{{ states('sensor.sonoff_1001dabf03_temperature')
            }}\n{% else %}\n  {% set actual_pv = states('sensor.solax_today_s_solar_energy')
            | float(0) %}\n  {% set expected_pv = states('sensor.solcast_pv_forecast_forecast_today')
            | float(0) %}\n  {% set rem_p50 = states('sensor.solcast_pv_forecast_forecast_remaining_today')
            | float(0) %}\n  {% set exp_so_far = expected_pv - rem_p50 %}\n  {% set
            w_p50 = [[(actual_pv / exp_so_far - 0.5) * 2.0, 0.8] | min, 0.0] | max
            if exp_so_far > 1.0 else 0.8 %}\n  {% set w_p10 = 1.0 - w_p50 %}\n  {%
            set d = '2000-01-01' %}\n  {% set afternoon_start = as_timestamp(d~' '~ds_t)
            %}\n  {% set afternoon_stop = as_timestamp(d~' '~dp_t) %}\n  {% set aqs_afternoon_ts
            = as_timestamp(d~' '~aq_t) %}\n  {% set end_of_day = as_timestamp(d~'
            23:59:59') %}\n  \n  {% set window = namespace(excess=0) %}\n  {% for
            r in today_data %}\n    {% set ts = as_timestamp(d ~ ' ' ~ (r.period_start
            | as_datetime).strftime('%H:%M:%S')) %}\n    {% if afternoon_start <=
            ts < afternoon_stop %}\n      {% set pv = (r.pv_estimate | float(0) *
            w_p50) + (r.pv_estimate10 | default(r.pv_estimate | float(0)) * w_p10)
            %}\n      {% set net = pv - average_energy %}\n      {% if net > 0 %}{%
            set window.excess = window.excess + net %}{% endif %}\n    {% endif %}\n
            \ {% endfor %}\n  \n  {% set night_stop = [as_timestamp(d~' '~ns_t), as_timestamp(d~'
            '~nc_t)] | max %}\n  {% set ts_max_start, ts_min_start = (afternoon_stop,
            night_stop) if afternoon_is_better else (night_stop, afternoon_stop) %}\n
            \ \n  {% set full = namespace(max=0, min=0, batt=0, aqs_rem=f_offset)
            %}\n    {% for r in today_data %}\n      {% set ts = as_timestamp(d ~
            ' ' ~ (r.period_start | as_datetime).strftime('%H:%M:%S'), 0) %}\n      {%
            if ts_max_start <= ts <= end_of_day %}\n        {% set pv = (r.pv_estimate
            | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate | float(0))
            * w_p10) %}\n        {% set net_solar = pv - average_energy %}\n        \n
            \       {# Absorb surplus solar into water heater deficit first before
            counting battery accumulation #}\n        {% if net_solar > 0 and full.aqs_rem
            > 0 %}\n          {% set dumped = [net_solar, full.aqs_rem] | min %}\n
            \         {% set full.aqs_rem = full.aqs_rem - dumped %}\n          {%
            set to_batt = net_solar - dumped %}\n        {% else %}\n          {%
            set to_batt = net_solar %}\n        {% endif %}\n        \n        {%
            set full.batt = full.batt + to_batt %}\n        {% set full.max = [full.max,
            full.batt] | max %}\n        {% set full.min = [full.min, full.batt] |
            min %}\n      {% endif %}\n    {% endfor %}\n  {% set TargetMaxKW = [[usable_max_kw
            - full.max, (0 - full.min) if full.min < 0 else 0] | max, usable_max_kw]
            | min %}\n  \n  {% set bare = namespace(max=0, min=0, batt=-b_offset)
            %}\n  {% for r in today_data %}\n    {% set ts = as_timestamp(d ~ ' '
            ~ (r.period_start | as_datetime).strftime('%H:%M:%S')) %}\n    {% if ts_min_start
            <= ts <= end_of_day %}\n      {% if (ts_min_start < ts_max_start and ts
            <= ts_max_start) or ts_min_start > ts_max_start %}\n        {% set pv
            = (r.pv_estimate | float(0) * w_p50) + (r.pv_estimate10 | default(r.pv_estimate
            | float(0)) * w_p10) %}\n        {% set load = f_offset if (ts <= aqs_afternoon_ts
            < ts + 3600) else 0 %}\n        {% set bare.batt = bare.batt + pv - average_energy
            - load %}\n      {% endif %}\n      {% set bare.min = [bare.min, bare.batt]
            | min %}\n    {% endif %}\n  {% endfor %}\n  {% set TargetMinKW = [[(0
            - bare.min), 0] | max, usable_max_kw] | min %}\n  \n  {% set target_afternoon_kw
            = [TargetMaxKW - window.excess, 0] | max if afternoon_is_better else [TargetMinKW
            - window.excess, 0] | max %}\n  {% set batt_afternoon = [[(target_afternoon_kw
            * pct_per_kw + min_soc) | round(0), min_soc] | max, max_soc] | min %}\n
            \ DayCalcOnly|{{ batt_afternoon | int }}|{{ full.max | round(3) }}|{{
            full.min | round(3) }}|{{ afternoon_is_better }}|{{ f_offset }}|{{ window.excess
            | round(3) }}|{{ bare.min | round(3) }}|{{ current_temp | round(1) }}\n{%
            endif %}"
      - alias: Write Day Target Metric to Storage Vector
        choose:
        - alias: Process Standard Mid-Day Cloud Output
          conditions:
          - condition: template
            value_template: '{{ not is_state(''input_text.solar_calculations'', ''CRITICAL_FALLBACK'')
              }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.new_day_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[1]
                | int }}'
        - alias: Process Mid-Day System Fallback Intercept
          conditions:
          - condition: template
            value_template: '{{ states(''input_text.solar_calculations'').split(''|'')[0]
              == ''CRITICAL_FALLBACK'' }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.new_day_battery_target
            data:
              value: '{{ states(''input_text.solar_calculations'').split(''|'')[1]
                | int }}'
          - action: persistent_notification.create
            data:
              notification_id: solcast_midday_blackout_warning
              title: '⚠️ Solcast API Mid-day Drop: Emergency Baseline Enforced'
              message: Solcast database dropped connection mid-day. Overwriting remaining
                afternoon top-off bounds to climatological fallback target of {{ states('input_text.solar_calculations').split('|')[1]
                | int }}%.
  - alias: Log Strategy Actions to System Energy Database File
    action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Strategy execution verified. Time Trigger ID: {{ trigger.id }}. Market
        conditions favor afternoon grid window: {{ afternoon_is_better }}. Solar calculation
        raw data payload: {{ states(''input_text.solar_calculations'') }}'
  mode: queued
  max: 5
- id: '1781824502362'
  alias: 'Phase 1: OMIE Charging time calculations v2'
  description: Calculates charging windows dynamically upon market data refresh or
    system boot.
  triggers:
  - trigger: state
    entity_id: sensor.edp_trihorario_price
    attribute: tomorrow_hours
    id: market_data_updated
  - trigger: homeassistant
    event: start
    id: ha_restart
  - trigger: time
    at: '14:00:00'
    id: fallback_trigger
  - trigger: time
    at: '22:00:00'
    id: update_next_day_afternoon
  conditions:
  - condition: time
    after: '11:45:00'
    before: '23:59:00'
  actions:
  - alias: Wait for Coopernico sensor to initialize after boot
    wait_template: '{{ states(''sensor.edp_trihorario_price'') not in [''unknown'',
      ''unavailable''] }}'
    timeout:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
    continue_on_timeout: true
  - condition: template
    value_template: '{% set today = state_attr(''sensor.edp_trihorario_price'', ''today_hours'')
      %} {{ today is not none and today.values() | select(''number'') | list | count
      > 32 }}'
  - alias: 'BLOCK A: Night & General EV Calculations (Skips at 22:00)'
    if:
    - condition: template
      value_template: '{{ trigger.id != ''update_next_day_afternoon'' }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.automation_low_cost_coopernico
      data:
        value: "{% set sensor = 'sensor.edp_trihorario_price' %} {% set today_dict
          = state_attr(sensor, 'today_hours') %} {% set tomorrow_dict = state_attr(sensor,
          'tomorrow_hours') %} {% if today_dict is not none and tomorrow_dict is not
          none %}\n  {% set today_prices = today_dict.items() | sort(attribute='0')
          | map(attribute='1') | list %}\n  {% set tomorrow_prices = tomorrow_dict.items()
          | sort(attribute='0') | map(attribute='1') | list %}\n\n  {% set window
          = today_prices[88:] + tomorrow_prices[:32] %}\n  {% set min_price = window
          | select('number') | map('float', 1000) | min %}\n\n  {% set ns = namespace(ts_2h='',
          ts_3h='', ts_5h='', ts_1h='', ts_start=999, ts_stop=0, found_start=false,
          ended=false, best_1h_idx=0) %}\n\n  {% for d in [5, 3, 2, 1] %}\n    {%
          set d_steps = d * 4 %}\n    {% set best = namespace(min_sum=999999, idx=0)
          %}\n\n    {# If d == 2 (Water heater), cap max start index so it finishes
          before 07:30 (index 28 = 05:30 to 07030) #}\n    {# 22:00 to 07:00 is 9.5h
          = 36 steps. 36 - 8 = 28 #}\n    {% set max_i = 28 if d == 2 else (window
          | count - d_steps) %}\n\n    {% for i in range(max_i, -1, -1) %}\n      {%
          set current_sum = window[i:i+d_steps] | select('number') | map('float',
          1000) | sum %}\n      {# Use '<' for d == 2 so ties keep the latest window,
          '<=' for others #}\n      {% if (d == 2 and current_sum < best.min_sum)
          or (d != 2 and current_sum <= best.min_sum) %}\n        {% set best.min_sum
          = current_sum %}\n        {% set best.idx = i %}\n      {% endif %}\n    {%
          endfor %}\n\n    {% set ts = (today_at(\"22:00\") + timedelta(minutes=best.idx
          * 15)).timestamp() | int | string %}\n\n    {% if d == 5 %}{% set ns.ts_5h
          = ts %}{% endif %}\n    {% if d == 3 %}{% set ns.ts_3h = ts %}{% endif %}\n
          \   {% if d == 2 %}{% set ns.ts_2h = ts %}{% endif %}\n    {% if d == 1
          %}\n      {% set ns.ts_1h = ts %}\n      {% set ns.best_1h_idx = best.idx
          %}\n    {% endif %}\n  {% endfor %}\n\n  {% set buffer = (min_price * 0.10)
          if min_price > 10 else 2.0 %}\n  {% set max_allowed = min_price + buffer
          %}\n\n  {% for i in range(window | count) %}\n    {% if not ns.ended %}\n
          \     {% if window[i] is number and window[i] | float(1000) <= max_allowed
          %}\n        {% if not ns.found_start %}\n          {% set ns.ts_start =
          i %}\n          {% set ns.found_start = true %}\n        {% endif %}\n        {%
          set ns.ts_stop = i + 1 %}\n      {% else %}\n        {% if ns.found_start
          %}\n          {% if (ns.ts_stop - ns.ts_start) >= 4 %}\n            {% set
          ns.ended = true %}\n          {% else %}\n            {% set ns.found_start
          = false %}\n          {% endif %}\n        {% endif %}\n      {% endif %}\n
          \   {% endif %}\n  {% endfor %}\n\n  {% if (ns.ts_stop - ns.ts_start) <
          4 %}\n    {% set ns.ts_start = ns.best_1h_idx %}\n    {% set ns.ts_stop
          = ns.best_1h_idx + 4 %}\n  {% endif %}\n\n  {% set start_dt = (today_at(\"22:00\")
          + timedelta(minutes=ns.ts_start * 15)).timestamp() | int | string %}\n  {%
          set stop_dt = (today_at(\"22:00\") + timedelta(minutes=ns.ts_stop * 15)).timestamp()
          | int | string %}\n\n  {{ ns.ts_2h ~ '|' ~ ns.ts_3h ~ '|' ~ ns.ts_5h ~ '|'
          ~ ns.ts_1h ~ '|' ~ start_dt ~ '|' ~ stop_dt ~ '|' ~ (min_price | string)
          }}\n{% endif %}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_water_heating_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[0]
          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_water_heating_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[0]
          | int + 7200 }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev_charge_start
        - input_datetime.automation_ev2_charge_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[2]
          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev_charge_stop
        - input_datetime.automation_ev2_charge_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[2]
          | int + 18000 }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_cheap_ev_charge_start
        - input_datetime.automation_cheap_ev2_charge_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[3]
          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_cheap_ev_charge_stop
        - input_datetime.automation_cheap_ev2_charge_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[3]
          | int + 3600 }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[1]
          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[1]
          | int + 10800 }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_cheap_start
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[4]
          | int }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_cheap_stop
      data:
        timestamp: '{{ states(''input_text.automation_low_cost_coopernico'').split(''|'')[5]
          | int }}'
  - alias: 'BLOCK B: Afternoon/Day Calculations (Runs on ALL triggers)'
    action: input_text.set_value
    target:
      entity_id: input_text.automation_afternoon_low_cost_coopernico
    data:
      value: "{% set sensor = 'sensor.edp_trihorario_price' %} {% set tomorrow_dict
        = state_attr(sensor, 'tomorrow_hours') %} {% set today_dict = state_attr(sensor,
        'today_hours') %} {% if now().hour >= 20 and tomorrow_dict is not none and
        tomorrow_dict.values() | select('number') | list | count > 32 %}\n  {% set
        source_dict = tomorrow_dict %}\n  {% set day_offset = 1 %}\n{% else %}\n  {%
        set source_dict = today_dict %}\n  {% set day_offset = 0 %}\n{% endif %} {%
        if source_dict is not none %}\n  {% set all_prices = source_dict.items() |
        sort(attribute='0') | map(attribute='1') | list %}\n  {# Index 32 is 08:00,
        Index 80 is 20:00 (48 blocks total) #}\n  {% set window = all_prices[32:80]
        %}\n  {% set d_steps = 8 %}\n\n  {# 1. Find absolute 2-hour minimum sum and
        average #}\n  {% set ns_min = namespace(min_sum=999999, min_idx=0) %}\n  {%
        for i in range(window | count - d_steps + 1) %}\n    {% set current_sum =
        window[i:i+d_steps] | select('number') | map('float', 1000) | sum %}\n    {%
        if current_sum < ns_min.min_sum %}\n      {% set ns_min.min_sum = current_sum
        %}\n      {% set ns_min.min_idx = i %}\n    {% endif %}\n  {% endfor %}\n\n
        \ {% set min_avg = ns_min.min_sum / d_steps %}\n  {% set buffer = (min_avg
        * 0.10) if min_avg > 10 else 2.0 %}\n  {% set max_allowed = min_avg + buffer
        %}\n\n  {# 2. Search for top-off 2h window whose peak price <= max_allowed
        (falling back to ns_min.min_idx if none found) #}\n  {% set best = namespace(idx=ns_min.min_idx,
        found=false) %}\n  {% for i in range((window | count - d_steps), -1, -1) %}\n
        \   {% if not best.found %}\n      {% set current_max = window[i:i+d_steps]
        | select('number') | map('float', 1000) | max %}\n      {% if current_max
        <= max_allowed %}\n        {% set best.idx = i %}\n        {% set best.found
        = true %}\n      {% endif %}\n    {% endif %}\n  {% endfor %}\n\n  {# 3. Expand
        outwards around min price #}\n  {% set cheap = namespace(start=ns_min.min_idx,
        stop=ns_min.min_idx + 1) %}\n  {% for i in range(ns_min.min_idx - 1, -1, -1)
        %}\n    {% if window[i] is number and window[i] | float(1000) <= max_allowed
        and cheap.start == i + 1 %}\n      {% set cheap.start = i %}\n    {% endif
        %}\n  {% endfor %}\n  {% for i in range(ns_min.min_idx + 1, window | count)
        %}\n    {% if window[i] is number and window[i] | float(1000) <= max_allowed
        and cheap.stop == i %}\n      {% set cheap.stop = i + 1 %}\n    {% endif %}\n
        \ {% endfor %}\n\n  {% set start_dt = (today_at(\"08:00\") + timedelta(days=day_offset)
        + timedelta(minutes=best.idx * 15)).timestamp() | int | string %}\n  {% set
        cheap_start_dt = (today_at(\"08:00\") + timedelta(days=day_offset) + timedelta(minutes=cheap.start
        * 15)).timestamp() | int | string %}\n  {% set cheap_stop_dt = (today_at(\"08:00\")
        + timedelta(days=day_offset) + timedelta(minutes=cheap.stop * 15)).timestamp()
        | int | string %}\n\n  {{ start_dt ~ \"|\" ~ (min_avg | round(2) | string)
        ~ \"|\" ~ cheap_start_dt ~ \"|\" ~ cheap_stop_dt }}\n{% endif %}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.late_afternoon_water_heating_start
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.late_afternoon_water_heating_stop
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int + 7200 }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_start
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_stop
    data:
      timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
        | int + 7200 }}'
  - alias: 'BLOCK C: Rolling 24-Hour Evaluation & Direct Input_Datetime Update'
    if:
    - condition: template
      value_template: '{% set sensor = ''sensor.edp_trihorario_price'' %} {% set today_d
        = state_attr(sensor, ''today_hours'') or {} %} {% set tomorrow_d = state_attr(sensor,
        ''tomorrow_hours'') or {} %} {{ (today_d.values() | select(''number'') | list
        | count + tomorrow_d.values() | select(''number'') | list | count) >= 32 }}'
    then:
    - variables:
        cheap_24h: "{% set sensor = 'sensor.edp_trihorario_price' %} {% set today_d
          = state_attr(sensor, 'today_hours') or {} %} {% set tomorrow_d = state_attr(sensor,
          'tomorrow_hours') or {} %} {% set now_ts = now().timestamp() - 890 %}\n{%
          set ns = namespace(future=[]) %}\n{% for h, price in today_d.items() %}\n
          \ {% if price is number and as_timestamp(h) >= now_ts %}\n    {% set ns.future
          = ns.future + [(as_timestamp(h), price, h)] %}\n  {% endif %}\n{% endfor
          %}\n{% for h, price in tomorrow_d.items() %}\n  {% if price is number and
          as_timestamp(h) >= now_ts %}\n    {% set ns.future = ns.future + [(as_timestamp(h),
          price, h)] %}\n  {% endif %}\n{% endfor %}\n{% set items = ns.future | sort(attribute='0')
          %} {% set window = items[:96] %}\n{% if window | count >= 8 %}\n  {% set
          prices = window | map(attribute='1') | list %}\n  {% set d_steps = 8 %}\n\n
          \ {% set ns_min = namespace(min_sum=999999, min_idx=0) %}\n  {% for i in
          range(prices | count - d_steps + 1) %}\n    {% set current_sum = prices[i:i+d_steps]
          | select('number') | map('float', 1000) | sum %}\n    {% if current_sum
          < ns_min.min_sum %}\n      {% set ns_min.min_sum = current_sum %}\n      {%
          set ns_min.min_idx = i %}\n    {% endif %}\n  {% endfor %}\n\n  {% set min_avg
          = ns_min.min_sum / d_steps %}\n  {% set buffer = (min_avg * 0.10) if min_avg
          > 10 else 2.0 %}\n  {% set max_allowed = min_avg + buffer %}\n\n  {% set
          cheap = namespace(start=ns_min.min_idx, stop=ns_min.min_idx + 1) %}\n  {%
          for i in range(ns_min.min_idx - 1, -1, -1) %}\n    {% if prices[i] is number
          and prices[i] | float(1000) <= max_allowed and cheap.start == i + 1 %}\n
          \     {% set cheap.start = i %}\n    {% endif %}\n  {% endfor %}\n  {% for
          i in range(ns_min.min_idx + 1, prices | count) %}\n    {% if prices[i] is
          number and prices[i] | float(1000) <= max_allowed and cheap.stop == i %}\n
          \     {% set cheap.stop = i + 1 %}\n    {% endif %}\n  {% endfor %}\n\n
          \ {% set start_dt = window[cheap.start][2] | as_datetime %}\n  {% set stop_dt
          = (window[cheap.stop - 1][2] | as_datetime) + timedelta(minutes=15) %}\n\n
          \ {% set start_ts = start_dt.timestamp() | int | string %}\n  {% set stop_ts
          = stop_dt.timestamp() | int | string %}\n\n  {{ start_ts ~ \"|\" ~ stop_ts
          }}\n{% endif %}"
    - if:
      - condition: template
        value_template: '{{ cheap_24h is defined and cheap_24h != '''' and ''|'' in
          cheap_24h }}'
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.omie_cheap_start
        data:
          timestamp: '{{ cheap_24h.split(''|'')[0] | int }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.omie_cheap_stop
        data:
          timestamp: '{{ cheap_24h.split(''|'')[1] | int }}'
  - alias: Dynamic Logging
    action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Phase 1 Complete: All price blocks executed. Night, Daytime, and Rolling
        24h windows calculated. (Trigger: {{ trigger.id }})'
  mode: single
- id: '1782236389841'
  alias: 'Holiday Mode: Morning Blinds Simulation'
  description: Executes a randomized human-presence simulation sequence for the blinds
    when Holiday Mode is active.
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.holliday_mode
    state:
    - 'on'
  actions:
  - alias: Randomize start time between 10:00 and 10:30
    delay:
      minutes: '{{ range(0, 31) | random }}'
      seconds: '{{ range(0, 60) | random }}'
    enabled: true
  - alias: Stop Master Suite (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_suite
  - alias: Open Master Suite
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_suite
    data:
      position: '{{ range(15, 26) | random }}'
  - delay:
      seconds: '{{ range(5, 11) | random }}'
  - alias: Stop Master Bathroom (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_master_bathroom
  - alias: Open Master Bathroom
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_master_bathroom
    data:
      position: '{{ range(15, 21) | random }}'
  - alias: Determine the order for kids rooms
    variables:
      first_room: '{{ [''cover.blinds_lara'', ''cover.blinds_lucas''] | random }}'
      second_room: '{{ ''cover.blinds_lucas'' if first_room == ''cover.blinds_lara''
        else ''cover.blinds_lara'' }}'
  - alias: Stop First Kids Room (Initialization)
    action: cover.stop_cover
    target:
      entity_id: '{{ first_room }}'
  - alias: Open First Kids Room
    action: cover.set_cover_position
    target:
      entity_id: '{{ first_room }}'
    data:
      position: '{{ range(15, 26) | random }}'
  - delay:
      seconds: 15
  - alias: Stop Second Kids Room (Initialization)
    action: cover.stop_cover
    target:
      entity_id: '{{ second_room }}'
  - alias: Open Second Kids Room
    action: cover.set_cover_position
    target:
      entity_id: '{{ second_room }}'
    data:
      position: '{{ range(15, 26) | random }}'
  - delay:
      seconds: 15
  - alias: Stop Stairs (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_stairs
  - alias: Open Stairs
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_stairs
    data:
      position: '{{ range(20, 26) | random }}'
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.sonoff_10020744e0_1
    data: {}
  - delay:
      seconds: 30
  - alias: Stop Dinner (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_dinner
  - alias: Open Dinner
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_dinner
    data:
      position: '{{ range(40, 51) | random }}'
  - delay:
      seconds: 5
  - alias: Stop Patio (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_patio
  - alias: Open Patio
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_patio
    data:
      position: 50
  - delay:
      seconds: 5
  - alias: Stop Kitchen (Initialization)
    action: cover.stop_cover
    target:
      entity_id: cover.blinds_kitchen
  - alias: Open Kitchen
    action: cover.set_cover_position
    target:
      entity_id: cover.blinds_kitchen
    data:
      position: '{{ range(50, 56) | random }}'
  - action: input_boolean.turn_on
    metadata: {}
    target:
