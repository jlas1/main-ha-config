        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solax_battery_capacity'') | float(100)
            <= states(''input_number.new_day_battery_target'') | float(0) }}'
        then:
        - alias: Set Upper SOC to Real Day Target
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_nightcharge_upper_soc
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | int(60) -
              5 }}'
        - alias: Turn on charging period2
          action: switch.turn_on
          target:
            entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day [SolaX]: Charging needed. Upper SOC set to {{ states(''input_number.new_day_battery_target'')
              }}%, Period 2 charge enabled.'
        else:
        - alias: Disable Day Period
          action: switch.turn_off
          target:
            entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        - delay:
            seconds: 2
        - alias: Set Discharge Floor to Day Target SOC
          action: number.set_value
          target:
            entity_id: number.solax_selfuse_discharge_min_soc
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | int(60) }}'
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day [SolaX]: Excess energy (SOC: {{ states(''sensor.solax_battery_capacity'')
              }}%). Period 2 disabled, draining to target {{ states(''input_number.new_day_battery_target'')
              }}%.'
      - if:
        - condition: template
          value_template: '{{ states(''sensor.garage_gx_device_dc_battery_charge'')
            | float(100) <= states(''input_number.new_day_battery_target'') | float(0)
            + 10 }}'
        then:
        - alias: Enable Charge from Grid
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.force_battery_charge
        - action: input_number.set_value
          alias: Copy battery value to victron control loop
          target:
            entity_id: input_number.victron_battery_charge_level
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | float + 10
              }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.victron_minimum_soc
          alias: Reset Victron Minimum SOC for Charging
          data:
            value: '20'
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day [Victron]: Force Charging enabled. Target level
              set to {{ states(''input_number.new_day_battery_target'') | float +
              10 }}% (Current SOC: {{ states(''sensor.garage_gx_device_dc_battery_charge'')
              }}%), minimum SOC set to 20%.'
        else:
        - action: input_number.set_value
          alias: Copy battery value to victron control loop
          target:
            entity_id: input_number.victron_battery_charge_level
          data:
            value: '{{ states(''input_number.new_day_battery_target'') | float + 10
              }}'
        - alias: Set Discharge Floor to Day Target SOC
          action: input_number.set_value
          target:
            entity_id: input_number.victron_minimum_soc
          data:
            value: '{{ (states(''input_number.new_day_battery_target'') | float(0)
              + 10) | int(60) }}'
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.force_battery_charge
        - action: notify.send_message
          target:
            entity_id: notify.energy_log
          data:
            message: 'Phase 4 Day [Victron]: Excess energy (Current SOC: {{ states(''sensor.garage_gx_device_dc_battery_charge'')
              }}%). Force Charging disabled, minimum SOC set to {{ (states(''input_number.new_day_battery_target'')
              | float(0) + 10) | int }}%.'
    - conditions:
      - condition: trigger
        id: drain_night_reached
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_night_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_night_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      - condition: template
        alias: Corrected entity comparison for collapsed night window
        value_template: '{{ states(''time.garage_solax_inverter_charge_start_1'')
          == states(''time.garage_solax_inverter_charge_end_1'') }}'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Floor
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - delay:
          seconds: 2
      - alias: Set Target SOC to lock battery
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_nightcharge_upper_soc
        data:
          value: '{{ states(''input_number.new_battery_target'') | int(60) - 5 }}'
      - delay:
          seconds: 2
      - alias: 'Rebuild Window: Set Start Time to Now'
        action: time.set_value
        target:
          entity_id: tinput_datetime.solax_night_charge_start
        data:
          time: '{{ now().strftime(''%H:%M:%S'') }}'
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept [SolaX]: Night drain hit target (SOC: {{ states(''sensor.solax_battery_capacity'')
            }}%). Rebuilt charging window to safely lock battery.'
    - conditions:
      - condition: trigger
        id:
        - drain_night_reached_victron
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_night_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_night_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      sequence:
      - action: input_number.set_value
        alias: Copy battery value to victron control loop
        target:
          entity_id: input_number.victron_battery_charge_level
        data:
          value: '{{ states(''input_number.new_battery_target'') | float + 10 }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_minimum_soc
        alias: Lock Victron Minimum SOC upon reaching drain target
        data:
          value: '{{ states(''input_number.new_battery_target'') | float + 10 }}'
      - alias: Enable Charge from Grid
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.force_battery_charge
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept [Victron]: Night drain hit target (SOC: {{ states(''sensor.garage_gx_device_dc_battery_charge'')
            }}%). Locked minimum SOC to {{ states(''input_number.new_battery_target'')
            | float + 10 }}% and enabled Force Charge.'
    - conditions:
      - condition: trigger
        id: drain_day_reached
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_day_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_day_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      - condition: state
        entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
        state: 'off'
      sequence:
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Floor
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - delay:
          seconds: 2
      - alias: Set Day Target SOC to lock battery
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_nightcharge_upper_soc
        data:
          value: '{{ states(''input_number.new_day_battery_target'') | int(60) - 5
            }}'
      - delay:
          seconds: 2
      - alias: Set Start Time to Actual Time
        action: time.set_value
        target:
          entity_id: time.garage_solax_inverter_charge_start_2
        data:
          time: '{{ now().strftime(''%H:%M:%S'') }}'
      - delay:
          seconds: 1
      - alias: Re-Enable Day Period
        action: switch.turn_on
        target:
          entity_id: switch.garage_solax_inverter_charge_and_discharge_period2
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept [SolaX]: Day drain hit target (SOC: {{ states(''sensor.solax_battery_capacity'')
            }}%). Re-enabled Period 2 to safely lock battery.'
    - conditions:
      - condition: trigger
        id:
        - drain_day_reached_victron
      - condition: template
        value_template: '{% set start = state_attr(''input_datetime.solax_day_charge_start'',
          ''timestamp'') | float(0) %} {% set stop = state_attr(''input_datetime.solax_day_charge_stop'',
          ''timestamp'') | float(0) %} {{ start <= now().timestamp() < stop }}'
      sequence:
      - action: input_number.set_value
        alias: Copy battery value to victron control loop
        target:
          entity_id: input_number.victron_battery_charge_level
        data:
          value: '{{ states(''input_number.new_day_battery_target'') | float + 10
            }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_minimum_soc
        alias: Lock Victron Minimum SOC upon reaching drain target
        data:
          value: '{{ states(''input_number.new_day_battery_target'') | float + 10
            }}'
      - alias: Enable Charge from Grid
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.force_battery_charge
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Intercept [Victron]: Day drain hit target (SOC: {{ states(''sensor.garage_gx_device_dc_battery_charge'')
            }}%). Locked minimum SOC to {{ states(''input_number.new_day_battery_target'')
            | float + 10 }}% and enabled Force Charge.'
    - conditions:
      - condition: trigger
        id: stop_night
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.force_battery_charge
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_minimum_soc
        alias: Restore Victron Safety Minimum SOC Floor to 20%
        data:
          value: '20'
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_battery_charge_level
        alias: Reset Victron Battery Charge Level Target to 20%
        data:
          value: '20'
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Discharge Floor to 11
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Night [SolaX & Victron]: Night window ended. [SolaX] Min
            discharge SOC restored to 11%. [Victron] Force charge disabled, min SOC
            & charge target restored to 20%.'
    - conditions:
      - condition: trigger
        id: stop_day
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.force_battery_charge
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.solax_day_charge_start
        data:
          timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
            | int }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.solax_day_charge_stop
        data:
          timestamp: '{{ states(''input_text.automation_afternoon_low_cost_coopernico'').split(''|'')[0]
            | int + 7200 }}              '
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_minimum_soc
        alias: Restore Victron Safety Minimum SOC Floor to 20%
        data:
          value: '20'
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_battery_charge_level
        alias: Reset Victron Battery Charge Level Target to 20%
        data:
          value: '20'
      - alias: Unlock Inverter Settings
        action: select.select_option
        target:
          entity_id: select.solax_lock_state
        data:
          option: Unlocked - Advanced
      - delay:
          seconds: 2
      - alias: Restore Safety Discharge Floor to 11
        action: number.set_value
        target:
          entity_id: number.solax_selfuse_discharge_min_soc
        data:
          value: 11
      - action: notify.send_message
        target:
          entity_id: notify.energy_log
        data:
          message: 'Phase 4 Day [SolaX & Victron]: Day window ended. [SolaX] Min discharge
            SOC restored to 11%. [Victron] Force charge disabled, min SOC & charge
            target restored to 20%.'
  mode: parallel
  max: 10
- id: '1793642245439'
  alias: 'Phase 1: EDP Fixed Tariff Schedule Manager'
  description: Sets daily battery charging, EV charging, and water heating schedules
    based on EDP Tri-Horário Summer and Winter periods.
  triggers:
  - trigger: time
    at: '14:00:00'
    id: daily_refresh
  - trigger: time
    at: '22:00:00'
    id: update_next_day_afternoon
  - trigger: homeassistant
    event: start
    id: ha_restart
  conditions: []
  actions:
  - alias: Define Seasonal Schedules and Calculated Timestamps
    variables:
      is_summer: '{{ now().dst() is not none and now().dst().total_seconds() > 0 }}'
      cfg: "{% if is_summer %}\n  {{ {\n    'water_heater_night': ['04:30', '06:00'],\n
        \   'water_heater_day':   ['17:30', '19:29'],\n    'solax_night':        ['06:00',
        '08:00'],\n    'solax_day':          ['17:29', '19:29'],\n    'ev_normal':
        \         ['01:00', '06:00'],\n    'ev2_normal':         ['22:00', '03:00'],\n
        \   'ev_cheap':           ['05:00', '06:00'],\n    'vazio_window':       ['22:00',
        '08:00'],\n    'cheap_24h':          ['05:30', '07:30']\n  } }}\n{% else %}\n
        \ {{ {\n    'water_heater_night': ['04:30', '06:00'],\n    'water_heater_day':
        \  ['16:00', '17:59'],\n    'solax_night':        ['06:00', '08:00'],\n    'solax_day':
        \         ['16:00', '17:59'],\n    'ev_normal':          ['01:00', '06:00'],\n
        \   'ev2_normal':         ['22:00', '03:00'],\n    'ev_cheap':           ['05:00',
        '06:00'],\n    'vazio_window':       ['22:00', '08:00'],\n    'cheap_24h':
        \         ['05:00', '07:00']\n  } }}\n{% endif %}"
      p_vazio: 112.2
      p_cheias: 145.3
      day_offset: '{{ 1 if now().hour >= 20 else 0 }}'
      wh_n_start: '{{ (today_at(cfg.water_heater_night[0]) if cfg.water_heater_night[0]
        >= ''22:00'' else today_at(cfg.water_heater_night[0]) + timedelta(days=1)).timestamp()
        | int }}'
      wh_n_stop: '{{ (today_at(cfg.water_heater_night[1]) if cfg.water_heater_night[1]
        >= ''22:00'' else today_at(cfg.water_heater_night[1]) + timedelta(days=1)).timestamp()
        | int }}'
      sx_n_start: '{{ (today_at(cfg.solax_night[0]) if cfg.solax_night[0] >= ''22:00''
        else today_at(cfg.solax_night[0]) + timedelta(days=1)).timestamp() | int }}'
      sx_n_stop: '{{ (today_at(cfg.solax_night[1]) if cfg.solax_night[1] >= ''22:00''
        else today_at(cfg.solax_night[1]) + timedelta(days=1)).timestamp() | int }}'
      ev_start: '{{ (today_at(cfg.ev_normal[0]) if cfg.ev_normal[0] >= ''22:00'' else
        today_at(cfg.ev_normal[0]) + timedelta(days=1)).timestamp() | int }}'
      ev_stop: '{{ (today_at(cfg.ev_normal[1]) if cfg.ev_normal[1] >= ''22:00'' else
        today_at(cfg.ev_normal[1]) + timedelta(days=1)).timestamp() | int }}'
      ev2_start: '{{ (today_at(cfg.ev2_normal[0]) if cfg.ev2_normal[0] >= ''22:00''
        else today_at(cfg.ev2_normal[0]) + timedelta(days=1)).timestamp() | int }}'
      ev2_stop: '{{ (today_at(cfg.ev2_normal[1]) if cfg.ev2_normal[1] >= ''22:00''
        else today_at(cfg.ev2_normal[1]) + timedelta(days=1)).timestamp() | int }}'
      ev_c_start: '{{ (today_at(cfg.ev_cheap[0]) if cfg.ev_cheap[0] >= ''22:00'' else
        today_at(cfg.ev_cheap[0]) + timedelta(days=1)).timestamp() | int }}'
      ev_c_stop: '{{ (today_at(cfg.ev_cheap[1]) if cfg.ev_cheap[1] >= ''22:00'' else
        today_at(cfg.ev_cheap[1]) + timedelta(days=1)).timestamp() | int }}'
      vz_start: '{{ (today_at(cfg.vazio_window[0]) if cfg.vazio_window[0] >= ''22:00''
        else today_at(cfg.vazio_window[0]) + timedelta(days=1)).timestamp() | int
        }}'
      vz_stop: '{{ (today_at(cfg.vazio_window[1]) if cfg.vazio_window[1] >= ''22:00''
        else today_at(cfg.vazio_window[1]) + timedelta(days=1)).timestamp() | int
        }}'
      wh_d_start: '{{ (today_at(cfg.water_heater_day[0]) + timedelta(days=day_offset)).timestamp()
        | int }}'
      wh_d_stop: '{{ (today_at(cfg.water_heater_day[1]) + timedelta(days=day_offset)).timestamp()
        | int }}'
      sx_d_start: '{{ (today_at(cfg.solax_day[0]) + timedelta(days=day_offset)).timestamp()
        | int }}'
      sx_d_stop: '{{ (today_at(cfg.solax_day[1]) + timedelta(days=day_offset)).timestamp()
        | int }}'
      c24_start: '{{ (today_at(cfg.cheap_24h[0]) if cfg.cheap_24h[0] >= ''22:00''
        else today_at(cfg.cheap_24h[0]) + timedelta(days=1)).timestamp() | int }}'
      c24_stop: '{{ (today_at(cfg.cheap_24h[1]) if cfg.cheap_24h[1] >= ''22:00'' else
        today_at(cfg.cheap_24h[1]) + timedelta(days=1)).timestamp() | int }}'
  - if:
    - condition: template
      value_template: '{{ trigger.id != ''update_next_day_afternoon'' }}'
    then:
    - alias: Update Night input_text Payload for Downstream Automations
      action: input_text.set_value
      target:
        entity_id: input_text.automation_low_cost_coopernico
      data:
        value: '{{ wh_n_start ~ ''|'' ~ sx_n_start ~ ''|'' ~ ev_start ~ ''|'' ~ ev_c_start
          ~ ''|'' ~ vz_start ~ ''|'' ~ vz_stop ~ ''|'' ~ (p_vazio | string) }}'
    - alias: Set Night Water Heating Window
      action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_water_heating_start
      data:
        timestamp: '{{ wh_n_start }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_water_heating_stop
      data:
        timestamp: '{{ wh_n_stop }}'
    - alias: Set EV Normal Charge Window
      action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev_charge_start
      data:
        timestamp: '{{ ev_start }}'
    - alias: Set EV Normal Charge Window
      action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev2_charge_start
      data:
        timestamp: '{{ ev2_start }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev_charge_stop
      data:
        timestamp: '{{ ev_stop }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_ev2_charge_stop
      data:
        timestamp: '{{ ev2_stop }}'
    - alias: Set EV Cheap Charge Window
      action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_cheap_ev_charge_start
        - input_datetime.automation_cheap_ev2_charge_start
      data:
        timestamp: '{{ ev_c_start }}'
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.automation_cheap_ev_charge_stop
        - input_datetime.automation_cheap_ev2_charge_stop
      data:
        timestamp: '{{ ev_c_stop }}'
    - alias: Set SolaX Night Charge Window
      action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_start
      data:
        timestamp: '{{ sx_n_start }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_stop
      data:
        timestamp: '{{ sx_n_stop }}'
    - alias: Set Full Cheap Night Window (Vazio)
      action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_cheap_start
      data:
        timestamp: '{{ vz_start }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.solax_night_charge_cheap_stop
      data:
        timestamp: '{{ vz_stop }}'
  - alias: Update Afternoon input_text Payload for Downstream Automations
    action: input_text.set_value
    target:
      entity_id: input_text.automation_afternoon_low_cost_coopernico
    data:
      value: '{{ sx_d_start ~ ''|'' ~ (p_cheias | string) ~ ''|'' ~ sx_d_start ~ ''|''
        ~ sx_d_stop }}'
  - alias: Set Daytime Water Heating Window
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.late_afternoon_water_heating_start
    data:
      timestamp: '{{ wh_d_start }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.late_afternoon_water_heating_stop
    data:
      timestamp: '{{ wh_d_stop }}'
  - alias: Set SolaX Day Charge Window
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_start
    data:
      timestamp: '{{ sx_d_start }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.solax_day_charge_stop
    data:
      timestamp: '{{ sx_d_stop }}'
  - alias: Set 24h Rolling Window for EV Limiter
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.omie_cheap_start
    data:
      timestamp: '{{ c24_start }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.omie_cheap_stop
    data:
      timestamp: '{{ c24_stop }}'
  - alias: Logging
    action: notify.send_message
    target:
      entity_id: notify.energy_log
    data:
      message: 'Phase 1 [EDP Fixed]: Updated schedules for {{ ''Summer'' if is_summer
        else ''Winter'' }}. Water Heater: {{ cfg.water_heater_night[0] }}-{{ cfg.water_heater_night[1]
        }}, SolaX Night: {{ cfg.solax_night[0] }}-{{ cfg.solax_night[1] }}, EV: {{
        cfg.ev_normal[0] }}-{{ cfg.ev_normal[1] }}.'
  mode: single
- id: '1794093623877'
  alias: DACIA Charging - Smart SOC Limiter (WiCAN)
  description: Charges Dacia at 16A during OMIE start/stop windows, capped at 90%
    SOC on weekdays and 100% on weekends. Supports mid-window plug-in detection and
    disconnect resets.
  triggers:
  - trigger: time
    at: input_datetime.ev2_charge_start
    id: EV2_charge_start
  - trigger: state
    entity_id: switch.ev_charger_2
    to: 'on'
    id: EV2_car_connected
  - trigger: state
    entity_id: sensor.ev_charger_2_status
    to:
    - plugged_in
    - waiting
    - charging
    id: EV2_car_connected
  - trigger: time
    at: input_datetime.ev2_charge_stop
    id: EV2_charge_stop
  - trigger: template
    value_template: '{% set soc_entity = ''sensor.wican_obd_soc'' %} {% set soc =
      states(soc_entity) | float(-1) %} {% set target_soc = 100 if now().weekday()
      in [5, 6] else 90 %} {{ soc >= target_soc and is_state(''input_boolean.automatic_ve2_switch'',
      ''on'') }}'
    id: EV2_target_soc_reached
  - trigger: state
    entity_id: sensor.ev_charger_2_status
    to:
    - disconnected
    - standby
    id: EV2_car_unplugged
  actions:
  - variables:
      soc_sensor: sensor.garage_dacia_spring_soc
      current_soc: '{{ states(soc_sensor) | float(0) }}'
      target_soc: '{{ 100 if now().weekday() in [5, 6] else 90 }}'
      car_is_connected: "{{ is_state('switch.ev_charger_2', 'on') or \n   states('sensor.ev_charger_2_status')
        in ['plugged_in', 'waiting', 'charging'] }}"
      in_window: "{% set s_raw = states('input_datetime.ev2_charge_start') %} {% set
        e_raw = states('input_datetime.ev2_charge_stop') %} {% if '-' in s_raw %}\n
        \ {% set s_ts = as_timestamp(s_raw, 0) %}\n  {% set e_ts = as_timestamp(e_raw,
        0) %}\n  {% set n_ts = as_timestamp(now()) %}\n  {{ s_ts <= n_ts < e_ts }}\n{%
        else %}\n  {% set t_now = now().strftime('%H:%M:%S') %}\n  {% if s_raw <=
        e_raw %}\n    {{ s_raw <= t_now < e_raw }}\n  {% else %}\n    {{ t_now >=
        s_raw or t_now < e_raw }}\n  {% endif %}\n{% endif %}"
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: EV2_charge_start
        - condition: trigger
          id: EV2_car_connected
      - alias: Must be inside the OMIE window
        condition: template
        value_template: '{{ in_window }}'
      - alias: Car must be physically connected
        condition: template
        value_template: '{{ car_is_connected }}'
      - alias: SOC must be below limit (or WiCAN asleep)
        condition: template
        value_template: '{{ states(soc_sensor) in [''unknown'', ''unavailable''] or
          current_soc < target_soc }}'
      - alias: Prevent redundant triggers if already charging
        condition: state
        entity_id: input_boolean.automatic_ve2_switch
        state: 'off'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev2_suggested_current
        data:
          value: 16
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.automatic_ve2_switch
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'DACIA charging initiated at 16A (Trigger: {{ trigger.id }}).  Current
            SOC: {{ current_soc }}% (Target: {{ target_soc }}%).'
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: EV2_charge_stop
        - condition: trigger
          id: EV2_target_soc_reached
        - condition: trigger
          id: EV2_car_unplugged
      - condition: state
        entity_id: input_boolean.automatic_ve2_switch
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.automatic_ve2_switch
      - action: input_number.set_value
        target:
          entity_id: input_number.ev2_suggested_current
        data:
          value: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ve2_is_throttled
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'DACIA charging stopped (automatic_ve2_switch OFF).  Reason: {{
            trigger.id }} (SOC: {{ states(soc_sensor) }}%).'
  mode: restart
