- id: '1775942669525'
  alias: EV2 Automatic Mode
  description: ''
  triggers:
  - entity_id:
    - input_boolean.manual_override_ve2_switch
    - input_boolean.automatic_ve2_switch
    - input_boolean.grid_injection_avoidance_ve2_switch
    - input_boolean.ev2_master_switch
    id: VE Switch changed state
    trigger: state
  - trigger: template
    value_template: '{{ states(''sensor.ev_charger_2_status'') == ''waiting'' }}'
    id: EV charger waiting
  - trigger: state
    entity_id: sensor.ev_charger_2_status
    to: charged
    for:
      minutes: 10
    id: EV charger charged
  - trigger: state
    entity_id:
    - switch.ev_charger_2
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: ev2_switch_turned_on
  - trigger: state
    entity_id:
    - switch.ev_charger_2
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: ev2_switch_turned_off
  conditions:
  - condition: template
    alias: If trigger is the EV2 switch turning ON, ensure it was done by HA
    value_template: '{{ trigger.id != ''ev2_switch_turned_on'' or trigger.to_state.context.parent_id
      is not none or trigger.to_state.context.user_id is not none }}'
    enabled: false
  actions:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.manual_override_ve2_switch
        state: 'on'
      - condition: state
        entity_id: input_boolean.automatic_ve2_switch
        state: 'on'
      - condition: state
        entity_id: input_boolean.grid_injection_avoidance_ve2_switch
        state: 'on'
    - condition: state
      entity_id: input_boolean.ev2_master_switch
      state: 'on'
    then:
    - if:
      - condition: state
        entity_id: switch.ev_charger_2
        state: 'off'
      - alias: Do not force ON if no car is connected
        condition: template
        value_template: '{{ states(''sensor.ev_charger_2_status'') != ''available''
          }}'
      then:
      - alias: Try to turn ON the EV2 switch up to 3 times
        repeat:
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.ev_charger_2
          - if:
            - condition: state
              entity_id: switch.ev_charger_2
              state: 'off'
            then:
            - delay:
                seconds: 5
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.ev_charger_2
              state: 'on'
            - condition: template
              value_template: '{{ repeat.index >= 3 }}'
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: EV2 switch turned ON.
      else:
      - if:
        - condition: or
          conditions:
          - condition: trigger
            id: EV charger charged
          - condition: trigger
            id: EV charger waiting
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.box_ve2
          enabled: true
        - delay:
            seconds: 5
          enabled: true
        - action: switch.turn_on
          target:
            entity_id: switch.box_ve2
          enabled: true
        - if:
          - condition: trigger
            id: EV charger charged
          then:
          - action: notify.send_message
            target:
              entity_id: notify.ev_fleet_log
            data:
              message: BOX VE2 cycled due to 10m charged status.
            enabled: true
          else:
          - action: notify.send_message
            target:
              entity_id: notify.ev_fleet_log
            data:
              message: BOX VE2 cycled due to waiting status.
            enabled: true
    else:
    - alias: Only turn OFF if it is currently ON
      if:
      - condition: state
        entity_id: switch.ev_charger_2
        state: 'on'
      then:
      - alias: Try to turn OFF the EV2 switch up to 3 times
        repeat:
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.ev_charger_2
          - if:
            - condition: state
              entity_id: switch.ev_charger_2
              state: 'on'
            then:
            - delay:
                seconds: 5
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.ev_charger_2
              state: 'off'
            - condition: template
              value_template: '{{ repeat.index >= 3 }}'
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: EV2 switch turned OFF.
  mode: queued
  max: 10
- id: '1775943176391'
  alias: DACIA OMIE
  description: ''
  triggers:
  - at: input_datetime.automation_ev2_charge_start
    id: long_start
    trigger: time
  - at: input_datetime.automation_ev2_charge_stop
    id: long_stop
    trigger: time
  - at: input_datetime.automation_cheap_ev2_charge_start
    id: short_start
    trigger: time
  - at: input_datetime.automation_cheap_ev2_charge_stop
    id: short_stop
    trigger: time
  conditions: []
  actions:
  - variables:
      target_day: '{{ (now() + timedelta(hours=12)).strftime(''%A'') | lower }}'
      dropdown_entity: input_select.ev2_power_{{ target_day }}
      target_mode: '{{ states(dropdown_entity) | lower }}'
      target_current: "{% if target_mode == 'high' %}\n  13\n{% elif target_mode ==
        'medium' %}\n  10\n{% elif target_mode == 'low' %}\n  16\n{% else %}\n  6\n{%
        endif %}\n"
  - choose:
    - conditions:
      - condition: trigger
        id: long_start
      - condition: template
        value_template: '{{ target_mode in [''high'', ''medium''] }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev2_suggested_current
        data:
          value: '{{ target_current }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.automatic_ve2_switch
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'Started DACIA Long Charging at {{ target_current }}A (Mode: {{
            target_mode }}).'
    - conditions:
      - condition: trigger
        id: long_stop
      - condition: template
        value_template: '{{ target_mode in [''high'', ''medium''] }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.automatic_ve2_switch
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'Stopped DACIA Long Charging (Mode: {{ target_mode }}).'
    - conditions:
      - condition: trigger
        id: short_start
      - condition: template
        value_template: '{{ target_mode == ''low'' }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev2_suggested_current
        data:
          value: '{{ target_current }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.automatic_ve2_switch
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'Started DACIA Short Charging at {{ target_current }}A (Mode: {{
            target_mode }}).'
    - conditions:
      - condition: trigger
        id: short_stop
      - condition: template
        value_template: '{{ target_mode == ''low'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.automatic_ve2_switch
      - action: notify.send_message
        target:
          entity_id: notify.ev_fleet_log
        data:
          message: 'Stopped DACIA Short Charging (Mode: {{ target_mode }}).'
  mode: queued
  max: 10
