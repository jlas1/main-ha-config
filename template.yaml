        {% set AC = 5.5 -%}
        {% set TSE = 2.0666 -%}
        {% set TAR_vazio = 15.8 -%}
        {% set TAR_cheias = 63.8 -%}
        {% set TAR_ponta = 141.6 -%}
        
        {% set hour = now().hour %}
        {% if hour >= 9 and hour < 10.5 or hour >= 18 and hour < 20.5 %}
          {% set TAR = TAR_ponta %}
        {% elif hour >= 7 and hour < 9 or hour >= 10.5 and hour < 18 or hour >= 20.5 and hour < 22 %}
          {% set TAR = TAR_cheias %}
        {% else %}
          {% set TAR = TAR_vazio %}
        {% endif %}
    
        {% set PE = (PM * Fadeq) * (1 + Perdas) + GGS + AC -%}
