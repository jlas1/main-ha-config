- trigger:
    - platform: time
      at: "23:59"
  sensor:
    - name: "Estimated Solar Power Yesterday"
      unique_id: estimated_solar_power_yesterday
      unit_of_measurement: "kWh"
      state: >
        {{ states('sensor.energy_production_today') }}

- sensor:

    - name: "Grid Meter Power"
      unique_id: grid_meter_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:transmission-tower
      state: >-
        {% set pwr = states('sensor.power_monitor_1_power_a') | float(0) | abs %}
        {% set flow = states('sensor.power_monitor_1_energy_flow_a') | string | lower %}
        {% set direction = -1 if flow == 'producing' else 1 %}
        {{ (pwr * direction) | round(2) }}
      availability: >-
        {{ has_value('sensor.power_monitor_1_power_a') and has_value('sensor.power_monitor_1_energy_flow_a') }}

    - name: "Solax Local Inverter Operation Mode"
      unique_id: solax_local_inverter_operation_mode
      icon: mdi:solar-power-variant
      state: >
        {{ states('sensor.solax_run_mode') }}

    - name: "Solax Cloud Yield Today"
      state: "{{ states('sensor.solax_today_s_yield') }}"
      unit_of_measurement: "kWh"
      unique_id: solax_2
      icon: mdi:flash
      device_class: energy
      state_class: total_increasing

    - name: "Solax Cloud Yield Total"
      state: "{{ states('sensor.solax_total_yield') }}"
      unit_of_measurement: "kWh"
      unique_id: solax_3
      icon: mdi:flash
      device_class: energy
      state_class: total_increasing

    - name: "Solax Cloud Inverter"
      unit_of_measurement: "W"
      state: "{{ states('sensor.solax_inverter_power') | default(0) }}"
      unique_id: solax_cloud_inverter
      icon: mdi:flash
      device_class: power
      state_class: measurement

    - name: "Solax Cloud Battery Status"
      state: "{{ states('sensor.solax_bdc_status') }}"
      unique_id: solax_6
      icon: mdi:battery

    - name: "Solax Cloud Solar Panel"
      state: "{{ states('sensor.solax_pv_power_total') }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: solax_cloud_solar_panel
      icon: mdi:solar-power-variant

    - name: "Solax Cloud Battery Use"
      state: >
       {{ states('sensor.solax_battery_power_charge') }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: solax_cloud_battery_use
      icon: mdi:battery

    - name: "Solax Cloud Battery Adjusted"
      state: >
        {% set ac = states('sensor.solax_cloud_inverter')|int %}
        {% set pv = states('sensor.solax_cloud_solar_panel')|int %}
        {{ (0 - ac + pv) }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: solax_cloud_battery_adjusted
      icon: mdi:battery

    - name: "Solax Cloud Battery Use In"
      state: >
        {% set batAdj = states('sensor.solax_cloud_battery_adjusted')|int(default=0) %}
        {% set attr = states('sensor.solax_battery_power_charge') %}
        {{ batAdj if is_number(batAdj) and (batAdj|int > 0) else 0 }}
      unit_of_measurement: "W"
      unique_id: solax_cloud_battery_use_in
      icon: mdi:battery

    - name: "Solax Cloud Battery Use Out"
      state: >
        {% set batAdj = states('sensor.solax_cloud_battery_adjusted')|int(default=0) %}
        {% set attr = states('sensor.solax_battery_power_charge') %}
        {{ (0 - batAdj) if is_number(batAdj) and (batAdj|int < 0) else 0 }}
      unit_of_measurement: "W"
      unique_id: solax_cloud_battery_use_out
      icon: mdi:battery

    - name: "Solax Cloud Battery"
      state: "{{ states('sensor.solax_battery_capacity') }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      unique_id: solax_12
      icon: mdi:battery

    - name: "Solax Cloud Grid Power"
      state: >
        {% set attr = states('sensor.solax_measured_power') %}
        {{ (0 - attr|float) if is_number(attr) else 0 }}
      unit_of_measurement: "W"
      device_class: energy
      state_class: measurement
      unique_id: solax_13
      icon: mdi:transmission-tower

    - name: "Solax Cloud Grid Power in"
      state: >
        {% set attr = states('sensor.solax_measured_power') %}
        {{ (0 - attr|float) if is_number(attr) and (attr|float < 0) else 0 }}
      unit_of_measurement: "W"
      unique_id: solax_14
      icon: mdi:transmission-tower

    - name: "Solax Cloud Grid Power out"
      state: >
        {% set attr = states('sensor.solax_measured_power') %}
        {{ attr if is_number(attr) and (attr|float > 0) else 0 }}
      unit_of_measurement: "W"
      unique_id: solax_15
      icon: mdi:transmission-tower

    - name: "Solax Cloud Energy To Grid"
      state: "{{ states('sensor.solax_today_s_export_energy') }}"
      unit_of_measurement: "kWh"
      unique_id: solax_16
      icon: mdi:transmission-tower
      device_class: energy
      state_class: total_increasing

    - name: "Solax Cloud Energy From Grid"
      state: "{{ states('sensor.solax_today_s_import_energy') }}"
      unit_of_measurement: "kWh"
      unique_id: solax_19
      icon: mdi:transmission-tower
      device_class: energy
      state_class: total_increasing

    - name: "Solax Cloud Status"
      unique_id: solax_20
      icon: mdi:solar-power-variant
      state: >
          {{ states('sensor.solax_run_mode') }}

    - name: SolaX Cloud Total Home Use
      unique_id: home use
      state: >
          {% set battery = states('sensor.solax_battery_use') %}
          {% set grid = states('sensor.solax_grid_power') %}
          {% set solar = states('sensor.solar_panel_power') %}
          {% set total = 0 - battery|float if is_number(battery) else 0 %}
          {% set total = total + (solar|float if is_number(solar) else 0) %}
          {% set total = total + (grid|float if is_number(grid) else 0) %}
          {{ total }}
      state_class: measurement
      icon: 'mdi:flash'
      unit_of_measurement: W
      device_class: power

### EDP

- sensor:
    - name: "EDP Tri-Horário Price"
      unique_id: edp_campanha_desconto_para_sempre_trihorario
      unit_of_measurement: "€/kWh"
      state_class: measurement
      icon: mdi:currency-eur
      state: >-
        {# --- CURRENT RATE (€/kWh) --- #}
        {% set p_ponta  = 0.2580 %}
        {% set p_cheias = 0.1620 %}
        {% set p_vazio  = 0.1120 %}

        {% set t = now() %}
        {% set time_num = t.hour + (t.minute / 60) %}
        {% set is_dst = (t.strftime('%z') == '+0100') %} {# Verão vs Inverno #}

        {% if time_num >= 22.0 or time_num < 8.0 %}
          {{ p_vazio }}
        {% else %}
          {% if is_dst %}
            {# Horário de Verão #}
            {% if (time_num >= 10.5 and time_num < 13.0) or (time_num >= 19.5 and time_num < 21.0) %}
              {{ p_ponta }}
            {% else %}
              {{ p_cheias }}
            {% endif %}
          {% else %}
            {# Horário de Inverno #}
            {% if (time_num >= 9.5 and time_num < 12.0) or (time_num >= 18.5 and time_num < 21.0) %}
              {{ p_ponta }}
            {% else %}
              {{ p_cheias }}
            {% endif %}
          {% endif %}
        {% endif %}

      attributes:
        tariff_name: "EDP Campanha Desconto para Sempre (DD+FE)"
        contracted_power: "6.9 kVA"
        price_ponta_mwh: 258.0
        price_cheias_mwh: 162.0
        price_vazio_mwh: 112.0

### --- SIMULATED TODAY 15-MIN BLOCKS (€/MWh for Phase 1 Compatibility) --- #
        today_hours: >-
          {% set p_ponta  = 258.0 %}
          {% set p_cheias = 162.0 %}
          {% set p_vazio  = 112.0 %}
          {% set ns = namespace(items=[]) %}
          {% set base = today_at('00:00:00') %}
          {% for i in range(96) %}
            {% set dt = base + timedelta(minutes=i*15) %}
            {% set time_num = dt.hour + (dt.minute / 60) %}
            {% set is_dst = (dt.strftime('%z') == '+0100') %}
            {% set p = p_vazio %}
            {% if time_num >= 8.0 and time_num < 22.0 %}
              {% if is_dst %}
                {% if (time_num >= 10.5 and time_num < 13.0) or (time_num >= 19.5 and time_num < 21.0) %}
                  {% set p = p_ponta %}
                {% else %}
                  {% set p = p_cheias %}
                {% endif %}
              {% else %}
                {% if (time_num >= 9.5 and time_num < 12.0) or (time_num >= 18.5 and time_num < 21.0) %}
                  {% set p = p_ponta %}
                {% else %}
                  {% set p = p_cheias %}
                {% endif %}
              {% endif %}
            {% endif %}
            {% set ns.items = ns.items + [(dt.isoformat(), p)] %}
          {% endfor %}
          {{ dict(ns.items) }}

        ### --- SIMULATED TOMORROW 15-MIN BLOCKS (€/MWh for Phase 1 Compatibility) --- #
        tomorrow_hours: >-
          {% set p_ponta  = 258.0 %}
          {% set p_cheias = 162.0 %}
          {% set p_vazio  = 112.0 %}
          {% set ns = namespace(items=[]) %}
          {% set base = today_at('00:00:00') + timedelta(days=1) %}
          {% for i in range(96) %}
            {% set dt = base + timedelta(minutes=i*15) %}
            {% set time_num = dt.hour + (dt.minute / 60) %}
            {% set is_dst = (dt.strftime('%z') == '+0100') %}
            {% set p = p_vazio %}
            {% if time_num >= 8.0 and time_num < 22.0 %}
              {% if is_dst %}
                {% if (time_num >= 10.5 and time_num < 13.0) or (time_num >= 19.5 and time_num < 21.0) %}
                  {% set p = p_ponta %}
                {% else %}
                  {% set p = p_cheias %}
                {% endif %}
              {% else %}
                {% if (time_num >= 9.5 and time_num < 12.0) or (time_num >= 18.5 and time_num < 21.0) %}
                  {% set p = p_ponta %}
                {% else %}
                  {% set p = p_cheias %}
                {% endif %}
              {% endif %}
            {% endif %}
            {% set ns.items = ns.items + [(dt.isoformat(), p)] %}
          {% endfor %}
          {{ dict(ns.items) }}

### COOPERNICO bi-horario

    - unique_id: coopernico_spot_price_bihorario
      name: "Coopernico Spot Price Bihorario"
      unit_of_measurement: '€/MWh'
      availability: "{{ has_value('sensor.omie_spot_price_pt') }}"
      state_class: measurement
      state: >
        {% set PM = states('sensor.omie_spot_price_pt') | float(0) %}
        {% set CS_CR = 9.0 %}
        {% set FP = 0.15 %}
        {% set k = 9.0 %}
        {% set TSE = 2.067 %}
        {% set IEC = 1.0 %}
        {% set TAR_vazio = 15.8 %}
        {% set TAR_fora_vazio = 83.5 %}
        {% set hour = now().hour + (now().minute / 60.0) %}
        {% set TAR = TAR_vazio if hour < 8.0 or hour >= 22.0 else TAR_fora_vazio %}

        {{ ((((PM + CS_CR) * (1 + FP)) + k + TSE + IEC + TAR) * 1.23) | round(2) }}
      attributes:
        friendly_name: "Coopérnico Base (Bi-horário)"
        formula: "(((PM + CS_CR) * (1 + FP)) + k + TSE + IEC + TAR) * 1.23"
        today_hours: >
          {% set PM_data = state_attr('sensor.omie_spot_price_pt', 'today_hours') %}
          {% if PM_data %}
            {% set ns = namespace(hourly=[]) %}
            {% for h, PM in PM_data.items() %}
              {% if PM != None %}
                {% set time_val = h.hour + (h.minute / 60.0) %}
                {% set TAR = 15.8 if time_val < 8.0 or time_val >= 22.0 else 83.5 %}
                {% set price = ((((PM + 9.0) * 1.15) + 9.0 + 2.067 + 1.0 + TAR) * 1.23) | round(2) %}
              {% else %}
                {% set price = None %}
              {% endif %}
              {% set ns.hourly = ns.hourly + [(h.isoformat(), price)] %}
            {% endfor %}
            {{ dict(ns.hourly) }}
          {% else %}
            {}
          {% endif %}
        tomorrow_hours: >
          {% set PM_data = state_attr('sensor.omie_spot_price_pt', 'tomorrow_hours') %}
          {% if PM_data %}
            {% set ns = namespace(hourly=[]) %}
            {% for h, PM in PM_data.items() %}
              {% if PM != None %}
                {% set time_val = h.hour + (h.minute / 60.0) %}
                {% set TAR = 15.8 if time_val < 8.0 or time_val >= 22.0 else 83.5 %}
                {% set price = ((((PM + 9.0) * 1.15) + 9.0 + 2.067 + 1.0 + TAR) * 1.23) | round(2) %}
              {% else %}
                {% set price = None %}
              {% endif %}
              {% set ns.hourly = ns.hourly + [(h.isoformat(), price)] %}
            {% endfor %}
            {{ dict(ns.hourly) }}
          {% else %}
            {}
          {% endif %}

### COOPERNICO tri-horario

    - unique_id: coopernico_spot_price_trihorario
      name: "Coopernico Spot Price Trihorario"
      unit_of_measurement: '€/MWh'
      availability: "{{ has_value('sensor.omie_spot_price_pt') }}"
      state_class: measurement
      state: >
        {% set PM = states('sensor.omie_spot_price_pt') | float(0) %}
        {% set CS_CR = 9.0 %}
        {% set FP = 0.15 %}
        {% set k = 9.0 %}
        {% set TSE = 2.067 %}
        {% set IEC = 1.0 %}
        {% set TAR_vazio = 15.8 %}
        {% set TAR_cheias = 41.2 %}
        {% set TAR_ponta = 245.2 %}

        {% set is_summer = now().dst() is not none and now().dst().total_seconds() > 0 %}
        {% set hour = now().hour + (now().minute / 60.0) %}

        {% if is_summer %}
          {# Summer Schedule #}
          {% if (hour >= 10.5 and hour < 13.0) or (hour >= 19.5 and hour < 21.0) %}
            {% set TAR = TAR_ponta %}
          {% elif (hour >= 8.0 and hour < 10.5) or (hour >= 13.0 and hour < 19.5) or (hour >= 21.0 and hour < 22.0) %}
            {% set TAR = TAR_cheias %}
          {% else %}
            {% set TAR = TAR_vazio %}
          {% endif %}
        {% else %}
          {# Winter Schedule #}
          {% if (hour >= 9.0 and hour < 10.5) or (hour >= 18.0 and hour < 20.5) %}
            {% set TAR = TAR_ponta %}
          {% elif (hour >= 8.0 and hour < 9.0) or (hour >= 10.5 and hour < 18.0) or (hour >= 20.5 and hour < 22.0) %}
            {% set TAR = TAR_cheias %}
          {% else %}
            {% set TAR = TAR_vazio %}
          {% endif %}
        {% endif %}

        {{ ((((PM + CS_CR) * (1 + FP)) + k + TSE + IEC + TAR) * 1.23) | round(2) }}
      attributes:
        friendly_name: "Coopérnico Tri-horário (Luz)"
        formula: "(((PM + CS_CR) * (1 + FP)) + k + TSE + IEC + TAR) * 1.23"
        today_hours: >
          {% set PM_data = state_attr('sensor.omie_spot_price_pt', 'today_hours') %}
          {% if PM_data %}
            {% set ns = namespace(hourly=[]) %}
            {% for h, PM in PM_data.items() %}
              {% if PM != None %}
                {% set is_summer = h.dst() is not none and h.dst().total_seconds() > 0 %}
                {% set time_val = h.hour + (h.minute / 60.0) %}
                {% if is_summer %}
                  {% if (time_val >= 10.5 and time_val < 13.0) or (time_val >= 19.5 and time_val < 21.0) %}
                    {% set TAR = 245.2 %}
                  {% elif (time_val >= 8.0 and time_val < 10.5) or (time_val >= 13.0 and time_val < 19.5) or (time_val >= 21.0 and time_val < 22.0) %}
                    {% set TAR = 41.2 %}
                  {% else %}
                    {% set TAR = 15.8 %}
                  {% endif %}
                {% else %}
                  {% if (time_val >= 9.0 and time_val < 10.5) or (time_val >= 18.0 and time_val < 20.5) %}
                    {% set TAR = 245.2 %}
                  {% elif (time_val >= 8.0 and time_val < 9.0) or (time_val >= 10.5 and time_val < 18.0) or (time_val >= 20.5 and time_val < 22.0) %}
                    {% set TAR = 41.2 %}
                  {% else %}
                    {% set TAR = 15.8 %}
                  {% endif %}
                {% endif %}
                {% set price = ((((PM + 9.0) * 1.15) + 9.0 + 2.067 + 1.0 + TAR) * 1.23) | round(2) %}
              {% else %}
                {% set price = None %}
              {% endif %}
              {% set ns.hourly = ns.hourly + [(h.isoformat(), price)] %}
            {% endfor %}
            {{ dict(ns.hourly) }}
          {% else %}
            {}
          {% endif %}
        tomorrow_hours: >
          {% set PM_data = state_attr('sensor.omie_spot_price_pt', 'tomorrow_hours') %}
          {% if PM_data %}
            {% set ns = namespace(hourly=[]) %}
            {% for h, PM in PM_data.items() %}
              {% if PM != None %}
                {% set is_summer = h.dst() is not none and h.dst().total_seconds() > 0 %}
                {% set time_val = h.hour + (h.minute / 60.0) %}
                {% if is_summer %}
                  {% if (time_val >= 10.5 and time_val < 13.0) or (time_val >= 19.5 and time_val < 21.0) %}
                    {% set TAR = 245.2 %}
                  {% elif (time_val >= 8.0 and time_val < 10.5) or (time_val >= 13.0 and time_val < 19.5) or (time_val >= 21.0 and time_val < 22.0) %}
                    {% set TAR = 41.2 %}
                  {% else %}
                    {% set TAR = 15.8 %}
                  {% endif %}
                {% else %}
                  {% if (time_val >= 9.0 and time_val < 10.5) or (time_val >= 18.0 and time_val < 20.5) %}
                    {% set TAR = 245.2 %}
                  {% elif (time_val >= 8.0 and time_val < 9.0) or (time_val >= 10.5 and time_val < 18.0) or (time_val >= 20.5 and time_val < 22.0) %}
                    {% set TAR = 41.2 %}
                  {% else %}
                    {% set TAR = 15.8 %}
                  {% endif %}
                {% endif %}
                {% set price = ((((PM + 9.0) * 1.15) + 9.0 + 2.067 + 1.0 + TAR) * 1.23) | round(2) %}
              {% else %}
                {% set price = None %}
              {% endif %}
              {% set ns.hourly = ns.hourly + [(h.isoformat(), price)] %}
            {% endfor %}
            {{ dict(ns.hourly) }}
          {% else %}
            {}
          {% endif %}

### G9 SMART DYNAMIC bi-horario
    
    - unique_id: g9_smart_dynamic_bihorario
      name: "G9 Smart Dynamic Price Bihorario"
      unit_of_measurement: '€/MWh'
      availability: "{{ has_value('sensor.omie_spot_price_pt') }}"
      state_class: measurement
      state: >
        {% set PM = states('sensor.omie_spot_price_pt')|float -%}
        {% set Fadeq = 1.02 -%}
        {% set Perdas = 0.16 -%}
        {% set GGS = 10.0 -%}
        {% set AC = 5.5 -%}
        {% set TSE = 2.0666 -%}
        {% set TAR_vazio = 15.8 -%}
        {% set TAR_fora_vazio = 83.5 -%}
        {% set TAR = TAR_vazio if now().hour < 8 or now().hour > 21 else TAR_fora_vazio -%}
        
        {% set PE = (PM * Fadeq) * (1 + Perdas) + GGS + AC -%}
        {{ (PE + TAR + TSE) | round(2) }}
      attributes:
        friendly_name: "G9 Smart Dynamic (Bi-horário)"
        formula: "PE + TAR + TSE"
        PM: "{{ states('sensor.omie_spot_price_pt')|float }}"
        Fadeq: "{{ 1.02 }}"
        Perdas: "{{ 0.16 }}"
        GGS: "{{ 10.0 }}"
        AC: "{{ 5.5 }}"
        TAR_vazio: 15.8
        TAR_fora_vazio: 83.5
        today_hours: >
            {% set Fadeq = 1.02 -%}
            {% set Perdas = 0.16 -%}
            {% set GGS = 10.0 -%}
            {% set AC = 5.5 -%}
            {% set TSE = 2.0666 -%}
            
            {% set ns = namespace(hourly_data=[]) %}
            {% for h, PM in state_attr('sensor.omie_spot_price_pt', 'today_hours').items() -%}
              {% set TAR = 15.8 if h.hour < 8 or h.hour > 21 else 83.5 -%}
              {% if PM == None %}
                {% set price = None %}
              {% else %}
                {% set PE = (PM * Fadeq) * (1 + Perdas) + GGS + AC -%}
                {% set price = (PE + TAR + TSE) | round(2) %}
              {% endif %}
              {% set ns.hourly_data = ns.hourly_data + [(h.isoformat(), price)] %}
            {% endfor -%}
            {{ dict(ns.hourly_data) }}
        tomorrow_hours: >
            {% set Fadeq = 1.02 -%}
            {% set Perdas = 0.16 -%}
            {% set GGS = 10.0 -%}
            {% set AC = 5.5 -%}
            {% set TSE = 2.0666 -%}
            
            {% set ns = namespace(hourly_data=[]) %}
            {% for h, PM in state_attr('sensor.omie_spot_price_pt', 'tomorrow_hours').items() -%}
              {% set TAR = 15.8 if h.hour < 8 or h.hour > 21 else 83.5 -%}
              {% if PM == None %}
                {% set price = None %}
              {% else %}
                {% set PE = (PM * Fadeq) * (1 + Perdas) + GGS + AC -%}
                {% set price = (PE + TAR + TSE) | round(2) %}
              {% endif %}
              {% set ns.hourly_data = ns.hourly_data + [(h.isoformat(), price)] %}
            {% endfor -%}
            {{ dict(ns.hourly_data) }}
    
### G9 SMART DYNAMIC tri-horario
    
    - unique_id: g9_smart_dynamic_trihorario
      name: "G9 Smart Dynamic Price Trihorario"
      unit_of_measurement: '€/MWh'
      availability: "{{ has_value('sensor.omie_spot_price_pt') }}"
      state_class: measurement
      state: >
        {% set PM = states('sensor.omie_spot_price_pt')|float -%}
        {% set Fadeq = 1.02 -%}
        {% set Perdas = 0.16 -%}
