        friendly_name: "G9 Smart Dynamic (Tri-horário)"
        formula: "PE + TAR + TSE"
        PM: "{{ states('sensor.omie_spot_price_pt')|float }}"
        Fadeq: "{{ 1.02 }}"
        Perdas: "{{ 0.16 }}"
        GGS: "{{ 10.0 }}"
        AC: "{{ 5.5 }}"
        TAR_vazio: 15.8
        TAR_cheias: 63.8
        TAR_ponta: 141.6
        today_hours: >
            {% set Fadeq = 1.02 -%}
            {% set Perdas = 0.16 -%}
            {% set GGS = 10.0 -%}
            {% set AC = 5.5 -%}
            {% set TSE = 2.0666 -%}
    
            {% set ns = namespace(hourly_data=[]) %}
            {% for h, PM in state_attr('sensor.omie_spot_price_pt', 'today_hours').items() -%}
              {% set hour = h.hour %}
              {% if hour >= 9 and hour < 10.5 or hour >= 18 and hour < 20.5 %}
                {% set TAR = 141.6 %}
              {% elif hour >= 7 and hour < 9 or hour >= 10.5 and hour < 18 or hour >= 20.5 and hour < 22 %}
                {% set TAR = 63.8 %}
              {% else %}
                {% set TAR = 15.8 %}
              {% endif %}
    
              {% if PM == None %}
                {% set price = None %}
              {% else %}
                {% set PE = (PM * Fadeq) * (1 + Perdas) + GGS + AC -%}
                {% set price = (PE + TAR + TSE) | round(2) %}
              {% endif %}
              {% set ns.hourly_data = ns.hourly_data + [(h.isoformat(), price)] %}
            {% endfor -%}
            {{ dict(ns.hourly_data) }}
        tomorrow_hours: >
            {% set Fadeq = 1.02 -%}
            {% set Perdas = 0.16 -%}
            {% set GGS = 10.0 -%}
            {% set AC = 5.5 -%}
            {% set TSE = 2.0666 -%}
    
            {% set ns = namespace(hourly_data=[]) %}
            {% for h, PM in state_attr('sensor.omie_spot_price_pt', 'tomorrow_hours').items() -%}
              {% set hour = h.hour %}
              {% if hour >= 9 and hour < 10.5 or hour >= 18 and hour < 20.5 %}
                {% set TAR = 141.6 %}
              {% elif hour >= 7 and hour < 9 or hour >= 10.5 and hour < 18 or hour >= 20.5 and hour < 22 %}
                {% set TAR = 63.8 %}
              {% else %}
                {% set TAR = 15.8 %}
              {% endif %}
    
              {% if PM == None %}
                {% set price = None %}
              {% else %}
                {% set PE = (PM * Fadeq) * (1 + Perdas) + GGS + AC -%}
                {% set price = (PE + TAR + TSE) | round(2) %}
              {% endif %}
              {% set ns.hourly_data = ns.hourly_data + [(h.isoformat(), price)] %}
            {% endfor -%}
            {{ dict(ns.hourly_data) }}

