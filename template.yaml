        {% set max_pen = 0.2 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          100 
        {% else %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma * pi / 180) %}
          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
          {% endif %}
        {% endif %}

    # =========================================================
    # 4. MASTER BATHROOM (SW - 235°)
    # =========================================================
    - name: "Optimal Shade Position Master Bathroom"
      unique_id: optimal_shade_position_master_bathroom
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 235 %}
        {% set h_win = 1.0 %}
        {% set d_over = 0.1 %}
        {% set h_over = 0.3 %}
        {% set max_pen = 0.2 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          100 
        {% else %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma * pi / 180) %}
          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
          {% endif %}
        {% endif %}

    # =========================================================
    # 5. ENTRADA SLIDING COVER (SW - 235°)
    # =========================================================
    - name: "Optimal Shade Position Entrada Cover"
      unique_id: optimal_shade_position_entrada_cover
      unit_of_measurement: "%"
      state: >-
        {% set az_wall = 235 %}
        {% set h_win = 2.5 %}
        {% set h_over = 0.2 %}
        {% set min_ext = 0.8 %}
        {% set max_ext = 3.5 %}
        {% set angle_deg = 20 %}
        
        {% set az_sun = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set el_sun = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set diff = (az_sun - az_wall) | abs %}
        {% set gamma = diff if diff <= 180 else 360 - diff %}
        {% set pi = 3.14159 %}
        
        {% if gamma > 90 %} 
          0 
        {% else %}
          {% set gamma_rad = gamma * pi / 180 %}
          {% set slope_rad = angle_deg * pi / 180 %}
          {% set tan_beta = tan(el_sun * pi / 180) / cos(gamma_rad) %}
          {% set denominator = sin(slope_rad) + (cos(slope_rad) * tan_beta) %}
          
          {% if denominator > 0 %}
            {% set req_L = (h_over + h_win) / denominator %}
          {% else %}
            {% set req_L = max_ext %}
          {% endif %}
          
          {% set final_L = [[req_L, min_ext] | max, max_ext] | min %}
          {% set pct_extended = ((final_L - min_ext) / (max_ext - min_ext)) * 100 %}
          
          {{ [[pct_extended, 0] | max, 80] | min | round(0) }}
        {% endif %}

#####################################################################################
#   VICTRON & SOLAX coordination
#####################################################################################

    - name: "Total House Load"
      unique_id: total_house_load
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:flash
      state: >-
        {% set solax = states('sensor.solax_house_load') | float(0) %}
        {% set victron_grid = states('sensor.garage_gx_device_grid_power_l1') | float(0) %}
        {% set victron_load = states('sensor.garage_gx_device_consumption_power_l1') | float(0) %}
        {{ (solax - victron_grid + victron_load) }}

    - name: "Total House SOC"
      unique_id: total_house_soc
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      icon: mdi:battery-charging-50
      state: >-
        {% set solax_avail = has_value('sensor.solax_battery_capacity') %}
        {% set victron_avail = has_value('sensor.garage_gx_device_dc_battery_charge') %}

        {% set solax_soc = states('sensor.solax_battery_capacity') | float(0) if solax_avail else 0 %}
        {% set victron_soc = states('sensor.garage_gx_device_dc_battery_charge') | float(0) if victron_avail else 0 %}

        {% set w_solax = 11.6 if solax_avail else 0 %}
        {% set w_victron = 6.4 if victron_avail else 0 %}

        {% set total_weight = w_solax + w_victron %}

        {% if total_weight > 0 %}
          {% set raw_soc = ((solax_soc * w_solax) + (victron_soc * w_victron)) / total_weight %}
          {{ [[raw_soc, 0] | max, 100] | min | round(1) }}
        {% else %}
          unavailable
        {% endif %}
      availability: >-
        {{ has_value('sensor.solax_battery_capacity') or has_value('sensor.garage_gx_device_dc_battery_charge') }}

    - name: "Total Battery Power Charge"
      unique_id: total_battery_power_charge
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-charging
      state: >-
        {% set solax_pwr = states('sensor.solax_battery_power_charge') | float(0) %}
        {% set victron_pwr = states('sensor.gx_device_dc_battery_power') | float(0) %}

        {{ (solax_pwr + victron_pwr) | round(2) }}
      availability: >-
        {{ has_value('sensor.solax_battery_power_charge') or has_value('sensor.gx_device_dc_battery_power') }}
