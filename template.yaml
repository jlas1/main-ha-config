          {% set shadow_drop = d_over * tan_beta %}
          
          {% if shadow_drop >= (h_over + h_win) %} 
            100 
          {% else %}
            {% set h_open = max_pen * tan_beta %}
            {% set raw_pct = (h_open / h_win) * 100 %}
            {{ [[(15 + (raw_pct * 0.85)), 15] | max, 100] | min | round(0) }}
