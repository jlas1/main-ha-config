    - name: "Battery SoC Simulation"
      unique_id: battery_soc_simulation
      unit_of_measurement: "%"
      device_class: battery
      state: >
        {{ states('sensor.solax_local_battery_soc') | int(11) }}
      attributes:
        forecast_path: >
          {% set avg_load = 0.65 %}
          {% set battery_cap_kwh = 10.0 %}
          {% set current_soc = states('sensor.solax_local_battery_soc') | float(11) %}
          
          {% set f_today = state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedHourly') or [] %}
          {% set f_tomorrow = state_attr('sensor.solcast_pv_forecast_forecast_tomorrow', 'detailedHourly') or [] %}
          {% set full_forecast = f_today + f_tomorrow %}
          
          {# Filter: Include everything from the START of the current hour #}
          {% set now_ts = as_timestamp(now().replace(minute=0, second=0, microsecond=0)) %}

          {% set valid_hours = namespace(data=[]) %}
          {% for hour in full_forecast %}
            {% if as_timestamp(hour.period_start) >= now_ts %}
              {% set valid_hours.data = valid_hours.data + [hour] %}
            {% endif %}
          {% endfor %}

          {% if valid_hours.data | count > 0 %}
            {% set ns = namespace(path=[], current_kwh=(current_soc - 11) / 8.9) %}
            
            {% for r in valid_hours.data[:24] %}
              {% set pv_est = r.pv_estimate | float(0) %}
              {% set pv_low = r.pv_estimate10 | default(pv_est) | float(0) %}
              {% set pv_safe = (pv_est * 0.8) + (pv_low * 0.2) %}
              
              {% set net = pv_safe - avg_load %}
              {% set ns.current_kwh = [[ns.current_kwh + net, 0] | max, battery_cap_kwh] | min %}
              
              {% set step_soc = (ns.current_kwh * 8.9 + 11) | round(0) | int %}
              {% set ns.path = ns.path + [{"time": r.period_start, "soc": step_soc}] %}
            {% endfor %}
            {{ ns.path | to_json }} {# <--- ADDED | to_json HERE #}
          {% else %}
            {{ [] | to_json }} {# <--- ADDED | to_json HERE #}
          {% endif %}

    - name: "Solar Dump Base Target"
      unit_of_measurement: "%"
      state: >
         {# 1. Fetch P50 state and P10 attribute remaining forecasts #}
         {% set remaining_p50 = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) %}
         {% set remaining_p10 = state_attr('sensor.solcast_pv_forecast_forecast_remaining_today', 'estimate10') | float(remaining_p50) %}

         {# 2. Apply the SolarSafe 80/20 weighted average #}
         {% set remaining = (remaining_p50 * 0.8) + (remaining_p10 * 0.2) %}

         {# 3. Configure Parameters #}
         {% set min_soc = 75.0 %}
         {% set max_soc = 92.0 %}

         {# Tuned for 96% ceiling and 650W baseload #}
         {% set high_pv = 14.3 %}
         {% set low_pv = 5.0 %}

         {# 4. Calculate dynamic target #}
         {% if remaining >= high_pv %}
           {{ min_soc | int }}
         {% elif remaining <= low_pv %}
           {{ max_soc | int }}
         {% else %}
           {% set ratio = (remaining - low_pv) / (high_pv - low_pv) %}
           {{ (max_soc - (ratio * (max_soc - min_soc))) | int }}
         {% endif %}

