    - name: solax_local
      state: > 
            {% if state_attr('sensor.solax_rest_local_new', 'sn')|length == 10  %}
              {{ now().strftime("%H:%M:%S") }}
            {% else %}
              {{ (states('sensor.solax_local')) }}
            {% endif %}
      attributes: 
        sn: >-
            {% if state_attr('sensor.solax_rest_local_new', 'sn')|length == 10 %}
              {{ (state_attr('sensor.solax_rest_local_new', 'sn')) }}
            {% else %}
              {{ (state_attr('sensor.solax_local', 'sn')) }}
            {% endif %}
        ver: >-
          {% if state_attr('sensor.solax_rest_local_new', 'sn')|length == 10 %}
            {{ (state_attr('sensor.solax_rest_local_new', 'ver')) }}
          {% else %}
            {{ (state_attr('sensor.solax_local', 'ver')) }}
          {% endif %}
        type: >-
          {% if state_attr('sensor.solax_rest_local_new', 'sn')|length == 10 %}
            {{ (state_attr('sensor.solax_rest_local_new', 'type')) }}
          {% else %}
            {{ (state_attr('sensor.solax_local', 'type')) }}
          {% endif %}
        Data: >-
          {% if state_attr('sensor.solax_rest_local_new', 'sn')|length == 10 %}
            {{ (state_attr('sensor.solax_rest_local_new', 'Data')) }}
          {% else %}
            {{ (state_attr('sensor.solax_local', 'Data')) }}
          {% endif %}
        Information: >-
          {% if state_attr('sensor.solax_rest_local_new', 'sn')|length == 10 %}
            {{ (state_attr('sensor.solax_rest_local_new', 'Information')) }}
          {% else %}
            {{ (state_attr('sensor.solax_local', 'Information')) }}
          {% endif %}

